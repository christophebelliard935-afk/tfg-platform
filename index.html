<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TFG — Préparation TCF</title>
<style>
  :root{
    --ink:#0E2140;
    --ink-soft:#16305A;
    --ink-softer:#1E3E70;
    --paper:#ECE4CF;
    --paper-soft:#F4EEDF;
    --gold:#C8952A;
    --gold-soft:#E7C888;
    --success:#4C7A5D;
    --success-soft:#D9E6DC;
    --error:#A6432D;
    --error-soft:#EFDAD2;
    --text-ink:#F3EFE4;
    --text-ink-dim:#B9C3D9;
    --text-paper:#16223B;
    --text-paper-dim:#5B5540;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text-ink);
    font-family:var(--font-body);
    min-height:100vh;
  }
  #app{max-width:960px;margin:0 auto;padding:32px 20px 80px;}
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:32px;
    line-height:1.2;
    margin:0 0 10px;
    color:var(--text-ink);
  }
  h2{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--text-ink);
  }
  p.lead{color:var(--text-ink-dim); font-size:15px; line-height:1.6; max-width:560px; margin:0 0 24px;}
  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:8px;
    padding:12px 22px;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .btn-gold{background:var(--gold); color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--text-ink); border:1px solid var(--ink-softer);}
  .btn-ghost:hover{background:var(--ink-soft);}
  input[type=text]{
    font-family:var(--font-body);
    font-size:15px;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--ink-softer);
    background:var(--ink-soft);
    color:var(--text-ink);
    width:100%;
    max-width:320px;
  }
  input[type=text]:focus-visible{outline:2px solid var(--gold); outline-offset:1px;}
  .login-wrap{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
  }
  .card{
    background:var(--paper);
    color:var(--text-paper);
    border-radius:var(--radius);
    padding:22px 22px;
  }
  .card p, .card li{color:var(--text-paper);}
  .card .dim{color:var(--text-paper-dim);}
  .top-row{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;background:var(--gold);
    color:var(--ink); font-family:var(--font-display); font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .brand-name{font-family:var(--font-mono); font-size:12px; letter-spacing:1px; color:var(--text-ink-dim);}
  .grid-dash{
    display:grid; grid-template-columns: 150px 1fr; gap:22px; align-items:start;
  }
  @media (max-width:640px){ .grid-dash{grid-template-columns:1fr;} }

  /* Signature: CECR ladder */
  .ladder{
    background:var(--ink-soft);
    border-radius:var(--radius);
    padding:16px 10px;
    display:flex;
    flex-direction:column-reverse;
    gap:6px;
  }
  .rung{
    border-radius:6px;
    padding:8px 6px;
    text-align:center;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:1px;
    color:var(--text-ink-dim);
    background:var(--ink-softer);
    opacity:.45;
    position:relative;
  }
  .rung.below{opacity:.75;}
  .rung.current{
    opacity:1;
    background:var(--gold);
    color:var(--ink);
    font-weight:700;
    box-shadow:0 0 0 3px rgba(200,149,42,0.25);
  }
  .ladder-caption{font-family:var(--font-mono); font-size:10px; color:var(--text-ink-dim); text-align:center; margin-top:10px; line-height:1.5;}

  .module-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-top:18px;}
  .module-card{
    background:var(--ink-soft);
    border:1px solid var(--ink-softer);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    transition:border-color .12s ease;
  }
  .module-card:hover{border-color:var(--gold);}
  .module-card .m-eyebrow{font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; color:var(--gold-soft); margin-bottom:6px;}
  .module-card h3{font-family:var(--font-display); font-size:17px; margin:0 0 6px; color:var(--text-ink);}
  .module-card p{font-size:12px; color:var(--text-ink-dim); margin:0 0 12px; line-height:1.5;}
  .progress-bar{height:5px; background:var(--ink-softer); border-radius:4px; overflow:hidden;}
  .progress-bar > div{height:100%; background:var(--gold);}
  .progress-label{font-family:var(--font-mono); font-size:10px; color:var(--text-ink-dim); margin-top:6px;}

  .lesson-list{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .lesson-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:8px;
    padding:12px 14px; cursor:pointer;
  }
  .lesson-row:hover{border-color:var(--gold);}
  .lesson-row .status{font-family:var(--font-mono); font-size:11px; color:var(--gold-soft);}
  .lesson-left{display:flex; align-items:center; gap:10px;}
  .level-badge{
    font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.5px;
    color:var(--ink); background:var(--gold-soft); border-radius:5px; padding:2px 7px; flex-shrink:0;
  }
  .level-filter{display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 4px;}
  .level-filter button{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.5px; padding:6px 12px;
    border-radius:6px; border:1px solid var(--ink-softer); background:var(--ink-soft);
    color:var(--text-ink-dim); cursor:pointer;
  }
  .level-filter button.active{background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700;}

  /* Examen blanc */
  .exam-hero{
    background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:var(--radius);
    padding:24px; margin-bottom:30px;
  }
  .exam-level-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:16px;}
  .exam-level-card{
    background:var(--ink); border:1px solid var(--ink-softer); border-radius:10px; padding:16px;
    text-align:center; cursor:pointer; transition:border-color .12s ease;
  }
  .exam-level-card:hover{border-color:var(--gold);}
  .exam-level-card .lvl{font-family:var(--font-display); font-size:22px; color:var(--gold-soft);}
  .exam-level-card .lvl-desc{font-size:11px; color:var(--text-ink-dim); margin-top:4px;}
  .exam-topbar{
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--ink-softer);
  }
  .exam-timer{
    font-family:var(--font-mono); font-size:18px; font-weight:700; color:var(--gold-soft);
    background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:8px; padding:8px 16px;
  }
  .exam-timer.low{color:var(--error); border-color:var(--error);}
  .exam-progress-text{font-family:var(--font-mono); font-size:12px; color:var(--text-ink-dim);}
  .exam-module-tag{
    font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; color:var(--gold-soft);
    text-transform:uppercase; margin-bottom:6px;
  }
  .exam-result-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin:18px 0;}
  .exam-result-card{
    background:var(--ink); border:1px solid var(--ink-softer); border-radius:10px; padding:16px; text-align:center;
  }
  .exam-result-card .label{font-family:var(--font-mono); font-size:10px; color:var(--text-ink-dim); letter-spacing:1px;}
  .exam-result-card .score{font-family:var(--font-display); font-size:26px; color:var(--gold-soft); margin-top:6px;}
  .exam-next-list{display:flex; flex-direction:column; gap:8px; margin-top:16px;}

  /* Simulateur Expression Écrite */
  .sim-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .sim-tab{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.5px; padding:8px 14px;
    border-radius:6px; border:1px solid var(--ink-softer); background:var(--ink-soft);
    color:var(--text-ink-dim); cursor:pointer;
  }
  .sim-tab.active{background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700;}
  .sim-tab.filled::after{content:" ✓"; color:var(--success);}
  .sim-charbar{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0;}
  .sim-charbar button{
    font-family:var(--font-display); font-size:14px; width:32px; height:32px; border-radius:6px;
    border:1px solid #D8CDAE; background:var(--paper-soft); color:var(--text-paper); cursor:pointer;
  }
  .sim-charbar button:hover{border-color:var(--gold);}
  .sim-wordcount{font-family:var(--font-mono); font-size:12px; margin-top:6px;}
  .sim-wordcount.ok{color:var(--success);}
  .sim-wordcount.low, .sim-wordcount.high{color:var(--error);}
  .sim-feedback-card{
    background:var(--ink); border:1px solid var(--ink-softer); border-radius:10px; padding:16px; margin-bottom:14px;
  }
  .sim-feedback-card h3{font-size:16px; margin:0 0 8px;}
  .sim-feedback-list{margin:6px 0 0; padding-left:18px; font-size:13px; line-height:1.6;}
  .sim-feedback-list.good li{color:var(--success);}
  .sim-feedback-list.improve li{color:var(--gold-soft);}
  .sim-loading{font-family:var(--font-mono); font-size:13px; color:var(--text-ink-dim); margin-top:16px;}

  /* Cours et méthode */
  .method-card{
    background:var(--ink-soft); border:1px solid var(--gold-soft); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:20px;
  }
  .method-card .m-tag{font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; color:var(--gold-soft); text-transform:uppercase; margin-bottom:8px;}
  .method-card h3{font-family:var(--font-display); font-size:17px; margin:0 0 8px; color:var(--text-ink);}
  .method-card p{font-size:13px; line-height:1.6; margin:0; color:var(--text-ink-dim);}
  .cours-card{
    background:var(--paper-soft); border:1px solid var(--gold); border-radius:10px;
    padding:16px 18px; margin-bottom:16px; max-width:640px;
  }
  .cours-card .c-tag{font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; color:var(--gold); text-transform:uppercase; margin-bottom:8px;}
  .cours-card p{font-size:14px; line-height:1.6; margin:0; color:var(--text-paper);}

  /* Formules d'accès */
  .plan-badge{
    font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.5px;
    padding:3px 8px; border-radius:5px; margin-left:8px;
  }
  .plan-badge.free{background:var(--ink-softer); color:var(--text-ink-dim);}
  .plan-badge.premium{background:var(--gold); color:var(--ink);}
  .lock-row{opacity:.55; cursor:pointer;}
  .lock-icon{margin-right:4px;}
  .plans-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:20px 0;}
  .plan-card{
    background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:var(--radius);
    padding:20px; display:flex; flex-direction:column; gap:12px;
  }
  .plan-card.highlight{border-color:var(--gold); box-shadow:0 0 0 2px rgba(200,149,42,0.2);}
  .plan-card h3{font-family:var(--font-display); font-size:20px; margin:0; color:var(--text-ink);}
  .plan-card .price{font-family:var(--font-display); font-size:26px; color:var(--gold-soft);}
  .plan-card .duration{font-family:var(--font-mono); font-size:11px; color:var(--text-ink-dim);}
  .plan-card ul{margin:0; padding-left:18px; font-size:13px; color:var(--text-ink-dim); line-height:1.6;}
  .activation-card{
    background:var(--paper); color:var(--text-paper); border-radius:var(--radius); padding:22px; margin-top:24px; max-width:640px;
  }
  .activation-card h2{color:var(--text-paper);}
  .activation-card input[type=text]{max-width:280px; margin-right:10px;}
  .payment-steps{margin:10px 0 0; padding-left:18px; font-size:13px; line-height:1.7; color:var(--text-paper);}

  /* Espace formateur */
  .admin-code-display{
    font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--gold);
    background:var(--paper-soft); border:1px dashed var(--gold); border-radius:8px;
    padding:14px 18px; margin-top:14px; letter-spacing:1px; word-break:break-all;
  }
  table.codes-table{border-collapse:collapse; width:100%; font-size:12px; margin-top:16px;}
  table.codes-table th, table.codes-table td{border:1px solid var(--ink-softer); padding:6px 8px; text-align:left; color:var(--text-ink-dim);}
  table.codes-table th{color:var(--text-ink); font-family:var(--font-mono); font-size:10px;}
  .status-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}
  .status-dot.free{background:var(--success);}
  .status-dot.used{background:var(--error);}

  /* Générateur IA TFG */
  .gen-form{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:16px 0;}
  .gen-field label{display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.5px; color:var(--text-ink-dim); margin-bottom:5px; text-transform:uppercase;}
  .gen-field select{
    width:100%; padding:9px 10px; border-radius:6px; background:var(--ink); color:var(--text-ink);
    border:1px solid var(--ink-softer); font-family:var(--font-mono); font-size:12px;
  }
  .gen-progress{font-family:var(--font-mono); font-size:12px; color:var(--gold-soft); margin:10px 0;}
  .ex-tabs{display:flex; gap:8px; margin:16px 0;}
  .ex-tab{
    font-family:var(--font-mono); font-size:11px; padding:7px 14px; border-radius:6px;
    border:1px solid var(--ink-softer); background:var(--ink-soft); color:var(--text-ink-dim); cursor:pointer;
  }
  .ex-tab.active{background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700;}
  .ex-card{
    background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:8px;
    padding:14px 16px; margin-bottom:10px;
  }
  .ex-card.draft{border-color:var(--error-soft);}
  .ex-card.validated{border-color:var(--success);}
  .ex-card-head{display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:10px; flex-wrap:wrap;}
  .ex-card-tags{display:flex; gap:6px; flex-wrap:wrap; font-family:var(--font-mono); font-size:10px;}
  .ex-tag{background:var(--ink); border:1px solid var(--ink-softer); border-radius:5px; padding:2px 7px; color:var(--text-ink-dim);}
  .ex-status-badge{font-family:var(--font-mono); font-size:10px; font-weight:700; padding:3px 8px; border-radius:5px;}
  .ex-status-badge.draft{background:var(--error-soft); color:#3a0f0f;}
  .ex-status-badge.validated{background:var(--success); color:#0f2a12;}
  .ex-detail{margin-top:12px; padding-top:12px; border-top:1px solid var(--ink-softer); font-size:13px; line-height:1.6;}
  .ex-issues{list-style:none; padding:0; margin:8px 0;}
  .ex-issues li{color:var(--error-soft); font-size:12px; margin-bottom:4px;}
  .ex-issues li::before{content:"⚠ "; }

  /* Progression CECRL */
  .prog-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:16px 0;}
  .prog-card{background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:10px; padding:14px 16px;}
  .prog-card.current{border-color:var(--gold);}
  .prog-card .p-title{font-family:var(--font-display); font-size:16px; margin-bottom:8px;}
  .prog-bar-track{background:var(--ink); border-radius:6px; height:8px; overflow:hidden; margin:6px 0;}
  .prog-bar-fill{height:100%; background:var(--gold); border-radius:6px;}
  .prog-stat-row{display:flex; justify-content:space-between; font-size:11px; color:var(--text-ink-dim); margin-top:4px;}
  .comp-badge{display:inline-block; font-family:var(--font-mono); font-size:10px; padding:3px 8px; border-radius:5px; margin:2px;}
  .comp-badge.strong{background:var(--success); color:#0f2a12;}
  .comp-badge.weak{background:var(--error-soft); color:#3a0f0f;}
  .stat-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:16px 0;}
  .stat-tile{background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:10px; padding:14px; text-align:center;}
  .stat-tile .val{font-family:var(--font-display); font-size:24px; color:var(--gold-soft);}
  .stat-tile .lbl{font-family:var(--font-mono); font-size:10px; color:var(--text-ink-dim); margin-top:4px;}
  .reco-card{background:var(--ink-soft); border:1px solid var(--gold); border-radius:10px; padding:18px 20px; margin:16px 0;}

  /* Hub Tests & Examens */
  .hub-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:20px 0;}
  .hub-card{
    background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:var(--radius);
    padding:22px; cursor:pointer; transition:border-color .12s ease;
  }
  .hub-card:hover{border-color:var(--gold);}
  .hub-card .h-icon{font-size:28px; margin-bottom:10px;}
  .hub-card h3{font-family:var(--font-display); font-size:18px; margin:0 0 6px;}
  .hub-card p{font-size:13px; color:var(--text-ink-dim); margin:0;}
  .history-row{
    display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
    border:1px solid var(--ink-softer); border-radius:8px; margin-bottom:6px; font-size:13px;
  }

  /* Mes erreurs */
  .difficulty-row{
    display:flex; justify-content:space-between; align-items:center; padding:12px 16px;
    border:1px solid var(--error-soft); border-radius:8px; margin-bottom:8px; background:var(--ink-soft);
  }
  .difficulty-row .d-count{font-family:var(--font-mono); font-size:11px; color:var(--error-soft); font-weight:700;}
  .error-row{
    border:1px solid var(--ink-softer); border-radius:8px; padding:12px 14px; margin-bottom:8px; font-size:13px; background:var(--ink-soft);
  }
  .error-row .e-meta{font-family:var(--font-mono); font-size:10px; color:var(--text-ink-dim); margin-bottom:6px;}
  .error-row .e-wrong{color:var(--error-soft);}
  .error-row .e-right{color:var(--success);}

  /* Gestion des groupes */
  .group-card{background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:10px; padding:16px; margin-bottom:12px;}
  .group-status{font-family:var(--font-mono); font-size:10px; font-weight:700; padding:3px 8px; border-radius:5px;}
  .group-status.active{background:var(--success); color:#0f2a12;}
  .group-status.upcoming{background:var(--gold-soft); color:#3a2a05;}
  .group-status.expired{background:var(--error-soft); color:#3a0f0f;}
  .checkbox-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin:10px 0;}
  .checkbox-item{display:flex; align-items:center; gap:6px; font-size:13px;}
  .member-chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--ink); border:1px solid var(--ink-softer);
    border-radius:6px; padding:4px 8px; margin:3px; font-size:12px;
  }
  .member-chip button{background:none; border:none; color:var(--error-soft); cursor:pointer; font-size:14px; padding:0;}

  /* Messagerie — messages privés élève/formateur (inchangé) */
  .msg-thread{display:flex; flex-direction:column; gap:10px; max-width:600px; margin:16px 0;}
  .msg-bubble{max-width:75%; padding:10px 14px; border-radius:10px; font-size:14px; line-height:1.5;}
  .msg-bubble.from-etudiant{align-self:flex-end; background:var(--gold); color:var(--ink);}

<script>
const SUPABASE_URL = "https://cvcgkdcghnzwctimaeor.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_DtqfZ5x3A8HZftCdn2daUA_HNMEb-wp";
(function () {
  async function sbFetch(path, options = {}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        "Content-Type": "application/json",
        ...(options.headers || {}),
      },
    });
    if (!res.ok) {
      const text = await res.text().catch(() => "");
      throw new Error(`Supabase error ${res.status}: ${text}`);
    }
    return res;
  }
  window.storage = {
    async get(key, shared = false) {
      const res = await sbFetch(`kv_store?key=eq.${encodeURIComponent(key)}&shared=eq.${shared}&select=value`);
      const rows = await res.json();
      if (!rows.length) return null;
      return { key, value: rows[0].value, shared };
    },
    async set(key, value, shared = false) {
      await sbFetch(`kv_store`, {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates" },
        body: JSON.stringify([{ key, value, shared }]),
      });
      return { key, value, shared };
    },
    async delete(key, shared = false) {
      await sbFetch(`kv_store?key=eq.${encodeURIComponent(key)}&shared=eq.${shared}`, { method: "DELETE" });
      return { key, deleted: true, shared };
    },
    async list(prefix = "", shared = false) {
      const res = await sbFetch(`kv_store?key=like.${encodeURIComponent(prefix)}*&shared=eq.${shared}&select=key`);
      const rows = await res.json();
      return { keys: rows.map((r) => r.key), prefix, shared };
    },
  };
})();
</script>

        {
          id: "co4", title: "Extrait d'interview", level: "B2", subLevel: "Base",
          cours: "Dans une interview, distingue bien la question du journaliste de la réponse de l'invité : la question introduit le thème, la réponse contient l'information ou l'opinion à retenir. Repère les formulations comme « je dirais que » qui annoncent l'idée principale.",
          transcript: "Journaliste : Selon vous, quelle est la clé pour réussir un examen de langue ? Invité : Je dirais la régularité. Il vaut mieux s'entraîner vingt minutes chaque jour plutôt que cinq heures une seule fois par semaine. Il faut aussi varier les compétences travaillées : écoute, lecture, écriture et expression orale, pour progresser de façon équilibrée.",

        {
          id: "co5", title: "Chronique : l'IA et l'emploi", level: "C1", subLevel: "Base",
          cours: "Une chronique présente souvent plusieurs points de vue sur un sujet avant de conclure. Repère les marqueurs d'opposition (si certains... d'autres...) qui séparent les positions, et la phrase de synthèse finale qui résume le message clé.",
          transcript: "Bonsoir à tous. Ce soir, penchons-nous sur un sujet qui suscite autant d'espoirs que d'inquiétudes : l'essor de l'intelligence artificielle sur le marché du travail. Si certains y voient une formidable opportunité de gain de productivité, d'autres redoutent une vague de suppressions de postes, notamment dans les métiers administratifs. Les experts s'accordent néanmoins sur un point : la capacité d'adaptation et la formation continue seront déterminantes pour tirer parti de cette transformation plutôt que de la subir.",

            {q:"Quelles sont les deux réactions opposées évoquées ?", options:["Indifférence et enthousiasme","Espoir de productivité et crainte de suppressions de postes","Colère et résignation","Curiosité et rejet total"], answer:1},
            {q:"Quels métiers sont cités comme particulièrement exposés ?", options:["Les métiers manuels","Les métiers administratifs","Les métiers artistiques","Les métiers médicaux"], answer:1},
            {q:"Sur quel point les experts s'accordent-ils selon le texte ?", options:["Il faut interdire l'IA","L'adaptation et la formation continue seront déterminantes","Les emplois sont tous menacés de la même façon","Rien ne va changer"], answer:1}

        {
          id: "co6", title: "Réflexion sur le progrès technique", level: "C2", subLevel: "Base",
          cours: "Un texte réflexif ne délivre pas toujours son message de façon explicite : le ton et des formulations comme « il serait plus juste de dire » signalent une critique implicite. Concentre-toi sur ce que l'auteur suggère plutôt que sur ce qu'il dit littéralement.",
          transcript: "Il est frappant de constater que plus une société se targue d'être rationnelle, plus elle semble multiplier les objets de croyance déguisés en innovations. On nous vante chaque nouvel outil comme une libération, sans toujours s'interroger sur les dépendances qu'il engendre en retour. Loin de rejeter le progrès, il s'agirait plutôt d'apprendre à l'interroger : non pas se demander ce qu'une technologie permet de faire, mais ce qu'elle nous empêche, discrètement, de continuer à faire.",
          questions: [
            {q:"Quelle attitude l'auteur critique-t-il implicitement ?", options:["Le refus systématique de toute technologie","L'adoption non questionnée du progrès technique","Le manque d'innovation des entreprises","La lenteur de la recherche scientifique"], answer:1},
            {q:"Que suggère l'expression « objets de croyance déguisés en innovations » ?", options:["Que les innovations sont toujours fiables","Qu'on adhère parfois à la technologie de façon quasi irrationnelle","Que la science remplace la religion officiellement","Que les innovations sont interdites par la loi"], answer:1},
            {q:"Quelle question l'auteur propose-t-il de se poser à la place de la question habituelle ?", options:["Combien coûte cette technologie ?","Qui a inventé cette technologie ?","Qu'est-ce que cette technologie nous empêche de continuer à faire ?","Cette technologie est-elle légale ?"], answer:2},
            {q:"Quel est le ton général du texte ?", options:["Enthousiaste et promotionnel","Analytique et légèrement critique","Neutre et purement descriptif","Alarmiste et catastrophiste"], answer:1}
          ]
        },

          transcript: "Bonjour et bienvenue ! Je m'appelle Sophie, je suis votre professeure aujourd'hui. La classe commence à neuf heures et se termine à midi. Il y a une pause à dix heures trente. N'oubliez pas votre cahier et un stylo.",

        {
          id: "co9", title: "Bulletin météo", level: "B1", subLevel: "Intermédiaire",
          cours: "Un bulletin météo suit une structure prévisible : jour par jour, avec température et phénomène (soleil, pluie, vent). Les conseils pratiques (prévoir un parapluie) apparaissent souvent à la fin et résument l'information utile.",

        {
          id: "co10", title: "Chronique culturelle", level: "B2", subLevel: "Intermédiaire",
          cours: "Une chronique culturelle présente une nouveauté puis explique ce qui la distingue des propositions habituelles. Repère le contraste entre « avant/habituellement » et « maintenant/cette fois » pour identifier ce qui est nouveau.",
          transcript: "Cette semaine, le musée d'art moderne inaugure une exposition consacrée aux artistes émergents de la région. Contrairement aux expositions classiques, celle-ci mise sur l'interaction : les visiteurs sont invités à toucher certaines œuvres et à participer à un atelier de création collective. L'objectif affiché est de rendre l'art contemporain plus accessible à un public qui s'en sent parfois exclu.",

          id: "co11", title: "Débat radiophonique", level: "C1", subLevel: "Intermédiaire",

          transcript: "Animatrice : Faut-il réguler davantage les réseaux sociaux pour protéger les plus jeunes ? Invité 1 : Je pense qu'une régulation stricte est indispensable, tant les effets sur la santé mentale des adolescents sont documentés. Invité 2 : Je nuancerais ce constat : le problème n'est pas l'outil en soi, mais l'absence d'accompagnement parental et éducatif autour de son usage. Une régulation excessive risquerait, selon moi, de déresponsabiliser les familles.",

            {q:"Sur quoi porte la nuance apportée par le second invité ?", options:["Sur le rôle de l'accompagnement parental et éducatif","Sur le coût des réseaux sociaux","Sur la vitesse de connexion","Sur l'âge légal pour voter"], answer:0},
            {q:"Que redoute le second invité en cas de régulation excessive ?", options:["Une hausse des prix","Une déresponsabilisation des familles","Une fermeture des réseaux sociaux","Un manque de couverture internet"], answer:1}
          ]
        },
        {
          id: "co12", title: "Monologue sur la mémoire collective", level: "C2", subLevel: "Intermédiaire",
          cours: "Un monologue réflexif de haut niveau construit son argumentation par contraste (l'idée reçue vs la réalité proposée par l'auteur). La chute finale contient souvent le message clé, formulé de façon dense.",
          transcript: "On célèbre volontiers les anniversaires historiques, comme si le simple fait de commémorer suffisait à honorer la mémoire. Mais commémorer n'est pas comprendre. Trop souvent, ces cérémonies figent l'événement dans une image consensuelle, gommant les tensions et les zones d'ombre qui pourtant permettraient d'en tirer de véritables leçons. Se souvenir, au fond, exigerait moins de solennité et davantage d'inconfort.",
          questions: [
            {q:"Quelle critique implicite l'auteur adresse-t-il aux commémorations ?", options:["Elles coûtent trop cher","Elles figent l'événement dans une image consensuelle sans le questionner","Elles n'ont jamais lieu","Elles sont trop rares"], answer:1},

            {q:"Quel est le ton du texte ?", options:["Neutre et purement informatif","Critique et réflexif","Joyeux et festif","Indifférent au sujet"], answer:1}
          ]

          transcript: "On tient pour acquis que le « chez-soi » se définit par un lieu fixe, hérité ou choisi une fois pour toutes. Pour qui a connu plusieurs déracinements, cette définition s'effrite : le chez-soi devient moins un territoire qu'un ensemble de gestes, de langues et de relations que l'on recompose à chaque déplacement. Peut-être faudrait-il alors cesser de chercher où l'on est chez soi, et se demander plutôt avec qui, et comment, on le devient.",
          questions: [

          text: "Pour utiliser cette machine à café : remplissez le réservoir d'eau, placez une capsule, appuyez sur le bouton vert. La machine s'éteint automatiquement après dix minutes. Nettoyez le réservoir une fois par semaine.",

        {
          id: "ce9", title: "Article : bien manger au quotidien", level: "B1", subLevel: "Intermédiaire",
          cours: "Un article de conseil recommande généralement des habitudes plutôt que des règles strictes. Repère le ton nuancé (plutôt que, il est recommandé de) qui distingue un conseil d'une obligation.",
          text: "Manger équilibré ne signifie pas suivre un régime strict, mais plutôt adopter de bonnes habitudes sur la durée. Les nutritionnistes recommandent de privilégier les fruits et légumes de saison, de limiter les produits transformés, et de ne pas sauter de repas. Cuisiner soi-même, même simplement, permet aussi de mieux contrôler ce que l'on consomme.",

            {q:"Quel avantage présente le fait de cuisiner soi-même ?", options:["Cela coûte toujours plus cher","Cela permet de mieux contrôler ce que l'on consomme","Cela prend moins de temps que d'acheter tout prêt","Cela remplace les fruits et légumes"], answer:1},

        {
          id: "ce10", title: "Lettre de réclamation", level: "B2", subLevel: "Intermédiaire",
          cours: "Une lettre de réclamation formelle suit une structure fixe : contexte du problème, description précise, demande claire, formule de politesse. Repère la demande exacte formulée (remboursement, remplacement...) car c'est souvent l'information clé testée.",
          text: "Madame, Monsieur, je vous contacte suite à ma commande du 3 mars, reçue endommagée le 10 mars. Le produit présentait une fissure visible dès l'ouverture du colis. Je vous demande donc soit un remboursement intégral, soit un remplacement du produit dans les meilleurs délais. Je reste disponible pour vous fournir des photos si nécessaire. Dans l'attente de votre retour, je vous prie d'agréer mes salutations distinguées.",
          questions: [

          ]

        {
          id: "ce11", title: "Éditorial : réforme du système éducatif", level: "C1", subLevel: "Intermédiaire",
          cours: "Un éditorial sur un sujet de société présente presque toujours deux camps opposés avant de conclure par une question ouverte plutôt qu'un jugement tranché. Ne cherche pas la position personnelle de l'auteur s'il n'en exprime volontairement aucune.",
          text: "La réforme annoncée du système éducatif suscite des réactions contrastées. Ses partisans y voient une modernisation nécessaire, en phase avec les compétences exigées sur le marché du travail actuel. Ses détracteurs redoutent, quant à eux, un affaiblissement des savoirs fondamentaux au profit de compétences jugées trop utilitaristes. Entre ces deux lectures, une question demeure : la réforme sera-t-elle correctement accompagnée sur le terrain, ou restera-t-elle, comme tant d'autres, un texte sans réelle application ?",
          questions: [
            {q:"Quel est l'argument principal des partisans de la réforme ?", options:["Elle coûte moins cher à l'État","Elle modernise l'éducation en phase avec le marché du travail","Elle supprime des postes d'enseignants","Elle réduit la durée des études"], answer:1},
            {q:"Que craignent les détracteurs de la réforme ?", options:["Un affaiblissement des savoirs fondamentaux","Une hausse des frais de scolarité","Une fermeture d'écoles","Un manque de professeurs"], answer:0},
            {q:"Quelle question l'auteur laisse-t-il en suspens à la fin du texte ?", options:["Le coût exact de la réforme","La qualité de sa mise en application concrète sur le terrain","La date précise de son entrée en vigueur","Le nom du ministre responsable"], answer:1},
            {q:"Quelle posture adopte l'auteur dans cet éditorial ?", options:["Il prend clairement parti pour la réforme","Il prend clairement parti contre la réforme","Il présente les deux points de vue sans trancher","Il ignore le sujet de la réforme"], answer:2}
          ]
        },
        {
          id: "ce12", title: "Essai : la mémoire collective et l'oubli", level: "C2", subLevel: "Intermédiaire",
          cours: "Un essai réflexif de niveau C2 démonte une idée reçue selon la même logique : rappel de la croyance commune, puis contre-argument plus subtil. Repère les connecteurs de reformulation (il serait plus juste de dire) qui indiquent le vrai message de l'auteur.",
          text: "On suppose souvent que la mémoire collective se construit par accumulation, comme si chaque génération ajoutait sa pierre à un édifice commun. Il serait plus juste de dire qu'elle se construit tout autant par soustraction : ce que l'on choisit de taire, de simplifier ou de ne pas transmettre façonne le récit collectif presque autant que ce que l'on retient. L'oubli, loin d'être un simple accident de la mémoire, en est peut-être l'un des instruments les plus discrets.",
          questions: [
            {q:"Quelle image l'auteur remet-il en question dès la première phrase ?", options:["L'idée que la mémoire collective s'oublie totalement","L'idée que la mémoire collective se construit uniquement par accumulation","L'idée que chaque génération écrit un livre d'histoire","L'idée que la mémoire n'existe pas"], answer:1},
            {q:"Selon l'auteur, comment se construit aussi la mémoire collective ?", options:["Uniquement par l'enseignement scolaire","Par soustraction, via ce qu'on tait ou simplifie","Par des lois officielles uniquement","Elle ne se construit jamais vraiment"], answer:1},
            {q:"Quel rôle l'auteur attribue-t-il à l'oubli ?", options:["Un simple défaut sans conséquence","Un instrument discret qui façonne le récit collectif","Un phénomène uniquement individuel","Un problème purement médical"], answer:1},
            {q:"Quel type de texte est-ce ?", options:["Un fait divers","Un essai réflexif et argumentatif","Une notice technique","Une lettre personnelle"], answer:1}
          ]
        },

          text: "Formulaire d'inscription — Cours de français pour nouveaux arrivants. Nom, prénom, date de naissance, adresse au Canada, numéro de téléphone. Les cours ont lieu le mardi et le jeudi, de dix-huit heures à vingt heures. Places limitées à vingt personnes par groupe.",

        {
          id: "ce15", title: "Article : s'intégrer sur le marché du travail canadien", level: "B1", subLevel: "Avancé",
          cours: "Les articles sur l'intégration professionnelle mentionnent souvent un défi précis, une solution existante, et un facteur complémentaire de réussite. Repère ces trois éléments pour bien comprendre l'argumentation du texte.",
          text: "Pour de nombreux nouveaux arrivants, la reconnaissance des diplômes obtenus à l'étranger reste un défi majeur. Certains organismes proposent un accompagnement gratuit pour évaluer les équivalences et orienter vers les formations complémentaires nécessaires. Un réseau professionnel local peut aussi accélérer considérablement la recherche d'emploi.",

        },
        {
          id: "ce16", title: "Article : le choc culturel, une étape normale", level: "B2", subLevel: "Avancé",
          cours: "Les articles décrivant un phénomène psychologique ou social présentent souvent plusieurs phases dans l'ordre chronologique. Repère les connecteurs temporels (d'abord, suivie de, puis) pour bien reconstituer cet ordre.",
          text: "Le choc culturel touche la grande majorité des personnes qui s'installent à l'étranger. Il se manifeste souvent en plusieurs phases : l'euphorie des débuts, suivie d'une période de frustration face aux différences culturelles, puis une adaptation progressive. Reconnaître ces phases permet de les vivre avec plus de recul, sans les interpréter comme un échec personnel.",
          questions: [
            {q:"Quel est le sujet principal de l'article ?", options:["Le choc culturel lors d'une installation à l'étranger","Le tourisme international","La cuisine locale","Les vols internationaux"], answer:0},

          ]
        },
        {
          id: "ce17", title: "Éditorial : la double appartenance identitaire", level: "C1", subLevel: "Avancé",
          cours: "Un éditorial de niveau C1 critique souvent une vision simpliste d'un sujet avant de proposer une reformulation plus nuancée. Repère l'opposition entre la perception courante critiquée et la nouvelle lecture proposée par l'auteur.",
          text: "Vivre entre deux cultures est souvent perçu comme une tension à résoudre, comme s'il fallait nécessairement choisir un camp. Une lecture plus juste consisterait à envisager cette double appartenance non comme une fracture, mais comme une ressource : la capacité à naviguer entre plusieurs cadres de référence constitue, dans un monde interconnecté, un atout rarement valorisé à sa juste mesure.",
          questions: [
            {q:"Quelle perception courante l'auteur critique-t-il ?", options:["L'idée qu'il faut choisir un camp entre deux cultures","L'idée que la double culture n'existe pas","L'idée que voyager est inutile","L'idée que la langue maternelle est plus importante"], answer:0},
            {q:"Quelle reformulation l'auteur propose-t-il ?", options:["La double appartenance comme fracture","La double appartenance comme ressource","La double appartenance comme problème","La double appartenance comme hasard"], answer:1},
            {q:"Que permet, selon l'auteur, la double appartenance ?", options:["De naviguer entre plusieurs cadres de référence","De parler plus vite","De voyager gratuitement","D'éviter toute administration"], answer:0},
            {q:"Quelle est la position finale de l'auteur ?", options:["Il valorise la double culture comme un atout","Il la condamne","Il reste neutre sans opinion","Il la juge sans intérêt"], answer:0}
          ]
        },
        {
          id: "ce18", title: "Essai : la langue comme frontière invisible", level: "C2", subLevel: "Avancé",
          cours: "Un essai de niveau C2 établit parfois une comparaison implicite entre deux types d'obstacles (ici, administratif et linguistique) pour souligner que le second est plus profond ou plus durable. Repère cette comparaison, même quand elle n'est pas formulée explicitement.",
          text: "On mesure rarement à quel point la maîtrise imparfaite d'une langue façonne, en creux, l'image que l'on projette de soi-même. Ce n'est pas tant l'accent qui trahit l'étranger que le sentiment, intériorisé, de devoir sans cesse traduire sa pensée avant de l'exprimer. Cette frontière-là, invisible aux yeux des autres, s'avère souvent la plus longue à franchir — bien après que les papiers administratifs, eux, ont cessé de faire obstacle.",
          questions: [
            {q:"Quelle est la thèse principale du texte ?", options:["La langue crée une frontière intérieure plus durable que les démarches administratives","L'accent est le seul obstacle à l'intégration","Les papiers administratifs sont impossibles à obtenir","La langue n'a aucune importance dans l'intégration"], answer:0},
            {q:"Selon l'auteur, qu'est-ce qui trahit vraiment l'étranger ?", options:["L'accent uniquement","Le sentiment de devoir traduire sa pensée avant de l'exprimer","La couleur de peau","Le style vestimentaire"], answer:1},
            {q:"Que suggère la comparaison finale du texte ?", options:["Que la frontière linguistique dure plus longtemps que la frontière administrative","Que les deux frontières disparaissent en même temps","Que la frontière administrative est la plus difficile","Qu'il n'y a aucune frontière réelle"], answer:0},
            {q:"Quel est le registre du texte ?", options:["Administratif et technique","Littéraire et réflexif","Humoristique et léger","Publicitaire"], answer:1}

        {

          text: "Au Canada, toute personne ayant un revenu doit produire une déclaration de revenus chaque année, avant le 30 avril. Ce document permet de déterminer si un remboursement est dû ou si un solde reste à payer. Un retard peut entraîner des pénalités, mais des organismes communautaires offrent une aide gratuite pour les revenus modestes.",

        {

          cours: "Un éditorial sur un enjeu de santé publique présente souvent des chiffres, une cause structurelle, et des pistes de solution évoquées avec prudence. Repère la nuance entre constat et proposition.",
          text: "Les délais d'attente en santé publique atteignent des sommets préoccupants dans plusieurs provinces, conséquence directe d'une pénurie de personnel qualifié plutôt que d'un manque de financement pur. Augmenter le nombre de professionnels formés localement, plutôt que multiplier les campagnes de recrutement à l'étranger, pourrait offrir une solution plus durable, bien que les résultats ne se feraient sentir qu'à moyen terme.",

          cours: "Le subjonctif s'utilise après des expressions de doute, de volonté, de nécessité ou de sentiment : il faut que, je veux que, je doute que, bien que, avant que... On le forme (pour la plupart des verbes) à partir de la 3e personne du pluriel du présent : ils viennent → que je vienne. Le conditionnel exprime une hypothèse, une action soumise à une condition, ou une demande polie. Il se forme avec le radical du futur + les terminaisons de l'imparfait : je viendr-ais, tu viendr-ais... Dans une phrase avec « si », le conditionnel apparaît dans la proposition principale, jamais après « si » : Si j'avais le temps, je voyagerais (et non « si j'aurais »).",

/* ==================================================================
   AUTHENTIFICATION FORMATEUR — Supabase Auth (vraie session serveur)
   Remplace l'ancien mot de passe unique vérifié côté client.
   Aucune inscription publique : un compte n'existe que si le
   propriétaire du site le crée manuellement dans Supabase.
   ================================================================== */

function getSupabaseConfig(){
  // Utilise typeof (jamais d'erreur) plutôt qu'une référence directe :
  // SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY ne sont injectées que dans la
  // version déployée (storage-adapter.js), pas dans l'aperçu brut.
  if(typeof SUPABASE_URL === "undefined" || typeof SUPABASE_PUBLISHABLE_KEY === "undefined") return null;
  return { url: SUPABASE_URL, key: SUPABASE_PUBLISHABLE_KEY };
}

// Client Supabase pour le VRAI temps réel (WebSocket), distinct des appels REST
// utilisés partout ailleurs sur le site. Initialisé une seule fois, réutilisé.
let _supabaseRealtimeClient = null;
function getSupabaseRealtimeClient(){
  if(_supabaseRealtimeClient) return _supabaseRealtimeClient;
  const cfg = getSupabaseConfig();
  if(!cfg || typeof window.supabase === "undefined" || !window.supabase.createClient) return null;
  try{
    _supabaseRealtimeClient = window.supabase.createClient(cfg.url, cfg.key);
    return _supabaseRealtimeClient;
  }catch(e){
    console.error("Impossible d'initialiser le client Supabase Realtime", e);
    return null;
  }
}

const FORMATEUR_SESSION_KEY = "tfg_formateur_session";

async function formateurLogin(email, password){
  const cfg = getSupabaseConfig();
  if(!cfg) return { ok:false, error: "Authentification indisponible dans cet aperçu (nécessite la version déployée avec Supabase configuré)." };
  try{
    const res = await fetch(`${cfg.url}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": cfg.key },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok || !data.access_token){
      return { ok:false, error: "Email ou mot de passe incorrect." };
    }
    const session = {
      accessToken: data.access_token,
      refreshToken: data.refresh_token,
      email: (data.user && data.user.email) || email,
      expiresAt: Date.now() + (data.expires_in || 3600) * 1000
    };
    try{ localStorage.setItem(FORMATEUR_SESSION_KEY, JSON.stringify(session)); }catch(e){}
    return { ok:true, session };
  }catch(e){
    return { ok:false, error: "Erreur de connexion réseau. Réessaie." };
  }
}

async function formateurLogout(){
  const cfg = getSupabaseConfig();
  let raw = null;
  try{ raw = localStorage.getItem(FORMATEUR_SESSION_KEY); }catch(e){}
  if(cfg && raw){
    try{
      const session = JSON.parse(raw);
      await fetch(`${cfg.url}/auth/v1/logout`, {
        method: "POST",
        headers: { "apikey": cfg.key, "Authorization": `Bearer ${session.accessToken}` }
      });
    }catch(e){ /* on invalide quand même localement même si l'appel réseau échoue */ }
  }
  try{ localStorage.removeItem(FORMATEUR_SESSION_KEY); }catch(e){}
}

function loadStoredFormateurSession(){
  try{
    const raw = localStorage.getItem(FORMATEUR_SESSION_KEY);
    if(!raw) return null;
    const session = JSON.parse(raw);
    if(!session.expiresAt || session.expiresAt < Date.now()){
      localStorage.removeItem(FORMATEUR_SESSION_KEY);
      return null;
    }
    return session;
  }catch(e){ return null; }
}

async function formateurRequestPasswordReset(email){
  const cfg = getSupabaseConfig();
  if(!cfg) return { ok:false, error:"Indisponible dans cet aperçu." };
  try{
    const res = await fetch(`${cfg.url}/auth/v1/recover`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": cfg.key },
      body: JSON.stringify({ email })
    });
    return { ok: res.ok };
  }catch(e){
    return { ok:false };
  }
}

// Tableau d'équivalence NCLC officiel (référence standard TCF Canada)
const NCLC_TABLE = [
  {nclc:"10+", ce:[549,699], ee:[16,20], co:[549,699], eo:[16,20]},
  {nclc:"9",   ce:[524,548], ee:[14,15], co:[523,548], eo:[14,15]},
  {nclc:"8",   ce:[499,523], ee:[12,13], co:[503,522], eo:[12,13]},
  {nclc:"7",   ce:[453,498], ee:[10,11], co:[458,502], eo:[10,11]},
  {nclc:"6",   ce:[406,452], ee:[7,9],   co:[398,457], eo:[7,9]},
  {nclc:"5",   ce:[375,405], ee:[6,6],   co:[369,397], eo:[6,6]},
  {nclc:"4",   ce:[342,374], ee:[4,5],   co:[331,368], eo:[4,5]}
];
function getNCLC(skill, score){
  if(score === null || isNaN(score)) return "—";
  for(const tier of NCLC_TABLE){
    const [min,max] = tier[skill];
    if(score >= min && score <= max) return tier.nclc;
  }
  const lowestMin = NCLC_TABLE[NCLC_TABLE.length-1][skill][0];
  if(score < lowestMin) return "< 4";
  return "10+";
}

function makeCollectionAPI(prefix){
  return {
    async save(item){
      await window.storage.set(prefix + item.id, JSON.stringify(item), true);
    },
    async loadAll(){
      try{
        const res = await window.storage.list(prefix, true);
        if(!res || !res.keys || res.keys.length === 0) return [];
        const entries = await Promise.all(res.keys.map(async k=>{
          try{ const r = await window.storage.get(k, true); return r ? JSON.parse(r.value) : null; }
          catch(e){ return null; }
        }));
        return entries.filter(Boolean).sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
      }catch(e){ return []; }
    },
    async remove(id){
      await window.storage.delete(prefix + id, true);
    }
  };
}

const WA_SENDER_COLORS = ["#53bdeb","#ffab91","#a5d6a7","#ce93d8","#ffe082","#80cbc4","#f48fb1"];
function waColorFor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return WA_SENDER_COLORS[Math.abs(hash) % WA_SENDER_COLORS.length];
}

// Échappement HTML — empêche toute injection de code via un message de chat
// (protection XSS de base, indispensable dès qu'un contenu utilisateur est affiché).
function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}
function formatDateSeparator(ts){
  const d = new Date(ts);
  const today = new Date(); today.setHours(0,0,0,0);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  const dOnly = new Date(d); dOnly.setHours(0,0,0,0);
  if(dOnly.getTime() === today.getTime()) return "Aujourd'hui";
  if(dOnly.getTime() === yesterday.getTime()) return "Hier";
  return d.toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
}

// Moteur générique de chat de groupe — partagé entre l'espace élève et l'espace
// formateur pour éviter de dupliquer la logique (regroupement des messages,
// séparateurs de date, défilement intelligent, validation, gestion d'erreur).
function setupGroupChatUI({ zoneId, inputId, sendBtnId, groupId, myKey, myName }){
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  const sendBtn = document.getElementById(sendBtnId);
  if(!zone || !input || !sendBtn) return { refresh: async ()=>{} };

  function renderThread(thread){
    let html = "";
    let lastSenderKey = null, lastDateStr = null;
    thread.forEach(m=>{
      const dateStr = formatDateSeparator(m.createdAt);
      if(dateStr !== lastDateStr){
        html += `<div class="wa-date-sep">${dateStr}</div>`;
        lastDateStr = dateStr; lastSenderKey = null;
      }
      const mine = m.senderKey === myKey;
      const showName = !mine && m.senderKey !== lastSenderKey;
      html += `<div class="wa-bubble-wrap ${mine ? "mine" : "theirs"}">
        ${showName ? `<span class="wa-sender" style="color:${waColorFor(m.senderName)};">${escapeHtml(m.senderName)}</span>` : ""}
        <div class="wa-bubble">${escapeHtml(m.contenu)}<span class="wa-time">${new Date(m.createdAt).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</span></div>
      </div>`;
      lastSenderKey = m.senderKey;
    });
    return html;
  }

  function showNewMsgIndicator(){
    if(document.getElementById(zoneId + "-newmsg")) return;
    const btn = document.createElement("button");
    btn.id = zoneId + "-newmsg";
    btn.className = "wa-newmsg-btn";
    btn.textContent = "↓ Nouveaux messages";
    btn.addEventListener("click", ()=>{ zone.scrollTop = zone.scrollHeight; btn.remove(); });
    zone.appendChild(btn);
  }

  async function refresh(){
    let all;
    try{
      all = await GroupChatAPI.loadAll();
    }catch(e){
      zone.innerHTML = `<div class="wa-error-state">⚠️ Impossible de charger les messages.<br><button class="btn btn-ghost" id="${zoneId}-retry" style="font-size:12px; padding:6px 12px; margin-top:6px; color:var(--text-ink); border-color:var(--gold-soft);">Réessayer</button></div>`;
      const retryBtn = document.getElementById(`${zoneId}-retry`);
      if(retryBtn) retryBtn.addEventListener("click", refresh);
      return;
    }
    const thread = all.filter(m=>m.groupId === groupId).sort((a,b)=>a.createdAt-b.createdAt);
    if(thread.length === 0){
      zone.innerHTML = `<div class="wa-empty-state">💬<br><strong>Aucun message pour le moment</strong><br>Commencez la conversation avec votre groupe.</div>`;
      return;
    }
    const wasNearBottom = zone.scrollTop === 0 || (zone.scrollHeight - zone.scrollTop - zone.clientHeight) < 80;
    zone.innerHTML = renderThread(thread);
    if(wasNearBottom) zone.scrollTop = zone.scrollHeight;
    else showNewMsgIndicator();
  }

  async function sendMessage(){
    const contenu = input.value.trim();
    if(!contenu) return;
    if(contenu.length > 2000){ alert("Message trop long (2000 caractères maximum)."); return; }
    input.value = "";
    sendBtn.disabled = true;
    sendBtn.textContent = "…";
    try{
      await GroupChatAPI.save({
        id: `groupchat_${Date.now()}_${Math.floor(Math.random()*10000)}`,
        groupId, senderKey: myKey, senderName: myName, contenu, createdAt: Date.now()
      });
    }catch(e){
      alert("⚠️ Échec de l'envoi du message. Vérifie ta connexion et réessaie.");
    }
    sendBtn.disabled = false;
    sendBtn.textContent = "➤";
    await refresh();
    zone.scrollTop = zone.scrollHeight;
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e)=>{
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });

  // Clavier mobile : garde le champ de saisie visible quand le clavier s'ouvre,
  // au lieu de le laisser caché derrière (bug classique sur Android/iOS).
  input.addEventListener("focus", ()=>{
    setTimeout(()=>{
      input.scrollIntoView({ block: "end", behavior: "smooth" });
      zone.scrollTop = zone.scrollHeight;
    }, 300);
  });
  if(window.visualViewport){
    const onViewportResize = ()=>{
      if(document.activeElement === input){
        input.scrollIntoView({ block: "end" });
      }
    };
    window.visualViewport.addEventListener("resize", onViewportResize);
  }

  // --- Temps réel via Supabase Realtime, avec repli en sondage uniquement si indisponible ---
  let realtimeChannel = null;
  let usingRealtime = false;
  let connStatusEl = document.getElementById(zoneId + "-connstatus");
  if(!connStatusEl){
    connStatusEl = document.createElement("div");
    connStatusEl.id = zoneId + "-connstatus";
    connStatusEl.style.cssText = "display:none; font-size:11px; text-align:center; padding:4px; color:#8696a0; background:#182229;";
    zone.parentNode.insertBefore(connStatusEl, zone);
  }
  function setConnStatus(text){
    if(!text){ connStatusEl.style.display = "none"; return; }
    connStatusEl.textContent = text;
    connStatusEl.style.display = "block";
  }
  let hadRealtimeOnce = false;
  const client = getSupabaseRealtimeClient();
  if(client){
    try{
      realtimeChannel = client
        .channel(`groupchat-${groupId}`)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "kv_store", filter: "shared=eq.true" }, (payload)=>{
          const key = payload.new && payload.new.key;
          if(!key || !key.startsWith("groupchat:")) return;
          try{
            const msg = JSON.parse(payload.new.value);
            if(msg.groupId === groupId) refresh();
          }catch(e){ /* ignore une entrée mal formée */ }
        })
        .subscribe((status)=>{
          usingRealtime = (status === "SUBSCRIBED");
          if(status === "SUBSCRIBED"){ hadRealtimeOnce = true; setConnStatus(null); }
          else if(hadRealtimeOnce && (status === "CLOSED" || status === "CHANNEL_ERROR" || status === "TIMED_OUT")){
            setConnStatus("⚠️ Connexion interrompue — reconnexion...");
            refresh(); // filet de sécurité immédiat pendant la reconnexion
          }
        });
    }catch(e){
      console.error("Abonnement Realtime impossible, repli sur le sondage", e);
      realtimeChannel = null;
    }
  }

  zone.innerHTML = `<p class="dim">⏳ Chargement des messages...</p>`;
  refresh();

  function cleanup(){
    if(realtimeChannel){
      try{ client.removeChannel(realtimeChannel); }catch(e){}
      realtimeChannel = null;
    }
  }

  return { refresh, cleanup, isRealtimeActive: ()=>usingRealtime };
}

// Contexte d'accès du candidat courant : formule individuelle payante (prioritaire),
// sinon groupe actif s'il en fait partie, sinon accès gratuit par défaut (A1-A2, tous modules).
function currentAccessContext(){
  if(isPremiumActive()) return { unrestricted: true };
  if(state.myGroup && isGroupActiveNow(state.myGroup)){
    return { unrestricted: false, levels: state.myGroup.levels || [], competences: state.myGroup.competences || [], group: state.myGroup };
  }
  return { unrestricted: false, levels: FREE_LEVELS, competences: GROUP_COMPETENCE_OPTIONS.filter(c=>c.id!=="examens_blancs").map(c=>c.id) };
}


function isLevelLocked(level){
  const ctx = currentAccessContext();
  if(ctx.unrestricted) return false;
  return !ctx.levels.includes(level);
}

function isModuleLockedForStudent(moduleId){
  const ctx = currentAccessContext();
  if(ctx.unrestricted) return { locked: false };
  const locked = !ctx.competences.includes(moduleId);
  return { locked, until: ctx.group ? ctx.group.endDate : null, groupName: ctx.group ? ctx.group.name : null };
}
function isExamensBlancsLockedForStudent(){
  const ctx = currentAccessContext();
  if(ctx.unrestricted) return { locked: false };
  const locked = !ctx.competences.includes("examens_blancs");
  return { locked, until: ctx.group ? ctx.group.endDate : null };
}

async function loadMyActiveGroup(name){
  try{
    const groups = await loadAllGroups();
    const key = name.trim().toLowerCase();
    return groups.find(g => (g.members || []).includes(key) && isGroupActiveNow(g)) || null;
  }catch(e){ return null; }
}

async function notifyGroupMembers(group, message){
  const students = await loadAllStudents();
  for(const key of (group.members || [])){
    const s = students.find(st=>st.key === key);
    if(!s) continue;
    const p = await loadProgress(s.displayName);
    if(!p.notifications) p.notifications = [];
    p.notifications.unshift({ message, date: Date.now(), read: false });
    p.notifications = p.notifications.slice(0, 50);
    await saveProgress(s.displayName, p);
  }
}

function daysRemaining(){
  const acc = getAccess();
  if(!acc.expiresAt) return 0;
  return Math.max(0, Math.ceil((acc.expiresAt - Date.now()) / (1000*60*60*24)));
}
function simEEAttemptsLeft(){
  if(isPremiumActive()) return Infinity;
  const acc = getAccess();
  return Math.max(0, FREE_SIM_EE_ATTEMPTS - (acc.simEEAttemptsUsed || 0));
}
async function activatePlan(planId){
  const plan = ACCESS_PLANS.find(p=>p.id === planId);
  if(!plan) return false;
  const acc = getAccess();
  acc.plan = plan.id;
  acc.expiresAt = Date.now() + plan.days * 24 * 60 * 60 * 1000;
  await saveProgress(state.student, state.progress);
  return true;
}

/* ---------- Codes d'activation (espace formateur) ----------
   Chaque code est stocké sous sa PROPRE clé partagée (code:XXXX), plutôt que
   dans un tableau unique partagé. Ça élimine le risque de collision d'écriture
   quand plusieurs candidats/générations de code se produisent en même temps :
   chaque code s'écrit et se lit indépendamment des autres. */
const CODE_KEY_PREFIX = "code:";

function randomDigits(n){
  let s = "";
  for(let i=0;i<n;i++) s += Math.floor(Math.random()*10);
  return s;
}
async function generateCode(planId){
  let code, key;
  let exists = true;
  // Collision quasi impossible (10^6 combinaisons par formule), mais on vérifie par sécurité.
  do {
    code = `TFG-${planId.toUpperCase()}-${randomDigits(6)}`;
    key = CODE_KEY_PREFIX + code;
    try{
      const res = await window.storage.get(key, true);
      exists = !!res;
    }catch(e){ exists = false; }
  } while(exists);
  const entry = { code, plan: planId, createdAt: Date.now(), used: false, usedBy: null, usedAt: null };
  await window.storage.set(key, JSON.stringify(entry), true);
  return code;
}
async function redeemCode(rawCode){
  const code = rawCode.trim().toUpperCase();
  const key = CODE_KEY_PREFIX + code;
  let entry;
  try{
    const res = await window.storage.get(key, true);
    if(!res) return {ok:false, reason:"introuvable"};
    entry = JSON.parse(res.value);
  }catch(e){
    return {ok:false, reason:"introuvable"};
  }
  if(entry.used) return {ok:false, reason:"déjà utilisé"};
  entry.used = true;
  entry.usedBy = state.student;
  entry.usedAt = Date.now();
  await window.storage.set(key, JSON.stringify(entry), true);
  await activatePlan(entry.plan);
  return {ok:true, plan: entry.plan};
}
async function loadAllCodes(){
  try{
    const res = await window.storage.list(CODE_KEY_PREFIX, true);
    if(!res || !res.keys || res.keys.length === 0) return [];
    const entries = await Promise.all(res.keys.map(async k=>{
      try{
        const r = await window.storage.get(k, true);
        return r ? JSON.parse(r.value) : null;
      }catch(e){ return null; }
    }));
    return entries.filter(Boolean).sort((a,b)=> b.createdAt - a.createdAt);
  }catch(e){
    return [];
  }
}

/* ---------- Registre des étudiants (suivi formateur) ----------
   Même principe : chaque étudiant a sa propre clé (student:xxx), pour que
   deux connexions simultanées de candidats différents ne se marchent jamais dessus. */
const STUDENT_KEY_PREFIX = "student:";

async function registerStudent(name){
  const key = STUDENT_KEY_PREFIX + name.trim().toLowerCase();
  let existing = null;
  try{
    const res = await window.storage.get(key, true);
    if(res) existing = JSON.parse(res.value);
  }catch(e){ existing = null; }
  const entry = existing
    ? { ...existing, displayName: name.trim(), lastSeenAt: Date.now() }
    : { displayName: name.trim(), firstSeenAt: Date.now(), lastSeenAt: Date.now() };
  await window.storage.set(key, JSON.stringify(entry), true);
  return !existing; // true si c'est un tout nouveau nom
}
async function loadAllStudents(){
  try{
    const res = await window.storage.list(STUDENT_KEY_PREFIX, true);
    if(!res || !res.keys || res.keys.length === 0) return [];
    const entries = await Promise.all(res.keys.map(async k=>{
      try{
        const r = await window.storage.get(k, true);
        if(!r) return null;
        const key = k.startsWith(STUDENT_KEY_PREFIX) ? k.slice(STUDENT_KEY_PREFIX.length) : k;
        return { key, ...JSON.parse(r.value) };
      }catch(e){ return null; }
    }));
    return entries.filter(Boolean).sort((a,b)=> b.lastSeenAt - a.lastSeenAt);
  }catch(e){
    return [];
  }
}

async function deleteStudentCompletely(studentKey, displayName){
  // 1. Supprime le compte du registre partagé (visible dans "Suivi des étudiants")
  await window.storage.delete(STUDENT_KEY_PREFIX + studentKey, true);
  // 2. Supprime sa progression privée (scores, erreurs, historique d'examens, observations...)
  await window.storage.delete(storageKey(displayName), false);
  // 3. Le retire de tous les groupes dont il pourrait être membre
  const groups = await loadAllGroups();
  for(const g of groups){
    if((g.members || []).includes(studentKey)){
      g.members = g.members.filter(k=>k !== studentKey);
      await saveGroup(g);
    }
  }
  // 4. Supprime ses messages (conversation avec le formateur)
  const allMessages = await MessagesAPI.loadAll();
  const hisMessages = allMessages.filter(m=>m.studentKey === studentKey);
  for(const m of hisMessages){
    await MessagesAPI.remove(m.id);
  }
}

// Détection de similarité simple (chevauchement de mots) entre deux exercices,
// pour éviter que 10 exercices "générés différemment" soient en fait presque identiques.
function exerciseTextFingerprint(ex){
  const raw = `${ex.consigne || ""} ${ex.contenu || ""}`.toLowerCase();
  return new Set(raw.split(/[^a-zàâäéèêëïîôöùûüç0-9]+/).filter(w=>w.length > 3));
}
function similarityRatio(ex1, ex2){
  const a = exerciseTextFingerprint(ex1), b = exerciseTextFingerprint(ex2);
  if(a.size === 0 || b.size === 0) return 0;
  let common = 0;
  a.forEach(w=>{ if(b.has(w)) common++; });
  return common / Math.min(a.size, b.size);
}
function isTooSimilarToAny(exercise, existingList, threshold){
  return existingList.some(other => similarityRatio(exercise, other) > (threshold || 0.6));
}

    const entries = await Promise.all(res.keys.map(async k=>{
      try{
        const r = await window.storage.get(k, true);
        return r ? JSON.parse(r.value) : null;
      }catch(e){ return null; }
    }));
    return entries.filter(Boolean).sort((a,b)=> b.createdAt - a.createdAt);
  }catch(e){
    return [];
  }
}

async function deleteExerciseFromBank(exerciseId){
  await window.storage.delete(EXERCISE_KEY_PREFIX + exerciseId, true);
}

/* ==================================================================
   PHASE 1 — ARCHITECTURE UNIFIÉE DES EXERCICES
   Ne modifie AUCUNE donnée existante. Cette couche se contente de LIRE
   les deux sources actuelles (leçons statiques DATA.modules + banque IA
   Supabase) et de les présenter sous UNE MÊME forme normalisée :
   { id, source, titre, description, type, niveau, competence,
     competenceLabel, difficulte, difficulteLabel, duree, nombreQuestions, statut }
   Objectif : préparer les phases suivantes (bibliothèque, filtres,
   moteur générique) sans dupliquer ni casser l'existant.
   ================================================================== */

// Correspondance avec les nouveaux libellés de difficulté demandés (🟢🟡🟠🔴),
// mappés sur les échelles déjà utilisées ailleurs sur le site (aucune donnée renommée).
const EXERCISE_DIFFICULTY_MAP = {
  "Base": "🟢 Facile", "Intermédiaire": "🟡 Intermédiaire", "Avancé": "🟠 Avancé", "Expert": "🔴 Expert",
  "Facile": "🟢 Facile", "Moyen": "🟡 Intermédiaire", "Difficile": "🟠 Avancé", "Très difficile": "🔴 Expert"
};

function normalizeStaticLesson(mod, lesson){
  const competence = mod.id === "structures" ? classifyStructureLesson(lesson) : mod.id;
  const nbQuestions = lesson.questions ? lesson.questions.length : (lesson.paires ? lesson.paires.length : (lesson.prompt ? 1 : 0));
  return {
    id: lesson.id, source: "statique",
    titre: lesson.title, description: lesson.cours || "",
    type: mod.type === "quiz" ? "qcm" : "expression",
    niveau: lesson.level,
    competence, competenceLabel: (GEN_COMPETENCES.find(c=>c.id===competence) || {}).label || mod.name,
    difficulte: lesson.subLevel || null,
    difficulteLabel: EXERCISE_DIFFICULTY_MAP[lesson.subLevel] || lesson.subLevel || "—",
    duree: null, nombreQuestions: nbQuestions, statut: "publié"
  };
}

function normalizeBankExercise(ex){
  const nbQuestions = ex.questions ? ex.questions.length : (ex.paires ? ex.paires.length : (ex.prompt ? 1 : 0));
  return {
    id: ex.id, source: "ia",
    titre: `${ex.typeLabel || ex.type} — ${ex.theme}`, description: ex.consigne || "",
    type: ex.type, niveau: ex.niveau,
    competence: ex.competence,
    competenceLabel: ex.competenceLabel || (GEN_COMPETENCES.find(c=>c.id===ex.competence) || {}).label || ex.competence,
    difficulte: ex.difficulte, difficulteLabel: EXERCISE_DIFFICULTY_MAP[ex.difficulte] || ex.difficulte || "—",
    duree: null, nombreQuestions: nbQuestions,
    statut: ex.status === "validated" ? "publié" : "brouillon"
  };
}

function getAllStaticExercisesNormalized(){
  const result = [];
  DATA.modules.forEach(mod=> mod.lessons.forEach(lesson=> result.push(normalizeStaticLesson(mod, lesson))));
  return result;
}

async function getAllExercisesNormalized(){
  const staticEx = getAllStaticExercisesNormalized();
  const bankEx = (await loadExerciseBank()).map(normalizeBankExercise);
  return [...staticEx, ...bankEx];
}

async function attachBibliotheque(){
  document.getElementById("backAdminFromBib").addEventListener("click", ()=>{ state.view = "admin"; render(); });

  const allExercises = await getAllExercisesNormalized();
  let visibleCount = state.bibPageSize;

  // Restaure les filtres précédents (persistés dans state.bibFilters)
  document.getElementById("bibNiveau").value = state.bibFilters.niveau;
  document.getElementById("bibCompetence").value = state.bibFilters.competence;
  document.getElementById("bibDifficulte").value = state.bibFilters.difficulte;
  document.getElementById("bibType").value = state.bibFilters.type;
  document.getElementById("bibStatut").value = state.bibFilters.statut;
  document.getElementById("bibSource").value = state.bibFilters.source;

  function applyFilters(){
    return allExercises.filter(ex=>{
      if(state.bibFilters.niveau && ex.niveau !== state.bibFilters.niveau) return false;
      if(state.bibFilters.competence && ex.competence !== state.bibFilters.competence) return false;
      if(state.bibFilters.difficulte && ex.difficulte !== state.bibFilters.difficulte) return false;
      if(state.bibFilters.type && ex.type !== state.bibFilters.type) return false;
      if(state.bibFilters.statut && ex.statut !== state.bibFilters.statut) return false;
      if(state.bibFilters.source && ex.source !== state.bibFilters.source) return false;
      return true;
    });
  }

  function renderList(){
    const filtered = applyFilters();
    const shown = filtered.slice(0, visibleCount);
    document.getElementById("bibCount").textContent = `${filtered.length} exercice(s) trouvé(s) sur ${allExercises.length} au total — ${shown.length} affiché(s).`;
    const zone = document.getElementById("bibList");
    zone.innerHTML = shown.length ? shown.map(ex=>`
      <div class="bib-row" ${ex.source === "ia" ? `data-previewid="${ex.id}"` : ""} style="${ex.source === "ia" ? "cursor:pointer;" : ""}">
        <span class="bib-title">${ex.titre}${ex.source === "ia" ? ' <span class="dim" style="font-size:11px;">— cliquer pour prévisualiser</span>' : ""}</span>
        <span class="bib-tag-row">
          <span class="ex-tag">${ex.niveau || "—"}</span>
          <span class="ex-tag">${ex.competenceLabel}</span>
          <span class="ex-tag">${ex.difficulteLabel}</span>
          <span class="ex-tag">${ex.nombreQuestions} item(s)</span>
          <span class="ex-status-badge ${ex.statut === 'publié' ? 'validated' : 'draft'}">${ex.statut}</span>
          <span class="ex-tag">${ex.source === "ia" ? "✨ IA" : "📖 Statique"}</span>
        </span>
      </div>
    `).join("") : `<p class="dim">Aucun exercice ne correspond à ces filtres.</p>`;
    document.getElementById("bibLoadMoreBtn").style.display = filtered.length > visibleCount ? "inline-block" : "none";

    zone.querySelectorAll("[data-previewid]").forEach(row=>{
      row.addEventListener("click", async ()=>{
        const bank = await loadExerciseBank();
        const fullEx = bank.find(e=>e.id === row.dataset.previewid);
        if(fullEx){
          state.previewExercise = fullEx;
          state.previewAnswers = {};
          state.view = "exercisePreview";
          render();
        }
      });
    });
  }

  ["bibNiveau","bibCompetence","bibDifficulte","bibType","bibStatut","bibSource"].forEach(id=>{
    document.getElementById(id).addEventListener("change", (e)=>{
      const key = id.replace("bib","").replace(/^./, c=>c.toLowerCase());
      state.bibFilters[key] = e.target.value;
      visibleCount = state.bibPageSize;
      renderList();
    });
  });
  document.getElementById("bibLoadMoreBtn").addEventListener("click", ()=>{
    visibleCount += state.bibPageSize;
    renderList();
  });

  renderList();
}

    <h2>🎯 Votre objectif</h2>

    <h2 style="margin-top:20px;">✏️ Exemples</h2>
    <ul class="checklist">${cours.exemples.map(e=>`<li>${e}</li>`).join("")}</ul>` : ""}

    <h2 style="margin-top:20px;">🎓 Astuce TCF</h2>
    <p>${cours.conseilFinal}</p>

    ${cours.miniExercices && cours.miniExercices.length ? `

    ${renderMiniQuiz()}` : ""}

    <h2 style="margin-top:24px;">📝 Exercices notés</h2>

  `;

  // Mini-exercices : correction immédiate, non enregistrée (juste un échauffement)

    btn.addEventListener("click", ()=>{
      const qi = btn.dataset.mqi;
      const q = cours.miniExercices[qi];
      const chosen = parseInt(btn.dataset.moi);
      const isCorrect = chosen === q.answer;
      document.querySelectorAll(`#miniOpts-${qi} .option-row`).forEach(b=>{
        b.setAttribute("disabled","true");
        if(parseInt(b.dataset.moi) === q.answer) b.classList.add("correct");
        else if(parseInt(b.dataset.moi) === chosen) b.classList.add("wrong");
      });
      document.getElementById(`miniCorrection-${qi}`).innerHTML =
        `<div class="correction-box ${isCorrect ? "correct" : "wrong"}">${isCorrect ? "✓ Correct" : "✗ Incorrect — bonne réponse : " + q.options[q.answer]}${q.explication ? "<br>"+q.explication : ""}</div>`;

  const exoZone = document.getElementById("coursExoZone");

  } else {
    const reportBefore = computeProgressionReport(state.progress);
    const compBefore = reportBefore.byCompetence[cours.competence];
    exoZone.innerHTML = `

    `;
    document.getElementById("startCoursExoBtn").addEventListener("click", async ()=>{
      // Capture le score "avant" sur cette compétence, pour pouvoir mesurer le progrès après le cours
      if(!state.progress.coursSnapshots) state.progress.coursSnapshots = {};
      state.progress.coursSnapshots[devoir.id] = {
        competence: cours.competence,
        scoreBefore: (compBefore && compBefore.scoreCount) ? compBefore.avgScore : null,
        capturedAt: Date.now()
      };
      await saveProgress(state.student, state.progress);
      startDevoir(devoir);
    });
  }
}
