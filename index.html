async function attachExercisePreview(){
  const backBtn = document.getElementById("backBibFromPreview");
  if(backBtn) backBtn.addEventListener("click", ()=>{ state.view = "bibliotheque"; render(); });
  const ex = state.previewExercise;
  if(!ex) return;

  document.querySelectorAll(".mode-toggle .ex-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.previewMode = btn.dataset.mode;
      state.previewAnswers = {};
      render();
    });
  });

  const body = document.getElementById("exercisePreviewBody");
  const checkAllBtn = document.getElementById("previewCheckAllBtn");
  const immediate = state.previewMode === "entrainement";

  function correctionHtml(isCorrect, bonneReponse, explication){
    return `<div class="correction-box ${isCorrect ? "correct" : "wrong"}">
      ${isCorrect ? "✓ Correct" : "✗ Incorrect"} ${bonneReponse && !isCorrect ? `— Bonne réponse : <strong>${bonneReponse}</strong>` : ""}
      ${explication ? `<br>${explication}` : ""}
    </div>`;
  }

  if((ex.type === "qcm" || ex.type === "vrai_faux") && ex.questions){
    body.innerHTML = ex.questions.map((q,qi)=>`
      <div class="preview-item" id="pitem-${qi}">
        <p class="qtext">${qi+1}. ${q.q}</p>
        <div id="popts-${qi}">${q.options.map((o,oi)=>`<button class="option-row" data-qi="${qi}" data-oi="${oi}">${o}</button>`).join("")}</div>
        <div id="pcorrection-${qi}"></div>
      </div>
    `).join("");
    function evalQuestion(qi){
      const q = ex.questions[qi];
      const chosen = state.previewAnswers[qi];
      if(chosen === undefined) return;
      const isCorrect = chosen === q.answer;
      document.getElementById(`pitem-${qi}`).classList.add("answered", isCorrect ? "correct" : "wrong");
      document.querySelectorAll(`#popts-${qi} .option-row`).forEach(b=>{
        b.setAttribute("disabled","true");
        if(parseInt(b.dataset.oi) === q.answer) b.classList.add("correct");
        else if(parseInt(b.dataset.oi) === chosen) b.classList.add("wrong");
      });
      document.getElementById(`pcorrection-${qi}`).innerHTML = correctionHtml(isCorrect, q.options[q.answer], q.explication);
    }
    body.querySelectorAll(".option-row").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qi = parseInt(btn.dataset.qi);
        if(state.previewAnswers[qi] !== undefined) return;
        state.previewAnswers[qi] = parseInt(btn.dataset.oi);
        if(immediate) evalQuestion(qi);
      });
    });
    if(!immediate){
      checkAllBtn.style.display = "inline-block";
      checkAllBtn.addEventListener("click", ()=>{ ex.questions.forEach((_,qi)=>evalQuestion(qi)); });
    }

  } else if(ex.type === "texte_a_trous" && ex.contenu && ex.questions){
    let html = ex.contenu;
    ex.questions.forEach(q=>{
      const opts = shuffleArray([q.reponse, ...(q.distracteurs||[])]);
      const select = `<select class="blank-select" data-blanc="${q.blanc}"><option value="">…</option>${opts.map(o=>`<option value="${o}">${o}</option>`).join("")}</select>`;
      html = html.replace(new RegExp(`___${q.blanc}___`,"g"), select);
    });
    body.innerHTML = `<div class="preview-item"><p style="line-height:2;">${html}</p><div id="pcorrection-trous"></div></div>`;
    checkAllBtn.style.display = "inline-block";
    checkAllBtn.addEventListener("click", ()=>{
      let allCorrect = true;
      const details = ex.questions.map(q=>{
        const sel = body.querySelector(`.blank-select[data-blanc="${q.blanc}"]`);
        const val = sel ? sel.value : "";
        const ok = val === q.reponse;
        if(!ok) allCorrect = false;
        sel.style.borderColor = val ? (ok ? "var(--success)" : "var(--error-soft)") : "";
        return `Trou ${q.blanc} : ${ok ? "✓" : `✗ (réponse : ${q.reponse})`}`;
      }).join("<br>");
      document.getElementById("pcorrection-trous").innerHTML = correctionHtml(allCorrect, null, details);
    });

  } else if(ex.type === "association" && ex.paires){
    const allDroite = shuffleArray([...ex.paires.map(p=>p.droite), ...(ex.distracteurs||[])]);
    body.innerHTML = `<div class="preview-item">` + ex.paires.map((p,pi)=>`
      <div class="assoc-row">
        <span>${p.gauche}</span> →
        <select class="assoc-select" data-pi="${pi}"><option value="">…</option>${allDroite.map(d=>`<option value="${d}">${d}</option>`).join("")}</select>
      </div>
    `).join("") + `<div id="pcorrection-assoc"></div></div>`;
    checkAllBtn.style.display = "inline-block";
    checkAllBtn.addEventListener("click", ()=>{
      let allCorrect = true;
      const details = ex.paires.map((p,pi)=>{
        const sel = body.querySelector(`.assoc-select[data-pi="${pi}"]`);
        const val = sel ? sel.value : "";
        const ok = val === p.droite;
        if(!ok) allCorrect = false;
        sel.style.borderColor = val ? (ok ? "var(--success)" : "var(--error-soft)") : "";
        return `${p.gauche} : ${ok ? "✓" : `✗ (correspond à : ${p.droite})`}`;
      }).join("<br>");
      document.getElementById("pcorrection-assoc").innerHTML = correctionHtml(allCorrect, null, details);
    });

  } else if(ex.type === "texte" && ex.questions){
    body.innerHTML = ex.questions.map((q,qi)=>`
      <div class="preview-item">
        <p class="qtext">${qi+1}. ${q.q}</p>
        <textarea id="ptext-${qi}" placeholder="Ta réponse..."></textarea>
        <button class="btn btn-ghost" data-showmodel="${qi}" style="margin-top:8px; font-size:12px; padding:6px 12px; color:var(--text-ink); border-color:var(--gold-soft);">Voir la réponse modèle</button>
        <div id="pmodel-${qi}" style="display:none; margin-top:8px;"></div>
      </div>
    `).join("");
    body.querySelectorAll("[data-showmodel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qi = btn.dataset.showmodel;
        const q = ex.questions[qi];
        const zone = document.getElementById(`pmodel-${qi}`);
        zone.style.display = "block";

      });

function levelFromScore(avg){
  if(avg === null) return null;
  if(avg < 40) return 0;
  if(avg < 55) return 1;
  if(avg < 70) return 2;
  if(avg < 85) return 3;
  if(avg < 95) return 4;
  return 5;
}

function computeGlobalAverage(){
  return computeAverageFromProgress(state.progress);
}
function computeAverageFromProgress(progress){
  const scores = [];
  DATA.modules.forEach(m=>{
    if(m.type !== "quiz") return;
    m.lessons.forEach(l=>{
      const s = progress[m.id] && progress[m.id].scores && progress[m.id].scores[l.id];
      if(typeof s === "number") scores.push(s);
    });
  });
  if(scores.length === 0) return null;
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}

/* ==================================================================
   PROGRESSION CECRL — par niveau et par compétence, recalculée
   automatiquement à chaque session, sans jamais réinitialiser
   les données existantes (purement calculée à la volée).
   ================================================================== */

const REUSSITE_SEUIL = 60; // % à partir duquel un exercice est considéré "réussi"

function classifyStructureLesson(lesson){
  const t = (lesson.title || "").toLowerCase();
  return (t.includes("vocabulaire") || t.includes("expressions courantes")) ? "vocabulaire" : "grammaire";
}

function emptyStat(label){
  return { label, total:0, done:0, reussis:0, scoreSum:0, scoreCount:0 };
}

function computeProgressionReport(progress){
  const byLevel = {};
  LEVELS.forEach(lv => byLevel[lv] = emptyStat(lv));

  const byCompetence = {
    co: emptyStat("Compréhension orale"),
    ce: emptyStat("Compréhension écrite"),
    grammaire: emptyStat("Grammaire"),
    vocabulaire: emptyStat("Vocabulaire"),
    expression_ecrite: emptyStat("Expression écrite"),
    expression_orale: emptyStat("Expression orale")
  };

  DATA.modules.forEach(mod=>{
    mod.lessons.forEach(lesson=>{
      const lv = lesson.level;
      const compKey = mod.id === "structures" ? classifyStructureLesson(lesson) : mod.id;
      const lvStat = byLevel[lv];
      const compStat = byCompetence[compKey];
      if(lvStat) lvStat.total++;
      if(compStat) compStat.total++;

      if(mod.type === "quiz"){
        const score = progress[mod.id] && progress[mod.id].scores && progress[mod.id].scores[lesson.id];
        if(typeof score === "number"){
          [lvStat, compStat].forEach(s=>{
            if(!s) return;
            s.done++; s.scoreSum += score; s.scoreCount++;
            if(score >= REUSSITE_SEUIL) s.reussis++;
          });
        }
      } else {
        const done = progress[mod.id] && progress[mod.id].done && progress[mod.id].done[lesson.id];
        if(done){
          if(lvStat) lvStat.done++;
          if(compStat) compStat.done++;
        }
      }
    });
  });

  function finalize(stat){
    stat.pctDone = stat.total ? Math.round((stat.done/stat.total)*100) : 0;
    stat.pctReussite = stat.scoreCount ? Math.round((stat.reussis/stat.scoreCount)*100) : null;
    stat.avgScore = stat.scoreCount ? Math.round(stat.scoreSum/stat.scoreCount) : null;
    return stat;
  }
  LEVELS.forEach(lv=>finalize(byLevel[lv]));
  Object.keys(byCompetence).forEach(k=>finalize(byCompetence[k]));

  // Compétences maîtrisées / faibles (sur l'ensemble de la progression, tous niveaux confondus)
  const withScore = Object.values(byCompetence).filter(c=>c.scoreCount > 0);
  const maitrisees = withScore.filter(c=>c.avgScore >= 75).map(c=>c.label);
  const faibles = withScore.filter(c=>c.avgScore < 60).map(c=>c.label);

  // Niveau actuel = le niveau le plus avancé où l'élève a déjà des scores
  let currentLevelIndex = -1;
  LEVELS.forEach((lv,i)=>{ if(byLevel[lv].scoreCount > 0) currentLevelIndex = i; });

  let recommandation = "Commence par quelques exercices pour obtenir une première estimation de ton niveau.";
  let niveauRecommande = null;
  if(currentLevelIndex >= 0){
    const lv = LEVELS[currentLevelIndex];
    const b = byLevel[lv];
    if(b.avgScore >= 70 && currentLevelIndex < LEVELS.length - 1){
      niveauRecommande = LEVELS[currentLevelIndex + 1];
      recommandation = `Vous êtes prêt(e) à commencer ${niveauRecommande}.`;
    } else if(faibles.length){
      recommandation = `Travail recommandé avant de passer au niveau suivant : ${faibles.join(" et ")}.`;
    } else {
      recommandation = `Continue à t'entraîner sur ${lv} pour renforcer ta moyenne avant de passer au niveau suivant.`;
    }
  }

  return {
    byLevel, byCompetence, maitrisees, faibles, recommandation, niveauRecommande,
    currentLevel: currentLevelIndex >= 0 ? LEVELS[currentLevelIndex] : null,
    studyTimeSeconds: progress.studyTimeSeconds || 0,
    currentStreak: progress.currentStreak || 0,
    bestStreak: progress.bestStreak || 0,
    totalSessions: progress.totalSessions || 0,
    dayStreak: progress.dayStreak || 0,
    bestDayStreak: progress.bestDayStreak || 0,
    examHistory: progress.examHistory || []
  };
}

function formatStudyTime(totalSeconds){
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  if(h > 0) return `${h}h${m.toString().padStart(2,"0")}`;
  if(m > 0) return `${m} min`;
  return "< 1 min";
}

// Série de JOURS actifs consécutifs (distincte de la série de bonnes réponses) —
// appelée à chaque session complétée (leçon, examen, devoir...).
function updateDayStreak(progress){
  const todayStr = new Date().toISOString().slice(0,10);
  if(progress.lastActiveDate === todayStr) return; // déjà comptabilisé aujourd'hui
  const yesterdayStr = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  progress.dayStreak = (progress.lastActiveDate === yesterdayStr) ? (progress.dayStreak || 0) + 1 : 1;
  progress.bestDayStreak = Math.max(progress.bestDayStreak || 0, progress.dayStreak);
  progress.lastActiveDate = todayStr;
}

function moduleCompletion(mod){
  const total = mod.lessons.length;
  let done = 0;
  mod.lessons.forEach(l=>{
    const rec = state.progress[mod.id];
    if(mod.type === "quiz"){
      if(rec && rec.scores && typeof rec.scores[l.id] === "number") done++;
    } else {
      if(rec && rec.done && rec.done[l.id]) done++;
    }
  });
  return {done, total};
}

async function hashPassword(pw){
  const data = new TextEncoder().encode(pw);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function attachLogin(){
  const btn = document.getElementById("startBtn");
  const input = document.getElementById("nameInput");
  const passInput = document.getElementById("passInput");
  const msg = document.getElementById("loginMsg");
  const go = async ()=>{
    const name = input.value.trim();
    const pass = passInput.value;
    if(!name) { input.focus(); return; }
    if(!pass) { msg.textContent = "Choisis un mot de passe pour protéger ta progression."; passInput.focus(); return; }
    btn.disabled = true;
    msg.textContent = "";
    const progress = await loadProgress(name);
    const enteredHash = await hashPassword(pass);
    if(progress.passwordHash){
      if(progress.passwordHash !== enteredHash){
        msg.textContent = "Mot de passe incorrect pour ce prénom. Si ce n'est pas toi, choisis un identifiant différent.";
        btn.disabled = false;
        return;
      }
    } else {
      progress.passwordHash = enteredHash;
      await saveProgress(name, progress);
    }
    state.student = name;
    state.progress = progress;
    btn.disabled = false;
    state.groupCheckInitialized = false; // nouvelle session : la prochaine vérification de groupe est bien "la première"
    registerStudent(name); // asynchrone, pas besoin d'attendre pour continuer
    loadMyActiveGroup(name).then(g=>{ state.myGroup = g; state.groupCheckInitialized = true; if(state.view !== "login") render(); }); // asynchrone
    if(state.pendingExam){
      state.pendingExam = false;
      state.view = "examHub";
      render();
    } else if(state.pendingFullExam){
      state.pendingFullExam = false;
      startFullExam();
    } else if(state.pendingView){
      state.view = state.pendingView;
      state.pendingView = null;
      render();
    } else if(state.pendingModule){
      state.moduleId = state.pendingModule;
      state.pendingModule = null;
      state.view = "moduleLessons";
      render();
    } else {
      state.view = "dashboard";
      render();
    }
  };
  btn.addEventListener("click", go);
  input.addEventListener("keydown", e=>{ if(e.key === "Enter") passInput.focus(); });
  passInput.addEventListener("keydown", e=>{ if(e.key === "Enter") go(); });
}

function attachDashboard(){
  // Revérifie l'appartenance à un groupe à chaque passage sur le tableau de bord,
  // ET en tâche de fond toutes les 15 secondes pendant qu'on y reste — sinon un
  // élève ajouté à un groupe après s'être connecté ne le voit jamais apparaître
  // avant de se reconnecter.
  async function checkMyGroup(){
    if(!state.student) return;
    const g = await loadMyActiveGroup(state.student);
    const wasInGroup = state.myGroup ? state.myGroup.id : null;
    const nowInGroup = g ? g.id : null;
    const changed = nowInGroup !== wasInGroup;
    const isFirstCheckThisSession = !state.groupCheckInitialized;
    state.groupCheckInitialized = true;

    // La notification "tu viens d'être ajouté" ne doit se déclencher que pour un
    // ajout survenu PENDANT la session en cours — jamais lors de la toute première
    // vérification après connexion (sinon un élève déjà membre depuis longtemps
    // recevrait une fausse notification à chaque connexion).
    if(changed && nowInGroup && wasInGroup === null && !isFirstCheckThisSession){
      if(!state.progress.notifications) state.progress.notifications = [];
      state.progress.notifications.unshift({ message: `Tu as été ajouté(e) au groupe "${g.name}" !`, date: Date.now(), read: false });
      state.progress.notifications = state.progress.notifications.slice(0, 50);
      await saveProgress(state.student, state.progress);
    }
    state.myGroup = g;

    if(g){
      try{
        const all = await GroupChatAPI.loadAll();
        const lastRead = (state.progress.groupChatLastRead && state.progress.groupChatLastRead[g.id]) || 0;
        state.myGroupUnread = all.filter(m=> m.groupId === g.id && m.senderKey !== state.student.trim().toLowerCase() && m.createdAt > lastRead).length;
      }catch(e){ state.myGroupUnread = 0; }
    } else {
      state.myGroupUnread = 0;
    }

    if(changed && state.view === "dashboard") render();
    else if(state.view === "dashboard"){
      const badge = document.getElementById("myGroupUnreadBadge");
      if(badge) badge.textContent = state.myGroupUnread > 0 ? state.myGroupUnread : "";
      if(badge) badge.style.display = state.myGroupUnread > 0 ? "inline-block" : "none";
    }
  }
  checkMyGroup();
  clearInterval(state.dashGroupPollHandle);
  state.dashGroupPollHandle = setInterval(checkMyGroup, 15000);

  document.querySelectorAll(".module-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      state.moduleId = card.dataset.module;
      state.view = "moduleLessons";
      render();
    });
  });
  document.getElementById("goExamDash").addEventListener("click", ()=>{
    state.view = "examHub";
    render();
  });
  document.getElementById("goProgressionDash").addEventListener("click", ()=>{
    state.view = "progression";
    render();
  });
  document.getElementById("goErreursDash").addEventListener("click", ()=>{
    state.view = "mesErreurs";
    render();
  });
  const goMonGroupeDash = document.getElementById("goMonGroupeDash");
  if(goMonGroupeDash){
    goMonGroupeDash.addEventListener("click", ()=>{
      state.view = "monGroupe";
      render();
    });
  }
  const markNotifsBtn = document.getElementById("markNotifsReadBtn");
  if(markNotifsBtn){
    markNotifsBtn.addEventListener("click", async ()=>{
      markNotifsBtn.disabled = true;
      (state.progress.notifications || []).forEach(n=> n.read = true);
      await saveProgress(state.student, state.progress);
      render();
    });
  }
  document.getElementById("goMessagerieDash").addEventListener("click", ()=>{
    state.view = "messagerie";
    render();
  });
}

async function attachAdmin(){
  const backBtn = document.getElementById("backPricingFromAdmin");
  if(backBtn) backBtn.addEventListener("click", ()=>{ state.view = "home"; render(); });

  if(state.adminAuthed){
    (async ()=>{
      const zone = document.getElementById("quickStatsZone");
      const attentionZone = document.getElementById("attentionZone");
      if(!zone) return;
      const [students, messages, devoirs, groups] = await Promise.all([
        loadAllStudents(), MessagesAPI.loadAll(), DevoirsAPI.loadAll(), loadAllGroups()
      ]);
      const unreadMsgs = messages.filter(m=>m.from === "etudiant" && !m.readByFormateur).length;
      let totalAvg = 0, countAvg = 0;
      const aRisque = [];
      const SEPT_JOURS = 7 * 24 * 60 * 60 * 1000;
      for(const s of students){
        const p = await loadProgress(s.displayName);
        const avg = computeAverageFromProgress(p);
        if(avg !== null){ totalAvg += avg; countAvg++; }
        const raisons = [];
        if(avg !== null && avg < 50) raisons.push(`score faible (${avg}%)`);
        if(Date.now() - s.lastSeenAt > SEPT_JOURS) raisons.push("aucune activité depuis 7 jours");
        const erreursRecentes = (p.erreurs || []).length;
        if(erreursRecentes >= 15) raisons.push(`${erreursRecentes} erreurs enregistrées`);
        const devoirsDuStudent = devoirs.filter(d=>{
          const g = groups.find(gr=>gr.id === d.groupId);
          return g && (g.members||[]).includes(s.key);
        });
        const devoirsNonFaits = devoirsDuStudent.filter(d=> !(p.devoirsCompletes && p.devoirsCompletes[d.id]));
        if(devoirsNonFaits.length > 0) raisons.push(`${devoirsNonFaits.length} devoir(s) non terminé(s)`);
        if(raisons.length > 0) aRisque.push({ displayName: s.displayName, raisons });
      }
      const groupAvg = countAvg ? Math.round(totalAvg/countAvg) : null;
      zone.innerHTML = `
        <div class="stat-tile"><div class="val">${students.length}</div><div class="lbl">👥 Étudiants</div></div>
        <div class="stat-tile"><div class="val">${groups.length}</div><div class="lbl">🎓 Groupes</div></div>
        <div class="stat-tile"><div class="val">${unreadMsgs}</div><div class="lbl">💬 Messages non lus</div></div>
        <div class="stat-tile"><div class="val">${devoirs.length}</div><div class="lbl">📝 Devoirs actifs</div></div>
        <div class="stat-tile"><div class="val">${groupAvg !== null ? groupAvg + "%" : "—"}</div><div class="lbl">📈 Progression moyenne</div></div>
      `;
      if(attentionZone){
        attentionZone.innerHTML = aRisque.length ? `
          <p class="note" style="border-top:none; padding-top:0;"><strong>${aRisque.length} étudiant(s)</strong> nécessitent un accompagnement.</p>
          ${aRisque.map(a=>`<div class="difficulty-row"><span>${a.displayName}</span><span class="d-count" style="text-align:right; font-size:11px;">${a.raisons.join(" · ")}</span></div>`).join("")}
        ` : `<p class="dim">Aucun étudiant ne nécessite d'attention particulière pour le moment.</p>`;
      }
    })();
  }

  if(!state.adminAuthed){
    const go = async ()=>{
      const email = document.getElementById("formEmailInput").value.trim();
      const password = document.getElementById("formPassInput").value;
      const msg = document.getElementById("formAuthMsg");
      const btn = document.getElementById("formLoginBtn");
      if(!email || !password){ msg.textContent = "Renseigne ton email et ton mot de passe."; return; }
      btn.disabled = true;
      msg.textContent = "Connexion en cours...";
      msg.style.color = "var(--text-ink-dim)";
      const result = await formateurLogin(email, password);
      btn.disabled = false;
      if(!result.ok){
        msg.textContent = result.error || "Email ou mot de passe incorrect.";
        msg.style.color = "var(--error-soft)";
        return;
      }
      state.adminAuthed = true;
      state.formateurSession = result.session;
      render();
    };
    document.getElementById("formLoginBtn").addEventListener("click", go);
    document.getElementById("formPassInput").addEventListener("keydown", e=>{ if(e.key === "Enter") go(); });
    document.getElementById("formShowPass").addEventListener("change", (e)=>{
      document.getElementById("formPassInput").type = e.target.checked ? "text" : "password";
    });
    document.getElementById("formForgotBtn").addEventListener("click", ()=>{
      const zone = document.getElementById("formForgotZone");
      zone.style.display = zone.style.display === "none" ? "block" : "none";
    });
    document.getElementById("formForgotSendBtn").addEventListener("click", async ()=>{
      const email = document.getElementById("formForgotEmail").value.trim();
      const fmsg = document.getElementById("formForgotMsg");
      if(!email){ fmsg.textContent = "Renseigne ton email."; fmsg.style.color = "var(--error-soft)"; return; }
      const btn = document.getElementById("formForgotSendBtn");
      btn.disabled = true;
      const result = await formateurRequestPasswordReset(email);
      btn.disabled = false;
      fmsg.textContent = result.ok
        ? "Si ce compte existe, un email de réinitialisation vient d'être envoyé."
        : "L'envoi a échoué. Réessaie plus tard.";
      fmsg.style.color = result.ok ? "var(--success)" : "var(--error-soft)";
    });
    return;
  }

  const logoutBtn = document.getElementById("formLogoutBtn");
  if(logoutBtn){
    logoutBtn.addEventListener("click", async ()=>{
      logoutBtn.disabled = true;
      await formateurLogout();
      state.adminAuthed = false;
      state.formateurSession = null;
      state.view = "home";
      render();
    });
  }
  const goBibliothequeBtn = document.getElementById("goBibliothequeBtn");
  if(goBibliothequeBtn){
    goBibliothequeBtn.addEventListener("click", ()=>{ state.view = "bibliotheque"; render(); });
  }

  async function refreshHistory(){
    const zone = document.getElementById("codesHistory");
    const list = await loadAllCodes();
    if(list.length === 0){
      zone.innerHTML = `<p class="dim">Aucun code généré pour le moment.</p>`;
      return;
    }
    const rows = list.slice(0, 50).map(c=>{
      const planLabel = ACCESS_PLANS.find(p=>p.id === c.plan)?.name || c.plan;
      const date = new Date(c.createdAt).toLocaleDateString("fr-FR");
      return `<tr>
        <td>${c.code}</td>
        <td>${planLabel}</td>
        <td>${date}</td>
        <td><span class="status-dot ${c.used ? "used" : "free"}"></span>${c.used ? "Utilisé" + (c.usedBy ? " — " + c.usedBy : "") : "Disponible"}</td>
      </tr>`;
    }).join("");
    zone.innerHTML = `<div class="table-wrap"><table class="codes-table">
      <tr><th>Code</th><th>Formule</th><th>Généré le</th><th>Statut</th></tr>
      ${rows}
    </table></div>`;
  }

  document.querySelectorAll("[data-genplan]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      btn.disabled = true;
      const code = await generateCode(btn.dataset.genplan);
      btn.disabled = false;
      document.getElementById("newCodeZone").innerHTML = `
        <p class="dim" style="margin-top:16px;">Nouveau code généré — copie-le et transmets-le à l'élève :</p>
        <div class="admin-code-display">${code}</div>
      `;
      refreshHistory();
    });
  });

  refreshHistory();

  async function refreshStudents(){
    const zone = document.getElementById("studentsList");
    const students = await loadAllStudents();
    if(students.length === 0){
      zone.innerHTML = `<p class="dim">Aucun étudiant enregistré pour le moment.</p>`;
      return;
    }
    students.sort((a,b)=> b.lastSeenAt - a.lastSeenAt);
    zone.innerHTML = students.map(s=>{
      const lastSeen = new Date(s.lastSeenAt).toLocaleDateString("fr-FR");
      return `<div>
        <div class="student-row" data-student="${s.key}" data-display="${s.displayName}">
          <span class="s-name">${s.displayName}</span>
          <span class="s-meta">Dernière visite : ${lastSeen}</span>
        </div>
        <div id="detail-${s.key}"></div>
      </div>`;
    }).join("");

    document.querySelectorAll(".student-row").forEach(row=>{
      row.addEventListener("click", async ()=>{
        const key = row.dataset.student;
        const displayName = row.dataset.display;
        const detailZone = document.getElementById(`detail-${key}`);
        if(detailZone.innerHTML.trim() !== ""){
          detailZone.innerHTML = ""; // referme si déjà ouvert
          return;
        }
        detailZone.innerHTML = `<div class="student-detail">Chargement...</div>`;
        const progress = await loadProgress(displayName);
        const avg = computeAverageFromProgress(progress);
        const lvl = levelFromScore(avg);
        const acc = progress.access || {plan:"free", expiresAt:null, simEEAttemptsUsed:0};
        const premium = acc.plan !== "free" && acc.expiresAt && acc.expiresAt > Date.now();

        const moduleRows = DATA.modules.filter(m=>m.type==="quiz").map(m=>{
          const scores = progress[m.id] && progress[m.id].scores ? progress[m.id].scores : {};
          const vals = Object.values(scores);
          const modAvg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null;
          return `<tr><td>${m.name}</td><td>${vals.length} leçon(s) faite(s)</td><td>${modAvg !== null ? modAvg + "%" : "—"}</td></tr>`;
        }).join("");

        const topDiffs = (progress.erreurs || []).reduce((acc,e)=>{
          acc[e.lessonTitle] = (acc[e.lessonTitle]||0)+1; return acc;
        }, {});
        const topDiffsList = Object.entries(topDiffs).sort((a,b)=>b[1]-a[1]).slice(0,5);

        detailZone.innerHTML = `
          <div class="student-detail">
            <p><strong>Niveau estimé :</strong> ${lvl !== null ? LEVELS[lvl] : "—"} (moyenne ${avg !== null ? avg + "%" : "—"})</p>
            <p><strong>Formule :</strong> ${premium ? acc.plan.toUpperCase() + " (expire le " + new Date(acc.expiresAt).toLocaleDateString("fr-FR") + ")" : "Gratuite"}</p>
            <p><strong>Corrections IA gratuites utilisées :</strong> ${acc.simEEAttemptsUsed || 0} / ${FREE_SIM_EE_ATTEMPTS}</p>
            <table>
              <tr><th>Module</th><th>Progression</th><th>Score moyen</th></tr>
              ${moduleRows}
            </table>
            ${topDiffsList.length ? `<p style="margin-top:12px;"><strong>Difficultés fréquentes :</strong> ${topDiffsList.map(([t,c])=>`${t} (${c})`).join(", ")}</p>` : ""}
            <p style="margin-top:14px; margin-bottom:4px;"><strong>Débloquer B1 à C2 directement</strong> (sans passer par un code) :</p>
            <div class="lesson-actions">
              ${ACCESS_PLANS.map(p=>`<button class="btn btn-gold" data-activate="${p.id}" data-displayname2="${displayName}" style="font-size:12px; padding:8px 14px;">Activer ${p.name}</button>`).join("")}
            </div>
            <p id="activateMsg-${key}" style="font-size:12px; margin-top:8px; color:var(--success);"></p>
            <div class="lesson-actions" style="margin-top:16px;">
              <button class="btn btn-ghost" data-reset="${key}" data-displayname="${displayName}" style="color:var(--text-ink); border-color:var(--gold-soft);">Réinitialiser ses corrections IA gratuites</button>
            </div>
            <p id="resetMsg-${key}" style="font-size:12px; margin-top:8px; color:var(--success);"></p>
            <p class="dim" style="font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-top:16px;">Observation pédagogique privée (visible uniquement par les formateurs)</p>
            <textarea id="obsField-${key}" style="min-height:70px;" placeholder="Ex: progresse bien en CE, à encourager en expression orale...">${progress.observationFormateur || ""}</textarea>
            <button class="btn btn-ghost" data-saveobs="${key}" data-displayname3="${displayName}" style="font-size:12px; padding:6px 12px; margin-top:6px; color:var(--text-ink); border-color:var(--gold-soft);">Enregistrer l'observation</button>
            <p id="obsMsg-${key}" style="font-size:12px; margin-top:6px; color:var(--success);"></p>

            <p class="dim" style="font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-top:20px; color:var(--error-soft);">Zone de danger</p>
            <button class="btn btn-ghost" data-deletestudent="${key}" data-displayname4="${displayName}" style="font-size:12px; padding:6px 12px; margin-top:6px; color:var(--error-soft); border-color:var(--error-soft);">🗑️ Supprimer définitivement cet élève</button>
            <p id="deleteMsg-${key}" style="font-size:12px; margin-top:6px; color:var(--error-soft);"></p>
          </div>
        `;

        detailZone.querySelector(`[data-deletestudent]`).addEventListener("click", async (e)=>{
          const confirmed = confirm(`Supprimer définitivement ${displayName} ?\n\nSon compte, sa progression, son historique et ses messages seront effacés pour toujours. Cette action est irréversible.`);
          if(!confirmed) return;
          const btn = e.target;
          btn.disabled = true;
          document.getElementById(`deleteMsg-${key}`).textContent = "Suppression en cours...";
          await deleteStudentCompletely(key, displayName);
          document.getElementById(`deleteMsg-${key}`).textContent = `✅ ${displayName} a été supprimé(e) définitivement.`;
          setTimeout(()=> refreshStudents(), 1200);
        });

        detailZone.querySelector(`[data-saveobs]`).addEventListener("click", async (e)=>{
          const btn = e.target;
          btn.disabled = true;
          const freshProgress = await loadProgress(displayName);
          freshProgress.observationFormateur = document.getElementById(`obsField-${key}`).value;
          await saveProgress(displayName, freshProgress);
          document.getElementById(`obsMsg-${key}`).textContent = "✅ Observation enregistrée.";
          btn.disabled = false;
        });

        detailZone.querySelectorAll("[data-activate]").forEach(actBtn=>{
          actBtn.addEventListener("click", async ()=>{
            actBtn.disabled = true;
            const planId = actBtn.dataset.activate;
            const plan = ACCESS_PLANS.find(p=>p.id === planId);
            const freshProgress = await loadProgress(displayName);
            if(!freshProgress.access) freshProgress.access = {plan:"free", expiresAt:null, simEEAttemptsUsed:0};
            freshProgress.access.plan = planId;
            freshProgress.access.expiresAt = Date.now() + plan.days * 24 * 60 * 60 * 1000;
            await saveProgress(displayName, freshProgress);
            document.getElementById(`activateMsg-${key}`).textContent = `✅ Formule ${plan.name} activée pour ${displayName} (${plan.days} jours), sans code.`;
            actBtn.disabled = false;
          });
        });

        const resetBtn = detailZone.querySelector("[data-reset]");
        resetBtn.addEventListener("click", async ()=>{
          resetBtn.disabled = true;
          const freshProgress = await loadProgress(displayName);
          if(!freshProgress.access) freshProgress.access = {plan:"free", expiresAt:null, simEEAttemptsUsed:0};
          freshProgress.access.simEEAttemptsUsed = 0;
          await saveProgress(displayName, freshProgress);
          document.getElementById(`resetMsg-${key}`).textContent = "✅ Compteur réinitialisé — ce candidat a de nouveau droit à sa correction IA gratuite.";
          resetBtn.disabled = false;
        });
      });
    });
  }
  refreshStudents();

  document.getElementById("resetAllBtn").addEventListener("click", async ()=>{
    const btn = document.getElementById("resetAllBtn");
    const msg = document.getElementById("resetAllMsg");
    btn.disabled = true;
    msg.textContent = "Réinitialisation en cours...";
    msg.style.color = "var(--text-ink-dim)";
    const students = await loadAllStudents();
    let count = 0;
    for(const s of students){
      const progress = await loadProgress(s.displayName);
      if(!progress.access) progress.access = {plan:"free", expiresAt:null, simEEAttemptsUsed:0};
      if((progress.access.simEEAttemptsUsed || 0) > 0){
        progress.access.simEEAttemptsUsed = 0;
        await saveProgress(s.displayName, progress);
        count++;
      }
    }
    msg.textContent = `✅ Terminé — compteur réinitialisé pour ${count} étudiant(s) sur ${students.length}.`;
    msg.style.color = "var(--success)";
    btn.disabled = false;

  /* ---------- Générateur IA TFG ---------- */
  let currentExFilter = "all";

  function renderExerciseCard(ex){
    const statusLabel = ex.status === "validated" ? "✅ Validé" : "📝 Brouillon";
    const issuesHtml = (ex.validation && ex.validation.problemes && ex.validation.problemes.length)

      bodyPreview = `<p class="dim" style="margin:8px 0 0;">${ex.questions.length} question(s)/item(s)</p>`;
    } else if(ex.paires){
      bodyPreview = `<p class="dim" style="margin:8px 0 0;">${ex.paires.length} paire(s) à associer</p>`;
    } else if(ex.prompt){
      bodyPreview = `<p class="dim" style="margin:8px 0 0;">Sujet d'expression</p>`;
    }

        ${ex.questions ? `<pre style="white-space:pre-wrap; font-size:12px; background:var(--ink); padding:10px; border-radius:6px; margin-top:8px;">${JSON.stringify(ex.questions, null, 2)}</pre>` : ""}
        ${ex.paires ? `<pre style="white-space:pre-wrap; font-size:12px; background:var(--ink); padding:10px; border-radius:6px; margin-top:8px;">${JSON.stringify(ex.paires, null, 2)}</pre>` : ""}
        ${ex.prompt ? `<p><strong>Sujet :</strong> ${ex.prompt}</p><p><strong>Critères :</strong> ${(ex.criteresEvaluation||[]).join(" · ")}</p>` : ""}
        <p class="dim" style="margin-top:8px;"><strong>Objectif pédagogique :</strong> ${ex.objectifPedagogique || "—"}</p>
        <p class="dim"><strong>Explication générale :</strong> ${ex.explicationGenerale || "—"}</p>

          ${ex.status === "draft" ? `<button class="btn btn-gold" data-forcevalidate="${ex.id}" style="font-size:12px; padding:7px 12px;">Publier quand même</button>` : ""}

  async function refreshExerciseBank(){
    const zone = document.getElementById("exerciseBankList");
    const bank = await loadExerciseBank();
    const filtered = currentExFilter === "all" ? bank : bank.filter(e=>e.status === currentExFilter);
    if(filtered.length === 0){
      zone.innerHTML = `<p class="dim">Aucun exercice ${currentExFilter === "all" ? "" : currentExFilter === "validated" ? "validé" : "en brouillon"} pour le moment.</p>`;
      return;

    zone.innerHTML = filtered.map(renderExerciseCard).join("");

    zone.querySelectorAll("[data-extoggle]").forEach(head=>{

      });

      btn.addEventListener("click", async (e)=>{

        const ex = bankNow.find(x=>x.id === id);
        if(ex){

          if(!ex.validation) ex.validation = { valide:true, problemes:[], niveauEstimeParIA: ex.niveau, commentaire:"Publié manuellement par le formateur." };

          refreshExerciseBank();
        }

    zone.querySelectorAll("[data-deleteex]").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{

        refreshExerciseBank();
      });

  /* ---------- Génération rapide de 10 exercices (staging avant ajout) ---------- */

  function confidenceInfo(ex){
    if(!ex.validation) return { cls:"medium", label:"🟡 À vérifier" };
    if(ex.validation.valide && ex.validation.niveauEstimeParIA === ex.niveau) return { cls:"high", label:"🟢 Haute confiance" };
    if(ex.validation.valide) return { cls:"medium", label:"🟡 À vérifier" };
    return { cls:"low", label:"🔴 Incohérence probable" };
  }

    zone.querySelectorAll("[data-regen]").forEach(btn=>{

          const fresh = await generateExerciseAI(params);

    zone.querySelectorAll("[data-supprimer]").forEach(btn=>{

        delete ex._removed; delete ex._duplicateWarning;
        await saveExerciseToBank(ex);

      msg.style.color = "var(--success)";

      const groups = await loadAllGroups();
      assignZone.innerHTML = `
        <div class="lesson-actions" style="margin-top:14px;">
          <button class="btn btn-ghost" id="quickViewBankBtn" style="color:var(--text-ink); border-color:var(--gold-soft);">📚 Voir la banque</button>
          <button class="btn btn-ghost" id="quickGenAgainBtn" style="color:var(--text-ink); border-color:var(--gold-soft);">🤖 Générer 10 autres</button>

      `;
      document.getElementById("quickViewBankBtn").addEventListener("click", ()=>{ state.view = "bibliotheque"; render(); });

      const assignBtn = document.getElementById("quickAssignBtn");

  document.getElementById("quick10Btn").addEventListener("click", async ()=>{
    const btn = document.getElementById("quick10Btn");
    const progressEl = document.getElementById("quickProgress");
    const params = {
      niveau: document.getElementById("quickNiveau").value,
      competence: document.getElementById("quickCompetence").value,
      theme: (GEN_THEMES[Math.floor(Math.random()*GEN_THEMES.length)]),
      difficulte: document.getElementById("quickDifficulte").value,
      type: document.getElementById("quickType").value
    };
    btn.disabled = true;
    state.batchStaging = [];
    document.getElementById("quickStagingZone").innerHTML = "";

    for(let i=0; i<10; i++){
      progressEl.textContent = `Génération ${i+1}/10...`;
      try{
        let ex = await generateExerciseAI(params);
        // Anti-doublons : si trop proche d'un exercice déjà généré dans ce lot, on régénère une fois
        if(isTooSimilarToAny(ex, state.batchStaging)){
          progressEl.textContent = `Exercice ${i+1} trop similaire, régénération...`;
          ex = await generateExerciseAI(params);
        }
        ex._duplicateWarning = isTooSimilarToAny(ex, state.batchStaging);
        progressEl.textContent = `Contrôle qualité ${i+1}/10...`;
        ex.validation = await validateExerciseAI(ex);
        state.batchStaging.push(ex);
        renderStagingCards();
      }catch(e){
        console.error("Erreur génération lot de 10", e);
      }
    }
    progressEl.textContent = `✅ 10 exercices générés — vérifie-les avant de les ajouter à la banque.`;

  document.getElementById("genLaunchBtn").addEventListener("click", async ()=>{
    const btn = document.getElementById("genLaunchBtn");
    const progressEl = document.getElementById("genProgress");
    const params = {
      niveau: document.getElementById("genNiveau").value,
      competence: document.getElementById("genCompetence").value,
      theme: document.getElementById("genTheme").value,
      difficulte: document.getElementById("genDifficulte").value,
      type: document.getElementById("genType").value
    };
    const nombre = parseInt(document.getElementById("genNombre").value);
    btn.disabled = true;
    let validatedCount = 0, draftCount = 0;

    for(let i=0; i<nombre; i++){
      progressEl.textContent = `Génération ${i+1}/${nombre} en cours...`;
      try{
        const exercise = await generateExerciseAI(params);
        progressEl.textContent = `Contrôle qualité ${i+1}/${nombre} en cours...`;
        const validation = await validateExerciseAI(exercise);
        exercise.validation = validation;
        exercise.status = validation.valide ? "validated" : "draft";
        if(exercise.status === "validated") validatedCount++; else draftCount++;
        await saveExerciseToBank(exercise);
      }catch(err){
        console.error("Erreur génération/validation exercice", err);
      }
    }

    progressEl.textContent = `✅ Terminé — ${validatedCount} exercice(s) validé(s) et publié(s), ${draftCount} en brouillon (à relire).`;
    btn.disabled = false;
    refreshExerciseBank();
  });

  refreshExerciseBank();

  /* ---------- Gestion des groupes (PROMPT 7) ---------- */
  let allStudentsCache = [];

  function groupStatusLabel(g){
    if(isGroupExpired(g)) return { cls:"expired", txt:"Expiré" };
    if(isGroupUpcoming(g)) return { cls:"upcoming", txt:"À venir" };
    return { cls:"active", txt:"Actif" };
  }

  async function refreshGroupsList(){
    const zone = document.getElementById("groupsList");
    const groups = await loadAllGroups();
    allStudentsCache = await loadAllStudents();
    if(groups.length === 0){
      zone.innerHTML = `<p class="dim">Aucun groupe créé pour le moment.</p>`;
      return;
    }
    // Pré-calcule la progression moyenne de chaque groupe
    const groupAverages = {};
    for(const g of groups){
      let sum = 0, count = 0;
      for(const key of (g.members || [])){
        const s = allStudentsCache.find(st=>st.key === key);
        if(!s) continue;
        const p = await loadProgress(s.displayName);
        const avg = computeAverageFromProgress(p);
        if(avg !== null){ sum += avg; count++; }
      }
      groupAverages[g.id] = count ? Math.round(sum/count) : null;
    }
    zone.innerHTML = groups.map(g=>{
      const status = groupStatusLabel(g);
      const levelsTxt = (g.levels || []).join(", ") || "aucun";
      const compsTxt = (g.competences || []).map(c=> GROUP_COMPETENCE_OPTIONS.find(o=>o.id===c)?.label || c).join(", ") || "aucun";
      const members = g.members || [];
      const avg = groupAverages[g.id];
      const memberChips = members.map(key=>{
        const s = allStudentsCache.find(st=>st.key === key);
        const name = s ? s.displayName : key;
        return `<span class="member-chip">${name}<button data-removemember="${g.id}|${key}">✕</button></span>`;
      }).join("");
      const availableToAdd = allStudentsCache.filter(s=>!members.includes(s.key));
      return `<div class="group-card" data-groupid="${g.id}">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <strong>${g.name}</strong>
          <span class="group-status ${status.cls}">${status.txt}</span>
        </div>
        <p class="dim" style="font-size:12px; margin:6px 0;">Du ${new Date(g.startDate).toLocaleDateString("fr-FR")} au ${new Date(g.endDate).toLocaleDateString("fr-FR")}</p>
        <p style="font-size:13px; margin:6px 0; font-weight:600;">${members.length} étudiant(s) — Progression moyenne : ${avg !== null ? avg + "%" : "—"}</p>
        <p style="font-size:12px; margin:4px 0;"><strong>Niveaux :</strong> ${levelsTxt}</p>
        <p style="font-size:12px; margin:4px 0;"><strong>Modules :</strong> ${compsTxt}</p>
        <p style="font-size:12px; margin:8px 0 4px;"><strong>Membres :</strong></p>
        <div>${memberChips || '<span class="dim" style="font-size:12px;">Aucun membre pour le moment.</span>'}</div>
        <div style="display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap;">
          <select class="grp-add-select" style="padding:6px 8px; border-radius:6px; background:var(--ink); color:var(--text-ink); border:1px solid var(--ink-softer); font-size:12px;">
            <option value="">— Ajouter un étudiant —</option>
            ${availableToAdd.map(s=>`<option value="${s.key}">${s.displayName}</option>`).join("")}
          </select>
          <button class="btn btn-ghost" data-addmember="${g.id}" style="font-size:12px; padding:6px 12px; color:var(--text-ink); border-color:var(--gold-soft);">Ajouter</button>
          <button class="btn btn-gold" data-managegroup="${g.id}" style="font-size:12px; padding:6px 12px;">📝 Devoirs, annonces, rapport...</button>
          <button class="btn btn-ghost" data-deletegroup="${g.id}" style="font-size:12px; padding:6px 12px; color:var(--error-soft); border-color:var(--error-soft);">Supprimer le groupe</button>
        </div>
      </div>`;
    }).join("");

    zone.querySelectorAll("[data-addmember]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const groupId = btn.dataset.addmember;
        const select = btn.parentElement.querySelector(".grp-add-select");
        const studentKey = select.value;
        if(!studentKey) return;
        btn.disabled = true;
        const groups = await loadAllGroups();
        const g = groups.find(x=>x.id === groupId);
        if(g){
          if(!g.members) g.members = [];
          if(!g.members.includes(studentKey)) g.members.push(studentKey);
          await saveGroup(g);
        }
        refreshGroupsList();
      });
    });
    zone.querySelectorAll("[data-removemember]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const [groupId, studentKey] = btn.dataset.removemember.split("|");
        btn.disabled = true;
        const groups = await loadAllGroups();
        const g = groups.find(x=>x.id === groupId);
        if(g){
          g.members = (g.members || []).filter(k=>k !== studentKey);
          await saveGroup(g);
        }
        refreshGroupsList();
      });
    });
    zone.querySelectorAll("[data-deletegroup]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(!confirm("Supprimer définitivement ce groupe ?")) return;
        btn.disabled = true;
        await deleteGroup(btn.dataset.deletegroup);
        refreshGroupsList();
      });
    });
    zone.querySelectorAll("[data-managegroup]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        btn.disabled = true;
        const groups = await loadAllGroups();
        const g = groups.find(x=>x.id === btn.dataset.managegroup);
        state.adminGroupDetailId = btn.dataset.managegroup;
        state.adminGroupDetailObj = g || null;
        state.view = "adminGroupDetail";
        render();
      });
    });
  }

  document.getElementById("grpCreateBtn").addEventListener("click", async ()=>{
    const btn = document.getElementById("grpCreateBtn");
    const msg = document.getElementById("grpCreateMsg");
    const name = document.getElementById("grpName").value.trim();
    const startDate = document.getElementById("grpStart").value;
    const endDate = document.getElementById("grpEnd").value;
    const levels = Array.from(document.querySelectorAll(".grp-level-cb:checked")).map(cb=>cb.value);
    const competences = Array.from(document.querySelectorAll(".grp-comp-cb:checked")).map(cb=>cb.value);

    if(!name || !startDate || !endDate){
      msg.textContent = "Remplis le nom, la date de début et la date de fin.";
      msg.style.color = "var(--error-soft)";
      return;
    }
    if(new Date(endDate) < new Date(startDate)){
      msg.textContent = "La date de fin doit être après la date de début.";
      msg.style.color = "var(--error-soft)";
      return;
    }

    btn.disabled = true;
    const group = {
      id: `grp_${Date.now()}`, name, startDate, endDate, levels, competences,
      members: [], createdAt: Date.now()
    };
    await saveGroup(group);
    msg.textContent = `✅ Groupe "${name}" créé.`;
    msg.style.color = "var(--success)";
    document.getElementById("grpName").value = "";
    document.querySelectorAll(".grp-level-cb, .grp-comp-cb").forEach(cb=> cb.checked = false);
    btn.disabled = false;
    refreshGroupsList();
  });

  refreshGroupsList();

  /* ---------- Messagerie (formateur) ---------- */
  async function refreshConversations(){
    const zone = document.getElementById("conversationsList");
    const all = await MessagesAPI.loadAll();
    const byStudent = {};
    all.forEach(m=>{
      if(!byStudent[m.studentKey]) byStudent[m.studentKey] = { studentKey: m.studentKey, studentName: m.studentName, messages: [], unread: 0 };
      byStudent[m.studentKey].messages.push(m);
      if(m.from === "etudiant" && !m.readByFormateur) byStudent[m.studentKey].unread++;
    });
    const conversations = Object.values(byStudent).sort((a,b)=>{
      const lastA = Math.max(...a.messages.map(m=>m.createdAt));
      const lastB = Math.max(...b.messages.map(m=>m.createdAt));
      return lastB - lastA;
    });
    if(conversations.length === 0){
      zone.innerHTML = `<p class="dim">Aucune conversation pour le moment.</p>`;
      return;
    }
    zone.innerHTML = conversations.map(c=>`
      <div class="conv-row" data-convstudent="${c.studentKey}">
        <span>${c.studentName}</span>
        ${c.unread > 0 ? `<span class="unread-badge">${c.unread} non lu(s)</span>` : `<span class="dim" style="font-size:11px;">à jour</span>`}
      </div>`).join("");
    zone.querySelectorAll("[data-convstudent]").forEach(row=>{
      row.addEventListener("click", ()=> openConversation(row.dataset.convstudent));
    });
  }

  async function openConversation(studentKey){
    const zone = document.getElementById("conversationThreadZone");
    zone.innerHTML = `<p class="dim">Chargement de la conversation...</p>`;
    const all = await MessagesAPI.loadAll();
    const thread = all.filter(m=>m.studentKey === studentKey).sort((a,b)=>a.createdAt-b.createdAt);
    const studentName = thread.length ? thread[0].studentName : studentKey;
    zone.innerHTML = `
      <h3 style="margin-bottom:10px;">Conversation avec ${studentName}</h3>
      <div class="msg-thread" id="adminMsgThread"></div>
      <div class="msg-input-row">
        <textarea id="adminMsgInput" placeholder="Écris ta réponse..."></textarea>
        <button class="btn btn-gold" id="adminMsgSendBtn">Envoyer</button>
      </div>
    `;
    document.getElementById("adminMsgThread").innerHTML = thread.map(m=>
      `<div class="msg-bubble from-${m.from}">${m.contenu}<span class="msg-date">${new Date(m.createdAt).toLocaleString("fr-FR")}</span></div>`
    ).join("");
    // Marquer les messages de l'étudiant comme lus par le formateur
    for(const m of thread){
      if(m.from === "etudiant" && !m.readByFormateur){ m.readByFormateur = true; await MessagesAPI.save(m); }
    }
    refreshConversations();

    document.getElementById("adminMsgSendBtn").addEventListener("click", async ()=>{
      const input = document.getElementById("adminMsgInput");
      const contenu = input.value.trim();
      if(!contenu) return;
      const btn = document.getElementById("adminMsgSendBtn");
      btn.disabled = true;
      await MessagesAPI.save({
        id: `message_${Date.now()}`, studentKey, studentName,
        from: "formateur", contenu, createdAt: Date.now(), readByFormateur: true, readByEtudiant: false
      });
      // Notifier l'élève
      const progress = await loadProgress(studentName);
      if(!progress.notifications) progress.notifications = [];
      progress.notifications.unshift({ message: "Nouveau message de votre formateur.", date: Date.now(), read: false });
      progress.notifications = progress.notifications.slice(0, 50);
      await saveProgress(studentName, progress);

      input.value = "";
      btn.disabled = false;
      openConversation(studentKey);
    });
  }

  refreshConversations();
}

// Aperçu d'un cours généré : édition, validation, puis assignation directe au groupe
// d'où l'analyse est partie — sans obliger le formateur à quitter la page (§21).
function renderCoursPreview(cours, container, group){
  container.innerHTML = `
    <div class="card" style="max-width:680px;">
      <p class="dim" style="font-size:11px; text-transform:uppercase; letter-spacing:1px;">Aperçu du cours — modifiable avant validation</p>
      <div class="gen-field"><label>Titre</label><input type="text" id="coursTitre" value="${escapeHtml(cours.titre)}"></div>
      <div class="gen-field"><label>Objectifs pédagogiques (un par ligne)</label><textarea id="coursObjectifs">${escapeHtml((cours.objectifs||[]).join("\n"))}</textarea></div>
      <div class="gen-field"><label>Pourquoi c'est important pour le TCF</label><textarea id="coursPourquoi">${escapeHtml(cours.pourquoiTCF)}</textarea></div>
      <div class="gen-field"><label>Rappel de cours</label><textarea id="coursRappel" style="min-height:100px;">${escapeHtml(cours.rappelCours)}</textarea></div>
      <div class="gen-field"><label>Méthode</label><textarea id="coursMethode">${escapeHtml(cours.methode)}</textarea></div>
      <div class="gen-field"><label>Pièges fréquents (un par ligne)</label><textarea id="coursPieges">${escapeHtml((cours.pieges||[]).join("\n"))}</textarea></div>
      <div class="gen-field"><label>Exemples (un par ligne)</label><textarea id="coursExemples">${escapeHtml((cours.exemples||[]).join("\n"))}</textarea></div>
      <div class="gen-field"><label>Mini-exercices (JSON)</label><textarea id="coursMini" style="min-height:110px; font-family:var(--font-mono); font-size:11px;">${escapeHtml(JSON.stringify(cours.miniExercices, null, 2))}</textarea></div>
      <div class="gen-field"><label>Exercices TCF (JSON)</label><textarea id="coursExosTCF" style="min-height:140px; font-family:var(--font-mono); font-size:11px;">${escapeHtml(JSON.stringify(cours.exercicesTCF, null, 2))}</textarea></div>
      <div class="gen-field"><label>Test final (JSON)</label><textarea id="coursTest" style="min-height:140px; font-family:var(--font-mono); font-size:11px;">${escapeHtml(JSON.stringify(cours.testFinal, null, 2))}</textarea></div>
      <div class="gen-field"><label>Conseil final</label><textarea id="coursConseil">${escapeHtml(cours.conseilFinal)}</textarea></div>

      <div class="lesson-actions" style="margin-top:12px;">
        <button class="btn btn-ghost" id="coursRegenBtn" style="color:var(--text-ink); border-color:var(--gold-soft);">🔄 Régénérer tout le cours</button>
        <button class="btn btn-gold" id="coursValidateBtn">✓ Valider le cours</button>
      </div>
      <p id="coursMsg" style="font-size:12px; margin-top:8px;"></p>
      <div id="coursAssignZone" style="margin-top:14px;"></div>
    </div>
  `;

  function readEditedCours(){
    let mini=[], exosTCF=[], test=[];
    try{ mini = JSON.parse(document.getElementById("coursMini").value); }catch(e){}
    try{ exosTCF = JSON.parse(document.getElementById("coursExosTCF").value); }catch(e){}
    try{ test = JSON.parse(document.getElementById("coursTest").value); }catch(e){}
    return {
      ...cours,
      titre: document.getElementById("coursTitre").value,
      objectifs: document.getElementById("coursObjectifs").value.split("\n").filter(Boolean),
      pourquoiTCF: document.getElementById("coursPourquoi").value,
      rappelCours: document.getElementById("coursRappel").value,
      methode: document.getElementById("coursMethode").value,
      pieges: document.getElementById("coursPieges").value.split("\n").filter(Boolean),
      exemples: document.getElementById("coursExemples").value.split("\n").filter(Boolean),
      miniExercices: mini, exercicesTCF: exosTCF, testFinal: test,
      conseilFinal: document.getElementById("coursConseil").value
    };
  }

  document.getElementById("coursRegenBtn").addEventListener("click", async ()=>{
    const btn = document.getElementById("coursRegenBtn");
    btn.disabled = true; btn.textContent = "Génération...";
    try{
      const fresh = await generateCoursAI({ niveau: cours.niveau, competence: cours.competence, competenceLabel: cours.competenceLabel, theme: cours.theme });
      renderCoursPreview(fresh, container, group);
    }catch(e){
      btn.disabled = false; btn.textContent = "🔄 Régénérer tout le cours";
    }
  });

  document.getElementById("coursValidateBtn").addEventListener("click", async ()=>{
    const btn = document.getElementById("coursValidateBtn");
    const msg = document.getElementById("coursMsg");
    btn.disabled = true;
    const edited = readEditedCours();
    edited.statut = "validé";
    edited.auteur = (state.formateurSession && state.formateurSession.email) || "Formateur";
    await CoursAPI.save(edited);
    msg.textContent = "✅ Cours validé et enregistré.";
    msg.style.color = "var(--success)";

    const assignZone = document.getElementById("coursAssignZone");
    assignZone.innerHTML = `
      <div class="card" style="background:var(--ink);">
        <h3 style="font-size:14px; margin-top:0;">🚀 Assigner ce cours au groupe "${group.name}"</h3>
        <div class="gen-form" style="grid-template-columns:1fr 1fr;">
          <div class="gen-field"><label>Date de début</label><input type="date" id="coursDateDebut"></div>
          <div class="gen-field"><label>Date limite</label><input type="date" id="coursDateLimite"></div>
        </div>
        <label class="checkbox-item" style="margin:6px 0;"><input type="checkbox" id="coursObligatoire" checked> Obligatoire</label>

        <button class="btn btn-gold" id="coursAssignBtn" style="margin-top:8px;">🚀 Assigner au groupe</button>
        <p id="coursAssignMsg" style="font-size:12px; margin-top:6px;"></p>
      </div>
    `;
    document.getElementById("coursAssignBtn").addEventListener("click", async ()=>{
      const assignBtn = document.getElementById("coursAssignBtn");
      assignBtn.disabled = true;
      edited.statut = "assigné";
      edited.groupId = group.id;
      await CoursAPI.save(edited);
      const allQuestions = [...(edited.exercicesTCF||[]), ...(edited.testFinal||[])];
      const devoir = {
        id: `devoir_${Date.now()}`, titre: edited.titre, description: edited.pourquoiTCF,
        niveau: edited.niveau, competence: edited.competence, groupId: group.id,
        dateLimite: document.getElementById("coursDateLimite").value || null,
        datePublication: Date.now(), customQuestions: allQuestions, nbQuestions: allQuestions.length,
        coursId: edited.id, obligatoire: document.getElementById("coursObligatoire").checked,
        note: document.getElementById("coursNote").checked, createdAt: Date.now()
      };
      await DevoirsAPI.save(devoir);
      await notifyGroupMembers(group, `Nouveau cours disponible : "${edited.titre}".`);
      document.getElementById("coursAssignMsg").textContent = "🎉 Cours assigné et étudiants notifiés !";
      document.getElementById("coursAssignMsg").style.color = "var(--success)";
    });
  });
}

function attachAdminGroupDetail(){
  const g = state.adminGroupDetailObj;
  const backBtn = document.getElementById("backToGroupsFromDetail");
  if(backBtn) backBtn.addEventListener("click", ()=>{ stopGroupChatPolling(); state.view = "admin"; render(); });
  if(!g) return;

  const adminLiveBtn = document.getElementById("adminLiveBtn");
  if(adminLiveBtn) adminLiveBtn.addEventListener("click", ()=> toggleLiveSession(g.id, "adminLiveZone"));

  const adminChatUI = setupGroupChatUI({
    zoneId: "adminGroupChatZone", inputId: "adminGroupChatInput", sendBtnId: "adminGroupChatSendBtn",
    groupId: g.id, myKey: "formateur", myName: "👨‍🏫 Formateur"
  });
  stopGroupChatPolling();
  state.currentChatUI = adminChatUI;
  // Le sondage n'est plus le mécanisme principal : Supabase Realtime s'en charge.
  // Il ne reste qu'en filet de sécurité, à intervalle bien plus large (60s).
  state.groupChatPollHandle = setInterval(adminChatUI.refresh, 60000);
  state.groupChatFocusHandler = adminChatUI.refresh;
  state.groupChatVisHandler = ()=>{ if(!document.hidden) adminChatUI.refresh(); };
  window.addEventListener("focus", state.groupChatFocusHandler);
  document.addEventListener("visibilitychange", state.groupChatVisHandler);
  window.addEventListener("online", state.groupChatFocusHandler);

  async function refreshGroupStudentsList(){
    const zone = document.getElementById("groupStudentsList");
    const students = await loadAllStudents();
    const members = (g.members || []).map(key=>students.find(s=>s.key === key)).filter(Boolean);
    if(members.length === 0){ zone.innerHTML = `<p class="dim">Aucun étudiant dans ce groupe pour le moment.</p>`; return; }

    const rowsData = [];
    for(const m of members){
      const progress = await loadProgress(m.displayName);
      const avg = computeAverageFromProgress(progress);
      rowsData.push({ key: m.key, displayName: m.displayName, avg, progress });
    }

    zone.innerHTML = rowsData.map(r=>`
      <div class="student-row" data-groupstudent="${r.key}">
        <span class="s-name">${r.displayName}</span>
        <span class="s-meta">Progression : ${r.avg !== null ? r.avg + "%" : "—"}</span>
      </div>
      <div id="gstudent-detail-${r.key}"></div>
    `).join("");

    zone.querySelectorAll("[data-groupstudent]").forEach(row=>{
      row.addEventListener("click", async ()=>{
        const key = row.dataset.groupstudent;
        const r = rowsData.find(x=>x.key === key);
        const detailZone = document.getElementById(`gstudent-detail-${key}`);
        if(detailZone.innerHTML.trim() !== ""){ detailZone.innerHTML = ""; return; }

        const progress = r.progress;
        const report = computeProgressionReport(progress);
        const compRows = Object.values(report.byCompetence).filter(c=>c.scoreCount>0)
          .map(c=>`<tr><td>${c.label}</td><td>${c.avgScore}%</td></tr>`).join("");
        const topDiffs = (progress.erreurs || []).reduce((acc,e)=>{ acc[e.lessonTitle]=(acc[e.lessonTitle]||0)+1; return acc; }, {});
        const topDiffsList = Object.entries(topDiffs).sort((a,b)=>b[1]-a[1]).slice(0,5);
        const devoirsAll = await DevoirsAPI.loadAll();
        const groupDevoirs = devoirsAll.filter(d=>d.groupId === g.id);
        const devoirsRows = groupDevoirs.map(d=>{
          const rec = progress.devoirsCompletes && progress.devoirsCompletes[d.id];
          return `<tr><td>${d.titre}</td><td>${rec ? (rec.score !== null ? "Terminé — "+rec.score+"%" : "Terminé") : "Non commencé"}</td></tr>`;
        }).join("");

        detailZone.innerHTML = `
          <div class="student-detail">
            <p><strong>Niveau estimé :</strong> ${report.currentLevel || "—"}</p>
            <table><tr><th>Compétence</th><th>Score moyen</th></tr>${compRows || '<tr><td colspan="2" class="dim">Pas encore de données</td></tr>'}</table>
            ${topDiffsList.length ? `<p style="margin-top:10px;"><strong>Difficultés fréquentes :</strong> ${topDiffsList.map(([t,c])=>`${t} (${c})`).join(", ")}</p>` : ""}
            ${groupDevoirs.length ? `<p style="margin-top:10px;"><strong>Devoirs de ce groupe :</strong></p><table>${devoirsRows}</table>` : ""}
            <p class="dim" style="font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-top:14px;">Observation pédagogique privée</p>
            <textarea id="gobs-${key}" style="min-height:70px;" placeholder="Ex: progresse bien en CE, à encourager en expression orale...">${progress.observationFormateur || ""}</textarea>
            <button class="btn btn-ghost" data-savegobs="${key}" style="font-size:12px; padding:6px 12px; margin-top:6px; color:var(--text-ink); border-color:var(--gold-soft);">Enregistrer l'observation</button>
            <p id="gobsMsg-${key}" style="font-size:12px; margin-top:6px; color:var(--success);"></p>
          </div>
        `;
        detailZone.querySelector("[data-savegobs]").addEventListener("click", async (e)=>{
          e.target.disabled = true;
          const fresh = await loadProgress(r.displayName);
          fresh.observationFormateur = document.getElementById(`gobs-${key}`).value;
          await saveProgress(r.displayName, fresh);
          document.getElementById(`gobsMsg-${key}`).textContent = "✅ Observation enregistrée.";
          e.target.disabled = false;
        });
      });
    });
  }

  async function refreshDevoirsList(){
    const zone = document.getElementById("devoirsList");
    const all = await DevoirsAPI.loadAll();
    const devoirs = all.filter(d=>d.groupId === g.id);
    if(devoirs.length === 0){ zone.innerHTML = `<p class="dim">Aucun devoir créé pour ce groupe.</p>`; return; }
    const students = await loadAllStudents();

// Mélange Fisher-Yates — garantit que deux tentatives du même examen ne soient jamais identiques
function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleQuestionOptions(q){
  const idx = shuffleArray(q.options.map((_,i)=>i));
  return { ...q, options: idx.map(i=>q.options[i]), answer: idx.indexOf(q.answer) };
}

function buildExam(level){
  const questions = [];
  EXAM_QUIZ_MODULE_IDS.forEach(modId=>{
    const mod = DATA.modules.find(m=>m.id === modId);
    const lessons = shuffleArray(mod.lessons.filter(l=>l.level === level));
    lessons.forEach(lesson=>{
      lesson.questions.forEach(q=>{
        questions.push(shuffleQuestionOptions({
          moduleId: mod.id,
          moduleName: mod.name,
          lessonTitle: lesson.title,
          transcript: lesson.transcript || null,
          text: lesson.text || null,
          q: q.q, options: q.options, answer: q.answer
        }));
      });
    });
  });
  return questions;
}

// Format officiel TCF : 39 questions en CO (35 min) et 39 questions en CE (60 min),
// difficulté progressive de A1 à C2. Répartition sur les 6 niveaux (somme = 39).
const FULL_EXAM_LEVEL_COUNTS = { A1: 7, A2: 7, B1: 7, B2: 6, C1: 6, C2: 6 };
const FULL_EXAM_CONFIG = {
  co: { minutes: 35, label: "Compréhension orale", totalQuestions: 39 },
  ce: { minutes: 60, label: "Compréhension écrite", totalQuestions: 39 }
};

function buildFullExam(moduleId){
  const mod = DATA.modules.find(m=>m.id === moduleId);
  const questions = [];
  LEVELS.forEach(level=>{
    const target = FULL_EXAM_LEVEL_COUNTS[level];
    let count = 0;
    const lessons = shuffleArray(mod.lessons.filter(l=>l.level === level));
    lessons.forEach(lesson=>{
      lesson.questions.forEach(q=>{
        if(count >= target) return;
        questions.push(shuffleQuestionOptions({
          moduleId: mod.id,
          moduleName: mod.name,
          lessonTitle: lesson.title,
          transcript: lesson.transcript || null,
          text: lesson.text || null,
          level,
          q: q.q, options: q.options, answer: q.answer
        }));
        count++;
      });
    });
  });
  return questions;
}

function buildMiniTest(level, count){
  count = count || 10;
  const pool = [];
  EXAM_QUIZ_MODULE_IDS.forEach(modId=>{
    const mod = DATA.modules.find(m=>m.id === modId);
    mod.lessons.filter(l=>l.level === level).forEach(lesson=>{
      lesson.questions.forEach(q=>{
        pool.push({ moduleId: mod.id, moduleName: mod.name, lessonTitle: lesson.title, transcript: lesson.transcript || null, text: lesson.text || null, q: q.q, options: q.options, answer: q.answer });
      });
    });
  });
  const byLesson = {};
  pool.forEach(q=>{ (byLesson[q.lessonTitle] = byLesson[q.lessonTitle] || []).push(q); });
  const groups = shuffleArray(Object.values(byLesson));
  const result = [];
  for(const group of groups){
    if(result.length >= count) break;
    group.forEach(q=>{ if(result.length < count) result.push(shuffleQuestionOptions(q)); });
  }
  return result;
}

function buildCompetenceTest(competence, level, count){
  count = count || 10;
  const isStructComp = competence === "grammaire" || competence === "vocabulaire";
  const modId = isStructComp ? "structures" : competence;
  const mod = DATA.modules.find(m=>m.id === modId);
  let lessons = mod.lessons.filter(l=>l.level === level);
  if(isStructComp) lessons = lessons.filter(l=>classifyStructureLesson(l) === competence);
  const pool = [];
  lessons.forEach(lesson=>{
    (lesson.questions || []).forEach(q=>{
      pool.push({ moduleId: mod.id, moduleName: mod.name, lessonTitle: lesson.title, transcript: lesson.transcript || null, text: lesson.text || null, q: q.q, options: q.options, answer: q.answer });
    });
  });
  const byLesson = {};
  pool.forEach(q=>{ (byLesson[q.lessonTitle] = byLesson[q.lessonTitle] || []).push(q); });
  const groups = shuffleArray(Object.values(byLesson));
  const result = [];
  for(const group of groups){
    if(result.length >= count) break;
    group.forEach(q=>{ if(result.length < count) result.push(shuffleQuestionOptions(q)); });
  }
  return result;
}

function lessonCompetence(moduleId, lessonTitle){
  if(moduleId !== "structures") return moduleId;
  const structLessons = DATA.modules.find(m=>m.id === "structures").lessons;
  const lesson = structLessons.find(l=>l.title === lessonTitle);
  return lesson ? classifyStructureLesson(lesson) : "grammaire";
}

async function recordError(entry){
  if(!state.progress.erreurs) state.progress.erreurs = [];
  const dedupeKey = entry.lessonTitle + "|" + entry.question;
  const existing = state.progress.erreurs.find(e => (e.lessonTitle + "|" + e.question) === dedupeKey);
  if(existing){
    existing.tentatives = (existing.tentatives || 1) + 1;
    existing.reponseDonnee = entry.reponseDonnee;
    existing.date = Date.now();
  } else {
    state.progress.erreurs.unshift({ ...entry, tentatives: 1, date: Date.now() });
  }
  state.progress.erreurs = state.progress.erreurs.slice(0, 300);
  await saveProgress(state.student, state.progress);
}

async function recordErrorsFromExam(questions, answers){
  let changed = false;
  questions.forEach((q,i)=>{
    if(answers[i] !== null && answers[i] !== q.answer){
      const competence = lessonCompetence(q.moduleId, q.lessonTitle);
      const dedupeKey = q.lessonTitle + "|" + q.q;
      const existing = (state.progress.erreurs || []).find(e => (e.lessonTitle + "|" + e.question) === dedupeKey);
      if(existing){
        existing.tentatives = (existing.tentatives || 1) + 1;
        existing.reponseDonnee = q.options[answers[i]];
        existing.date = Date.now();
      } else {
        if(!state.progress.erreurs) state.progress.erreurs = [];
        state.progress.erreurs.unshift({
          lessonTitle: q.lessonTitle, question: q.q,
          reponseDonnee: q.options[answers[i]], bonneReponse: q.options[q.answer],
          niveau: q.level || state.examLevel || null, competence,
          tentatives: 1, date: Date.now()
        });
      }
      changed = true;
    }
  });
  if(changed){
    state.progress.erreurs = (state.progress.erreurs || []).slice(0, 300);
    await saveProgress(state.student, state.progress);
  }
}

function computeTopDifficulties(n){
  const errors = state.progress.erreurs || [];
  const byTitle = {};
  errors.forEach(e=>{
    if(!byTitle[e.lessonTitle]) byTitle[e.lessonTitle] = { lessonTitle: e.lessonTitle, competence: e.competence, niveau: e.niveau, count: 0, tentativesMax: 0 };
    byTitle[e.lessonTitle].count++;
    byTitle[e.lessonTitle].tentativesMax = Math.max(byTitle[e.lessonTitle].tentativesMax, e.tentatives || 1);
  });
  return Object.values(byTitle).sort((a,b)=> b.count - a.count || b.tentativesMax - a.tentativesMax).slice(0, n || 5);
}

function computeWeeklyFocus(){
  const top = computeTopDifficulties(3);
  if(top.length === 0) return "Aucune erreur enregistrée pour le moment — continue à t'entraîner pour affiner cette analyse.";
  const items = top.map(t=>t.lessonTitle);
  return `Cette semaine, concentre-toi sur : ${items.join(", ")}.`;
}

async function buildErrorReviewSession(){
  const errors = state.progress.erreurs || [];
  if(errors.length === 0) return [];
  const clusters = {};
  errors.forEach(e=>{
    const key = e.competence + "|" + e.niveau;
    if(!clusters[key]) clusters[key] = { competence: e.competence, niveau: e.niveau, count: 0, theme: e.lessonTitle };
    clusters[key].count++;
  });
  const top = Object.values(clusters).sort((a,b)=>b.count - a.count).slice(0, 4);
  const questions = [];
  for(const cluster of top){
    if(cluster.competence === "expression_ecrite" || cluster.competence === "expression_orale") continue;
    try{
      const ex = await generateExerciseAI({ niveau: cluster.niveau || "B1", competence: cluster.competence, theme: cluster.theme, difficulte: "Moyen", type: "qcm" });
      if(ex && ex.questions){
        ex.questions.forEach(q=>{
          questions.push({
            moduleId: (cluster.competence === "grammaire" || cluster.competence === "vocabulaire") ? "structures" : cluster.competence,
            moduleName: GEN_COMPETENCES.find(c=>c.id===cluster.competence)?.label || cluster.competence,
            lessonTitle: `Révision : ${cluster.theme}`,
            transcript: null, text: ex.contenu || null,
            q: q.q, options: q.options, answer: q.answer
          });
        });
      }
    }catch(err){
      console.error("Erreur génération session de révision", err);
    }
  }
  return questions;
}

  }
}

async function attachMessagerie(){

  const studentKey = state.student.trim().toLowerCase();

  async function refreshThread(){
    const zone = document.getElementById("msgThreadZone");
    const all = await MessagesAPI.loadAll();
    const thread = all.filter(m=>m.studentKey === studentKey).sort((a,b)=>a.createdAt-b.createdAt);
    zone.innerHTML = thread.length
      ? thread.map(m=>`<div class="msg-bubble from-${m.from}">${m.contenu}<span class="msg-date">${new Date(m.createdAt).toLocaleString("fr-FR")}</span></div>`).join("")
      : `<p class="dim">Aucun message pour le moment — écris le premier !</p>`;
    zone.scrollTop = zone.scrollHeight;
    // Marquer les messages du formateur comme lus par l'élève
    let changed = false;
    thread.forEach(m=>{ if(m.from === "formateur" && !m.readByEtudiant){ m.readByEtudiant = true; changed = true; MessagesAPI.save(m); } });
  }

  document.getElementById("msgSendBtn").addEventListener("click", async ()=>{
    const input = document.getElementById("msgInput");
    const contenu = input.value.trim();
    if(!contenu) return;
    const btn = document.getElementById("msgSendBtn");
    btn.disabled = true;
    await MessagesAPI.save({
      id: `message_${Date.now()}`, studentKey, studentName: state.student,
      from: "etudiant", contenu, createdAt: Date.now(), readByFormateur: false, readByEtudiant: true
    });
    input.value = "";
    btn.disabled = false;
    refreshThread();
  });

  refreshThread();
}

function formatMMSS(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const mm = Math.floor(s/60).toString().padStart(2,"0");
  const ss = (s%60).toString().padStart(2,"0");
  return `${mm}:${ss}`;
}
