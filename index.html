<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TFG — Préparation TCF</title>
<style>
  :root{
    --ink:#0E2140;
    --ink-soft:#16305A;
    --ink-softer:#1E3E70;
    --paper:#ECE4CF;
    --paper-soft:#F4EEDF;
    --gold:#C8952A;
    --gold-soft:#E7C888;
    --success:#4C7A5D;
    --success-soft:#D9E6DC;
    --error:#A6432D;
    --error-soft:#EFDAD2;
    --text-ink:#F3EFE4;
    --text-ink-dim:#B9C3D9;
    --text-paper:#16223B;
    --text-paper-dim:#5B5540;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text-ink);
    font-family:var(--font-body);
    min-height:100vh;
  }
  #app{max-width:960px;margin:0 auto;padding:32px 20px 80px;}
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:32px;
    line-height:1.2;
    margin:0 0 10px;
    color:var(--text-ink);
  }
  h2{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--text-ink);
  }
  p.lead{color:var(--text-ink-dim); font-size:15px; line-height:1.6; max-width:560px; margin:0 0 24px;}
  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:8px;
    padding:12px 22px;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .btn-gold{background:var(--gold); color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--text-ink); border:1px solid var(--ink-softer);}
  .btn-ghost:hover{background:var(--ink-soft);}
  input[type=text]{
    font-family:var(--font-body);
    font-size:15px;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--ink-softer);
    background:var(--ink-soft);
    color:var(--text-ink);
    width:100%;
    max-width:320px;
  }
  input[type=text]:focus-visible{outline:2px solid var(--gold); outline-offset:1px;}
  .login-wrap{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
  }
  .card{
    background:var(--paper);
    color:var(--text-paper);
    border-radius:var(--radius);
    padding:22px 22px;
  }
  .card p, .card li{color:var(--text-paper);}
  .card .dim{color:var(--text-paper-dim);}
  .top-row{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;background:var(--gold);
    color:var(--ink); font-family:var(--font-display); font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .brand-name{font-family:var(--font-mono); font-size:12px; letter-spacing:1px; color:var(--text-ink-dim);}
  .grid-dash{
    display:grid; grid-template-columns: 150px 1fr; gap:22px; align-items:start;
  }
  @media (max-width:640px){ .grid-dash{grid-template-columns:1fr;} }

  /* Signature: CECR ladder */
  .ladder{
    background:var(--ink-soft);
    border-radius:var(--radius);
    padding:16px 10px;
    display:flex;
    flex-direction:column-reverse;
    gap:6px;
  }
  .rung{
    border-radius:6px;
    padding:8px 6px;
    text-align:center;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:1px;
    color:var(--text-ink-dim);
    background:var(--ink-softer);
    opacity:.45;
    position:relative;
  }
  .rung.below{opacity:.75;}
  .rung.current{
    opacity:1;
    background:var(--gold);
    color:var(--ink);
    font-weight:700;
    box-shadow:0 0 0 3px rgba(200,149,42,0.25);
  }
  .ladder-caption{font-family:var(--font-mono); font-size:10px; color:var(--text-ink-dim); text-align:center; margin-top:10px; line-height:1.5;}

  .module-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-top:18px;}
  .module-card{
    background:var(--ink-soft);
    border:1px solid var(--ink-softer);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    transition:border-color .12s ease;
  }
  .module-card:hover{border-color:var(--gold);}
  .module-card .m-eyebrow{font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; color:var(--gold-soft); margin-bottom:6px;}
  .module-card h3{font-family:var(--font-display); font-size:17px; margin:0 0 6px; color:var(--text-ink);}
  .module-card p{font-size:12px; color:var(--text-ink-dim); margin:0 0 12px; line-height:1.5;}
  .progress-bar{height:5px; background:var(--ink-softer); border-radius:4px; overflow:hidden;}
  .progress-bar > div{height:100%; background:var(--gold);}
  .progress-label{font-family:var(--font-mono); font-size:10px; color:var(--text-ink-dim); margin-top:6px;}

  .lesson-list{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .lesson-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:8px;
    padding:12px 14px; cursor:pointer;
  }
  .lesson-row:hover{border-color:var(--gold);}
  .lesson-row .status{font-family:var(--font-mono); font-size:11px; color:var(--gold-soft);}
  .lesson-left{display:flex; align-items:center; gap:10px;}
  .level-badge{
    font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.5px;
    color:var(--ink); background:var(--gold-soft); border-radius:5px; padding:2px 7px; flex-shrink:0;
  }
  .level-filter{display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 4px;}
  .level-filter button{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.5px; padding:6px 12px;
    border-radius:6px; border:1px solid var(--ink-softer); background:var(--ink-soft);
    color:var(--text-ink-dim); cursor:pointer;
  }
  .level-filter button.active{background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700;}

  /* Examen blanc */
  .exam-hero{
    background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:var(--radius);
    padding:24px; margin-bottom:30px;
  }
  .exam-level-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:16px;}
  .exam-level-card{
    background:var(--ink); border:1px solid var(--ink-softer); border-radius:10px; padding:16px;
    text-align:center; cursor:pointer; transition:border-color .12s ease;
  }
  .exam-level-card:hover{border-color:var(--gold);}
  .exam-level-card .lvl{font-family:var(--font-display); font-size:22px; color:var(--gold-soft);}
  .exam-level-card .lvl-desc{font-size:11px; color:var(--text-ink-dim); margin-top:4px;}
  .exam-topbar{
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--ink-softer);
  }
  .exam-timer{
    font-family:var(--font-mono); font-size:18px; font-weight:700; color:var(--gold-soft);
    background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:8px; padding:8px 16px;
  }
  .exam-timer.low{color:var(--error); border-color:var(--error);}
  .exam-progress-text{font-family:var(--font-mono); font-size:12px; color:var(--text-ink-dim);}
  .exam-module-tag{
    font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; color:var(--gold-soft);
    text-transform:uppercase; margin-bottom:6px;
  }
  .exam-result-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin:18px 0;}
  .exam-result-card{
    background:var(--ink); border:1px solid var(--ink-softer); border-radius:10px; padding:16px; text-align:center;
  }
  .exam-result-card .label{font-family:var(--font-mono); font-size:10px; color:var(--text-ink-dim); letter-spacing:1px;}
  .exam-result-card .score{font-family:var(--font-display); font-size:26px; color:var(--gold-soft); margin-top:6px;}
  .exam-next-list{display:flex; flex-direction:column; gap:8px; margin-top:16px;}

  /* Simulateur Expression Écrite */
  .sim-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .sim-tab{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.5px; padding:8px 14px;
    border-radius:6px; border:1px solid var(--ink-softer); background:var(--ink-soft);
    color:var(--text-ink-dim); cursor:pointer;
  }
  .sim-tab.active{background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700;}
  .sim-tab.filled::after{content:" ✓"; color:var(--success);}
  .sim-charbar{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0;}
  .sim-charbar button{
    font-family:var(--font-display); font-size:14px; width:32px; height:32px; border-radius:6px;
    border:1px solid #D8CDAE; background:var(--paper-soft); color:var(--text-paper); cursor:pointer;
  }
  .sim-charbar button:hover{border-color:var(--gold);}
  .sim-wordcount{font-family:var(--font-mono); font-size:12px; margin-top:6px;}
  .sim-wordcount.ok{color:var(--success);}
  .sim-wordcount.low, .sim-wordcount.high{color:var(--error);}
  .sim-feedback-card{
    background:var(--ink); border:1px solid var(--ink-softer); border-radius:10px; padding:16px; margin-bottom:14px;
  }
  .sim-feedback-card h3{font-size:16px; margin:0 0 8px;}
  .sim-feedback-list{margin:6px 0 0; padding-left:18px; font-size:13px; line-height:1.6;}
  .sim-feedback-list.good li{color:var(--success);}
  .sim-feedback-list.improve li{color:var(--gold-soft);}
  .sim-loading{font-family:var(--font-mono); font-size:13px; color:var(--text-ink-dim); margin-top:16px;}

  /* Cours et méthode */
  .method-card{
    background:var(--ink-soft); border:1px solid var(--gold-soft); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:20px;
  }
  .method-card .m-tag{font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; color:var(--gold-soft); text-transform:uppercase; margin-bottom:8px;}
  .method-card h3{font-family:var(--font-display); font-size:17px; margin:0 0 8px; color:var(--text-ink);}
  .method-card p{font-size:13px; line-height:1.6; margin:0; color:var(--text-ink-dim);}
  .cours-card{
    background:var(--paper-soft); border:1px solid var(--gold); border-radius:10px;
    padding:16px 18px; margin-bottom:16px; max-width:640px;
  }
  .cours-card .c-tag{font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; color:var(--gold); text-transform:uppercase; margin-bottom:8px;}
  .cours-card p{font-size:14px; line-height:1.6; margin:0; color:var(--text-paper);}

  /* Formules d'accès */
  .plan-badge{
    font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.5px;
    padding:3px 8px; border-radius:5px; margin-left:8px;
  }
  .plan-badge.free{background:var(--ink-softer); color:var(--text-ink-dim);}
  .plan-badge.premium{background:var(--gold); color:var(--ink);}
  .lock-row{opacity:.55; cursor:pointer;}
  .lock-icon{margin-right:4px;}
  .plans-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:20px 0;}
  .plan-card{
    background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:var(--radius);
    padding:20px; display:flex; flex-direction:column; gap:12px;
  }
  .plan-card.highlight{border-color:var(--gold); box-shadow:0 0 0 2px rgba(200,149,42,0.2);}
  .plan-card h3{font-family:var(--font-display); font-size:20px; margin:0; color:var(--text-ink);}
  .plan-card .price{font-family:var(--font-display); font-size:26px; color:var(--gold-soft);}
  .plan-card .duration{font-family:var(--font-mono); font-size:11px; color:var(--text-ink-dim);}
  .plan-card ul{margin:0; padding-left:18px; font-size:13px; color:var(--text-ink-dim); line-height:1.6;}
  .activation-card{
    background:var(--paper); color:var(--text-paper); border-radius:var(--radius); padding:22px; margin-top:24px; max-width:640px;
  }
  .activation-card h2{color:var(--text-paper);}
  .activation-card input[type=text]{max-width:280px; margin-right:10px;}
  .payment-steps{margin:10px 0 0; padding-left:18px; font-size:13px; line-height:1.7; color:var(--text-paper);}

  /* Espace formateur */
  .admin-code-display{
    font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--gold);
    background:var(--paper-soft); border:1px dashed var(--gold); border-radius:8px;
    padding:14px 18px; margin-top:14px; letter-spacing:1px; word-break:break-all;
  }
  table.codes-table{border-collapse:collapse; width:100%; font-size:12px; margin-top:16px;}
  table.codes-table th, table.codes-table td{border:1px solid var(--ink-softer); padding:6px 8px; text-align:left; color:var(--text-ink-dim);}
  table.codes-table th{color:var(--text-ink); font-family:var(--font-mono); font-size:10px;}
  .status-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}
  .status-dot.free{background:var(--success);}
  .status-dot.used{background:var(--error);}

  .qtext{font-family:var(--font-display); font-size:16px; margin:0 0 10px; line-height:1.5;}
  .option-row{
    display:block; width:100%; text-align:left;
    background:var(--paper-soft); border:1px solid #D8CDAE; border-radius:8px;
    padding:10px 12px; margin-bottom:8px; cursor:pointer; font-size:14px; color:var(--text-paper);
    font-family:var(--font-body);
  }
  .option-row:hover{border-color:var(--gold);}
  .option-row.correct{background:var(--success-soft); border-color:var(--success); color:var(--text-paper);}
  .option-row.wrong{background:var(--error-soft); border-color:var(--error); color:var(--text-paper);}
  .option-row[disabled]{cursor:default;}
  .feedback{font-size:13px; margin-top:8px; font-weight:600;}
  .feedback.ok{color:var(--success);}
  .feedback.ko{color:var(--error);}
  textarea{
    width:100%; min-height:140px; font-family:var(--font-body); font-size:14px;
    padding:12px; border-radius:8px; border:1px solid #D8CDAE; background:var(--paper-soft);
    color:var(--text-paper); resize:vertical;
  }
  .checklist{margin-top:14px; padding-left:0; list-style:none;}
  .checklist li{display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; font-size:13px; color:var(--text-paper);}
  .checklist input{margin-top:3px;}
  .breadcrumb{font-family:var(--font-mono); font-size:11px; color:var(--text-ink-dim); margin-bottom:14px; letter-spacing:.5px;}
  .breadcrumb button{background:none;border:none;color:var(--gold-soft);cursor:pointer;font-family:var(--font-mono);font-size:11px;padding:0;}
  .timer-badge{
    display:inline-block; font-family:var(--font-mono); font-size:12px; background:var(--ink);
    color:var(--gold-soft); padding:4px 10px; border-radius:6px; margin-bottom:10px;
  }
  .lesson-actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .note{font-size:12px; color:var(--text-ink-dim); margin-top:26px; line-height:1.6; border-top:1px solid var(--ink-softer); padding-top:14px;}

  /* Homepage */
  .hero{padding:38px 0 30px; border-bottom:1px solid var(--ink-softer); margin-bottom:30px;}
  .hero h1{font-size:38px; max-width:640px;}
  .epreuves-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin:18px 0 36px;}
  .epreuve-card{
    background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:var(--radius);
    padding:18px; cursor:pointer; transition:border-color .12s ease;
  }
  .epreuve-card:hover{border-color:var(--gold);}
  .epreuve-tag{font-family:var(--font-mono); font-size:10px; letter-spacing:1.5px; color:var(--gold-soft); margin-bottom:8px;}
  .epreuve-card h3{font-family:var(--font-display); font-size:18px; margin:0 0 8px; color:var(--text-ink);}
  .epreuve-card p{font-size:12px; color:var(--text-ink-dim); line-height:1.5; margin:0;}
  .nclc-section{background:var(--ink-soft); border:1px solid var(--ink-softer); border-radius:var(--radius); padding:22px; margin-bottom:30px;}
  .nclc-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:16px 0;}
  .nclc-field label{display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-ink-dim); margin-bottom:6px;}
  .nclc-field input{width:100%;}
  .nclc-results{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:18px;}
  .nclc-result{background:var(--ink); border:1px solid var(--ink-softer); border-radius:8px; padding:14px; text-align:center;}
  .nclc-result .skill{font-family:var(--font-mono); font-size:10px; color:var(--text-ink-dim); letter-spacing:1px;}
  .nclc-result .val{font-family:var(--font-display); font-size:22px; color:var(--gold-soft); margin-top:4px;}
  .table-wrap{overflow-x:auto; margin-top:18px;}
  table.nclc-table{border-collapse:collapse; width:100%; font-size:12px;}
  table.nclc-table th, table.nclc-table td{border:1px solid var(--ink-softer); padding:6px 8px; text-align:center; color:var(--text-ink-dim);}
  table.nclc-table th{color:var(--text-ink); font-family:var(--font-mono); font-size:10px;}
</style>
</head>
<body>
<div id="app"></div>
<script src="storage-adapter.js"></script>

<script>
const STORAGE_PREFIX = "tcf-platform";

const DATA = {
  modules: [
    {
      id: "co", name: "Compréhension orale", type: "quiz",
      note: "Le message est lisible une seule fois, comme à l'examen.",
      lessons: [
        {
          id: "co1", title: "Annonce à la radio", level: "A1", subLevel: "Base",
          cours: "Les annonces à la radio donnent souvent une information pratique : quoi, quand, où, à quel prix. Concentre-toi sur les chiffres (heures, prix) et les conditions d'accès (gratuit, sur présentation de...).",
          transcript: "Chers auditeurs, ce weekend, le centre culturel de Yaoundé organise une soirée découverte des musiques d'Afrique centrale. L'entrée est gratuite pour les étudiants sur présentation de leur carte. Les portes ouvrent à 18h et la soirée se termine à 22h30. Un espace restauration sera disponible sur place.",
          questions: [
            {q:"Quel est le sujet de l'annonce ?", options:["Un concert payant","Une soirée musicale gratuite pour étudiants","Une conférence universitaire","Un festival de cinéma"], answer:1},
            {q:"À quelle heure la soirée se termine-t-elle ?", options:["18h","20h","22h30","Minuit"], answer:2},
            {q:"Que doit présenter un étudiant pour entrer gratuitement ?", options:["Une invitation","Sa carte d'étudiant","Un billet acheté en ligne","Rien du tout"], answer:1},
            {q:"Que peut-on faire sur place selon l'annonce ?", options:["Se garer gratuitement","Manger sur place","Réserver un hôtel","Acheter des livres"], answer:1}
          ]
        },
        {
          id: "co2", title: "Message téléphonique", level: "A2", subLevel: "Base",
          cours: "Un message téléphonique personnel contient une raison d'appeler, une information à retenir (date, heure, lieu) et une demande implicite ou explicite. Repère qui appelle et ce qu'on attend de toi en retour.",
          transcript: "Bonjour, c'est Amélie. Je vous appelle pour vous informer que la réunion de mardi est déplacée à mercredi 14h, dans la même salle. Pouvez-vous confirmer votre présence par message avant demain soir ? Merci et à bientôt.",
          questions: [
            {q:"Pourquoi Amélie appelle-t-elle ?", options:["Pour annuler une réunion","Pour déplacer une réunion","Pour changer de salle","Pour proposer un nouveau projet"], answer:1},
            {q:"Quel est le nouveau jour de la réunion ?", options:["Lundi","Mardi","Mercredi","Jeudi"], answer:2},
            {q:"Que demande-t-elle à la personne ?", options:["De venir plus tôt","De confirmer sa présence","D'annuler sa venue","D'appeler un collègue"], answer:1},
            {q:"Avant quand faut-il répondre ?", options:["Avant demain soir","Avant une semaine","Avant la réunion elle-même","Il n'y a pas de délai"], answer:0}
          ]
        },
        {
          id: "co3", title: "Consignes dans un aéroport", level: "B1", subLevel: "Base",

          transcript: "Attention à tous les passagers du vol AF 205 à destination de Paris. L'embarquement débutera dans quinze minutes, porte 12. Merci de vous munir de votre carte d'embarquement et d'une pièce d'identité valide. Les passagers ayant besoin d'assistance sont priés de se présenter immédiatement au comptoir d'embarquement.",

        {
          id: "co4", title: "Extrait d'interview", level: "B2", subLevel: "Base",
          cours: "Dans une interview, distingue bien la question du journaliste de la réponse de l'invité : la question introduit le thème, la réponse contient l'information ou l'opinion à retenir. Repère les formulations comme « je dirais que » qui annoncent l'idée principale.",
          transcript: "Journaliste : Selon vous, quelle est la clé pour réussir un examen de langue ? Invité : Je dirais la régularité. Il vaut mieux s'entraîner vingt minutes chaque jour plutôt que cinq heures une seule fois par semaine. Il faut aussi varier les compétences travaillées : écoute, lecture, écriture et expression orale, pour progresser de façon équilibrée.",
          questions: [

          ]
        },
        {
          id: "co5", title: "Chronique : l'IA et l'emploi", level: "C1", subLevel: "Base",
          cours: "Une chronique présente souvent plusieurs points de vue sur un sujet avant de conclure. Repère les marqueurs d'opposition (si certains... d'autres...) qui séparent les positions, et la phrase de synthèse finale qui résume le message clé.",
          transcript: "Bonsoir à tous. Ce soir, penchons-nous sur un sujet qui suscite autant d'espoirs que d'inquiétudes : l'essor de l'intelligence artificielle sur le marché du travail. Si certains y voient une formidable opportunité de gain de productivité, d'autres redoutent une vague de suppressions de postes, notamment dans les métiers administratifs. Les experts s'accordent néanmoins sur un point : la capacité d'adaptation et la formation continue seront déterminantes pour tirer parti de cette transformation plutôt que de la subir.",
          questions: [
            {q:"Quel est le sujet principal de la chronique ?", options:["Les inégalités salariales","L'impact de l'IA sur l'emploi","La formation des journalistes","Une nouvelle loi sur le travail"], answer:1},
            {q:"Quelles sont les deux réactions opposées évoquées ?", options:["Indifférence et enthousiasme","Espoir de productivité et crainte de suppressions de postes","Colère et résignation","Curiosité et rejet total"], answer:1},
            {q:"Quels métiers sont cités comme particulièrement exposés ?", options:["Les métiers manuels","Les métiers administratifs","Les métiers artistiques","Les métiers médicaux"], answer:1},
            {q:"Sur quel point les experts s'accordent-ils selon le texte ?", options:["Il faut interdire l'IA","L'adaptation et la formation continue seront déterminantes","Les emplois sont tous menacés de la même façon","Rien ne va changer"], answer:1}
          ]

        {
          id: "co6", title: "Réflexion sur le progrès technique", level: "C2", subLevel: "Base",
          cours: "Un texte réflexif ne délivre pas toujours son message de façon explicite : le ton et des formulations comme « il serait plus juste de dire » signalent une critique implicite. Concentre-toi sur ce que l'auteur suggère plutôt que sur ce qu'il dit littéralement.",
          transcript: "Il est frappant de constater que plus une société se targue d'être rationnelle, plus elle semble multiplier les objets de croyance déguisés en innovations. On nous vante chaque nouvel outil comme une libération, sans toujours s'interroger sur les dépendances qu'il engendre en retour. Loin de rejeter le progrès, il s'agirait plutôt d'apprendre à l'interroger : non pas se demander ce qu'une technologie permet de faire, mais ce qu'elle nous empêche, discrètement, de continuer à faire.",
          questions: [
            {q:"Quelle attitude l'auteur critique-t-il implicitement ?", options:["Le refus systématique de toute technologie","L'adoption non questionnée du progrès technique","Le manque d'innovation des entreprises","La lenteur de la recherche scientifique"], answer:1},
            {q:"Que suggère l'expression « objets de croyance déguisés en innovations » ?", options:["Que les innovations sont toujours fiables","Qu'on adhère parfois à la technologie de façon quasi irrationnelle","Que la science remplace la religion officiellement","Que les innovations sont interdites par la loi"], answer:1},
            {q:"Quelle question l'auteur propose-t-il de se poser à la place de la question habituelle ?", options:["Combien coûte cette technologie ?","Qui a inventé cette technologie ?","Qu'est-ce que cette technologie nous empêche de continuer à faire ?","Cette technologie est-elle légale ?"], answer:2},
            {q:"Quel est le ton général du texte ?", options:["Enthousiaste et promotionnel","Analytique et légèrement critique","Neutre et purement descriptif","Alarmiste et catastrophiste"], answer:1}
          ]
        },

          cours: "Un message d'accueil simple donne en général une identité (qui parle), un horaire, et des consignes pratiques (quoi apporter, où aller). Ces informations basiques reviennent dans presque toutes les situations de la vie quotidienne.",
          transcript: "Bonjour et bienvenue ! Je m'appelle Sophie, je suis votre professeure aujourd'hui. La classe commence à neuf heures et se termine à midi. Il y a une pause à dix heures trente. N'oubliez pas votre cahier et un stylo.",

            {q:"À quelle heure est la pause ?", options:["Neuf heures","Dix heures trente","Onze heures","Midi"], answer:1},
            {q:"Que doit apporter l'élève ?", options:["Un ordinateur","Un cahier et un stylo","De la nourriture","Rien de particulier"], answer:1}

        {

        {
          id: "co9", title: "Bulletin météo", level: "B1", subLevel: "Intermédiaire",
          cours: "Un bulletin météo suit une structure prévisible : jour par jour, avec température et phénomène (soleil, pluie, vent). Les conseils pratiques (prévoir un parapluie) apparaissent souvent à la fin et résument l'information utile.",

        {
          id: "co10", title: "Chronique culturelle", level: "B2", subLevel: "Intermédiaire",
          cours: "Une chronique culturelle présente une nouveauté puis explique ce qui la distingue des propositions habituelles. Repère le contraste entre « avant/habituellement » et « maintenant/cette fois » pour identifier ce qui est nouveau.",
          transcript: "Cette semaine, le musée d'art moderne inaugure une exposition consacrée aux artistes émergents de la région. Contrairement aux expositions classiques, celle-ci mise sur l'interaction : les visiteurs sont invités à toucher certaines œuvres et à participer à un atelier de création collective. L'objectif affiché est de rendre l'art contemporain plus accessible à un public qui s'en sent parfois exclu.",
          questions: [

            {q:"Qu'est-ce qui distingue cette exposition des expositions classiques ?", options:["L'interdiction de toucher les œuvres","L'interaction et la participation du public","Le prix très élevé du billet","La durée très courte de l'exposition"], answer:1},

            {q:"Quel est l'objectif affiché de cette démarche ?", options:["Réduire la fréquentation du musée","Rendre l'art contemporain plus accessible","Concurrencer les autres musées","Vendre plus de souvenirs"], answer:1}
          ]

        {
          id: "co11", title: "Débat radiophonique", level: "C1", subLevel: "Intermédiaire",
          cours: "Dans un débat à plusieurs voix, chaque intervenant défend une position, parfois en nuançant celle du précédent (« je nuancerais ce constat »). Identifie clairement qui dit quoi, et repère les expressions de nuance plutôt que d'opposition frontale.",
          transcript: "Animatrice : Faut-il réguler davantage les réseaux sociaux pour protéger les plus jeunes ? Invité 1 : Je pense qu'une régulation stricte est indispensable, tant les effets sur la santé mentale des adolescents sont documentés. Invité 2 : Je nuancerais ce constat : le problème n'est pas l'outil en soi, mais l'absence d'accompagnement parental et éducatif autour de son usage. Une régulation excessive risquerait, selon moi, de déresponsabiliser les familles.",
          questions: [
            {q:"Quel est le sujet du débat ?", options:["Le prix des smartphones","La régulation des réseaux sociaux pour les jeunes","La vitesse d'internet","La création d'un nouveau réseau social"], answer:1},
            {q:"Quelle est la position du premier invité ?", options:["Il est contre toute régulation","Il juge une régulation stricte indispensable","Il ne se prononce pas","Il pense que le sujet n'est pas important"], answer:1},
            {q:"Sur quoi porte la nuance apportée par le second invité ?", options:["Sur le rôle de l'accompagnement parental et éducatif","Sur le coût des réseaux sociaux","Sur la vitesse de connexion","Sur l'âge légal pour voter"], answer:0},
            {q:"Que redoute le second invité en cas de régulation excessive ?", options:["Une hausse des prix","Une déresponsabilisation des familles","Une fermeture des réseaux sociaux","Un manque de couverture internet"], answer:1}
          ]
        },
        {
          id: "co12", title: "Monologue sur la mémoire collective", level: "C2", subLevel: "Intermédiaire",
          cours: "Un monologue réflexif de haut niveau construit son argumentation par contraste (l'idée reçue vs la réalité proposée par l'auteur). La chute finale contient souvent le message clé, formulé de façon dense.",
          transcript: "On célèbre volontiers les anniversaires historiques, comme si le simple fait de commémorer suffisait à honorer la mémoire. Mais commémorer n'est pas comprendre. Trop souvent, ces cérémonies figent l'événement dans une image consensuelle, gommant les tensions et les zones d'ombre qui pourtant permettraient d'en tirer de véritables leçons. Se souvenir, au fond, exigerait moins de solennité et davantage d'inconfort.",
          questions: [
            {q:"Quelle critique implicite l'auteur adresse-t-il aux commémorations ?", options:["Elles coûtent trop cher","Elles figent l'événement dans une image consensuelle sans le questionner","Elles n'ont jamais lieu","Elles sont trop rares"], answer:1},
            {q:"Que perd-on, selon l'auteur, dans une commémoration trop solennelle ?", options:["Le respect des morts","Les tensions et zones d'ombre porteuses de vraies leçons","Le financement public","La participation du public"], answer:1},
            {q:"Que suggère la dernière phrase du texte ?", options:["Qu'il faut plus de fêtes officielles","Que se souvenir véritablement demande d'accepter l'inconfort plutôt que la solennité","Qu'il ne faut plus jamais commémorer","Que la mémoire collective n'existe pas"], answer:1},
            {q:"Quel est le ton du texte ?", options:["Neutre et purement informatif","Critique et réflexif","Joyeux et festif","Indifférent au sujet"], answer:1}
          ]
        },
        {
          id: "co13", title: "Message dans un centre d'accueil pour nouveaux arrivants", level: "A1", subLevel: "Avancé",
          cours: "Dans un contexte administratif (centre d'accueil, service public), les informations clés à repérer restent les mêmes : horaires, documents à apporter, et démarche à suivre. Ce type de message se rapproche de situations réelles que tu rencontreras en arrivant au Canada.",

          questions: [

        {

        {

          transcript: "Animateur : Certains estiment que les procédures d'immigration économique devraient être simplifiées pour attirer davantage de talents. Invitée : C'est un débat complexe. Simplifier les procédures peut effectivement accélérer l'arrivée de compétences recherchées, mais il faut aussi garantir que les infrastructures d'accueil, notamment le logement et les services publics, suivent le rythme. Sans cet équilibre, l'accueil risque d'être davantage administratif qu'humain.",

        {
          id: "co18", title: "Réflexion sur la notion de « chez-soi »", level: "C2", subLevel: "Avancé",
          cours: "Un texte réflexif de niveau C2 remet souvent en question une notion que l'on croit évidente (ici, le « chez-soi »), avant de proposer une définition alternative plus nuancée. Repère cette structure de remise en question suivie de reformulation.",
          transcript: "On tient pour acquis que le « chez-soi » se définit par un lieu fixe, hérité ou choisi une fois pour toutes. Pour qui a connu plusieurs déracinements, cette définition s'effrite : le chez-soi devient moins un territoire qu'un ensemble de gestes, de langues et de relations que l'on recompose à chaque déplacement. Peut-être faudrait-il alors cesser de chercher où l'on est chez soi, et se demander plutôt avec qui, et comment, on le devient.",
          questions: [

            {q:"Quelle nouvelle définition l'auteur propose-t-il ?", options:["Un ensemble de gestes, langues et relations recomposés","Un simple numéro d'adresse","Une notion figée dans le temps","Un concept purement administratif"], answer:0},

          transcript: "Bonjour, ici la clinique médicale du centre-ville. Votre rendez-vous du 15 avril à quatorze heures est confirmé avec le docteur Martin. Merci d'arriver quinze minutes en avance avec votre carte d'assurance maladie. En cas d'empêchement, appelez-nous au moins 24 heures avant.",

// Tableau d'équivalence NCLC officiel (référence standard TCF Canada)
const NCLC_TABLE = [
  {nclc:"10+", ce:[549,699], ee:[16,20], co:[549,699], eo:[16,20]},
  {nclc:"9",   ce:[524,548], ee:[14,15], co:[523,548], eo:[14,15]},
  {nclc:"8",   ce:[499,523], ee:[12,13], co:[503,522], eo:[12,13]},
  {nclc:"7",   ce:[453,498], ee:[10,11], co:[458,502], eo:[10,11]},
  {nclc:"6",   ce:[406,452], ee:[7,9],   co:[398,457], eo:[7,9]},
  {nclc:"5",   ce:[375,405], ee:[6,6],   co:[369,397], eo:[6,6]},
  {nclc:"4",   ce:[342,374], ee:[4,5],   co:[331,368], eo:[4,5]}
];
function getNCLC(skill, score){
  if(score === null || isNaN(score)) return "—";
  for(const tier of NCLC_TABLE){
    const [min,max] = tier[skill];
    if(score >= min && score <= max) return tier.nclc;
  }
  const lowestMin = NCLC_TABLE[NCLC_TABLE.length-1][skill][0];
  if(score < lowestMin) return "< 4";
  return "10+";
}

/* ---------- Accès payant ---------- */

function getAccess(){
  if(!state.progress) return {plan:"free", expiresAt:null, simEEAttemptsUsed:0};
  if(!state.progress.access) state.progress.access = {plan:"free", expiresAt:null, simEEAttemptsUsed:0};
  return state.progress.access;
}
function isPremiumActive(){
  const acc = getAccess();
  return acc.plan !== "free" && acc.expiresAt && acc.expiresAt > Date.now();
}
function isLevelLocked(level){
  if(isPremiumActive()) return false;
  return !FREE_LEVELS.includes(level);
}
function daysRemaining(){
  const acc = getAccess();
  if(!acc.expiresAt) return 0;
  return Math.max(0, Math.ceil((acc.expiresAt - Date.now()) / (1000*60*60*24)));
}
function simEEAttemptsLeft(){
  if(isPremiumActive()) return Infinity;
  const acc = getAccess();
  return Math.max(0, FREE_SIM_EE_ATTEMPTS - (acc.simEEAttemptsUsed || 0));
}
async function activatePlan(planId){
  const plan = ACCESS_PLANS.find(p=>p.id === planId);
  if(!plan) return false;
  const acc = getAccess();
  acc.plan = plan.id;
  acc.expiresAt = Date.now() + plan.days * 24 * 60 * 60 * 1000;
  await saveProgress(state.student, state.progress);
  return true;
}

/* ---------- Codes d'activation (espace formateur) ----------
   Stockés en shared:true : visibles/accessibles par tous les utilisateurs de cet artifact.
   L'index complet est gardé dans une seule clé pour limiter le nombre d'appels de stockage. */
const CODES_INDEX_KEY = "codes-index";

async function loadCodesIndex(){
  try{
    const res = await window.storage.get(CODES_INDEX_KEY, true);
    return res ? JSON.parse(res.value) : [];
  }catch(e){
    return [];
  }
}
async function saveCodesIndex(list){
  try{
    await window.storage.set(CODES_INDEX_KEY, JSON.stringify(list), true);
  }catch(e){ console.error("Erreur de sauvegarde des codes", e); }
}
function randomDigits(n){
  let s = "";
  for(let i=0;i<n;i++) s += Math.floor(Math.random()*10);
  return s;
}
async function generateCode(planId){
  const list = await loadCodesIndex();
  let code;
  do {
    code = `TFG-${planId.toUpperCase()}-${randomDigits(6)}`;
  } while(list.some(c=>c.code === code));
  list.unshift({ code, plan: planId, createdAt: Date.now(), used: false, usedBy: null, usedAt: null });
  await saveCodesIndex(list);
  return code;
}
async function redeemCode(rawCode){
  const code = rawCode.trim().toUpperCase();
  const list = await loadCodesIndex();
  const entry = list.find(c=>c.code === code);
  if(!entry) return {ok:false, reason:"introuvable"};
  if(entry.used) return {ok:false, reason:"déjà utilisé"};
  entry.used = true;
  entry.usedBy = state.student;
  entry.usedAt = Date.now();
  await saveCodesIndex(list);
  await activatePlan(entry.plan);
  return {ok:true, plan: entry.plan};
}

async function generateAILesson(moduleId, level){
  const schema = AI_LESSON_SCHEMAS[moduleId];
  if(!schema) return null;
  const systemPrompt = `Tu es un créateur de contenu pédagogique pour la préparation au TCF Canada. Génère un nouvel exercice original de ${schema.label}, de niveau CECR ${level}, dans le même esprit que les exercices officiels du TCF. Réponds UNIQUEMENT avec un objet JSON valide, sans texte avant ni après, sans balises markdown, au format exact : ${schema.schemaHint}. Chaque question a exactement 4 options, "answer" est l'index (0 à 3) de la bonne réponse. Le contenu doit être original, adapté au niveau ${level}, et cohérent (les questions doivent porter sur le texte/message fourni).`;
  try{
    const response = await fetch("/api/anthropic", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: "user", content: `Génère un exercice de niveau ${level}.` }]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b=>b.type === "text").map(b=>b.text).join("\n");
    const cleaned = textBlocks.replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(cleaned);
    parsed.id = `ai-${moduleId}-${Date.now()}`;
    parsed.level = level;
    parsed.aiGenerated = true;
    return parsed;
  }catch(err){
    console.error("Erreur de génération IA", err);
    return null;
  }
}

    if(m.type !== "quiz") return;
    m.lessons.forEach(l=>{
      const s = state.progress[m.id] && state.progress[m.id].scores && state.progress[m.id].scores[l.id];
      if(typeof s === "number") scores.push(s);
    });
  });
  if(scores.length === 0) return null;
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}

function moduleCompletion(mod){
  const total = mod.lessons.length;
  let done = 0;
  mod.lessons.forEach(l=>{
    const rec = state.progress[mod.id];
    if(mod.type === "quiz"){
      if(rec && rec.scores && typeof rec.scores[l.id] === "number") done++;
    } else {
      if(rec && rec.done && rec.done[l.id]) done++;
    }
  });
  return {done, total};
}

const EXAM_QUIZ_MODULE_IDS = ["co", "ce", "structures"];
const EXAM_SECONDS_PER_QUESTION = 45;

function stopExamTimer(){
  if(state.examTimerHandle){
    clearInterval(state.examTimerHandle);
    state.examTimerHandle = null;
  }
}

function buildExam(level){
  const questions = [];
  EXAM_QUIZ_MODULE_IDS.forEach(modId=>{
    const mod = DATA.modules.find(m=>m.id === modId);
    mod.lessons.filter(l=>l.level === level).forEach(lesson=>{
      lesson.questions.forEach(q=>{
        questions.push({
          moduleId: mod.id,
          moduleName: mod.name,
          lessonTitle: lesson.title,
          q: q.q, options: q.options, answer: q.answer
        });
      });
    });
  });
  return questions;
}

// Format officiel TCF : 39 questions en CO (35 min) et 39 questions en CE (60 min),
// difficulté progressive de A1 à C2. Répartition sur les 6 niveaux (somme = 39).
const FULL_EXAM_LEVEL_COUNTS = { A1: 7, A2: 7, B1: 7, B2: 6, C1: 6, C2: 6 };
const FULL_EXAM_CONFIG = {
  co: { minutes: 35, label: "Compréhension orale", totalQuestions: 39 },
  ce: { minutes: 60, label: "Compréhension écrite", totalQuestions: 39 }
};

function buildFullExam(moduleId){
  const mod = DATA.modules.find(m=>m.id === moduleId);
  const questions = [];
  LEVELS.forEach(level=>{
    const target = FULL_EXAM_LEVEL_COUNTS[level];
    let count = 0;
    mod.lessons.filter(l=>l.level === level).forEach(lesson=>{
      lesson.questions.forEach(q=>{
        if(count >= target) return;
        questions.push({
          moduleId: mod.id,
          moduleName: mod.name,
          lessonTitle: lesson.title,
          level,
          q: q.q, options: q.options, answer: q.answer
        });
        count++;
      });
    });
  });
  return questions;
}

function startFullExam(){
  // L'examen complet couvre A1 à C2 : nécessite une formule payante active,
  // sinon un utilisateur gratuit accéderait aux niveaux B1-C2 par ce biais.
  if(!isPremiumActive()){
    state.view = "pricing";
    render();
    return;
  }
  state.fullExamPhase = "co";
  state.fullExamCoResult = null;
  state.fullExamCeResult = null;
  const coQuestions = buildFullExam("co");
  state.examQuestions = coQuestions;
  state.examAnswers = new Array(coQuestions.length).fill(null);
  state.examIndex = 0;
  state.examDeadline = Date.now() + FULL_EXAM_CONFIG.co.minutes * 60 * 1000;
  state.view = "examRunning";
  render();
}

function renderExamLevelSelect(){
  const cards = LEVELS.map(lv=>{

    const locked = isLevelLocked(lv);

      <div class="lvl">${locked ? "🔒 " : ""}${lv}</div>
      <div class="lvl-desc">${locked ? "Formule payante" : count + " questions"}</div>
    </div>`;
  }).join("");
  return `
  ${topBar()}
  <div class="breadcrumb"><button id="backHomeFromExam">← Accueil</button> / Examen blanc</div>

  <p class="note" style="border-top:none; padding-top:0;">Les niveaux A1 et A2 sont gratuits. B1 à C2 nécessitent une formule payante.</p>

}
function attachExamLevelSelect(){
  document.getElementById("backHomeFromExam").addEventListener("click", ()=>{ state.view = "home"; render(); });
  document.querySelectorAll(".exam-level-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      if(card.dataset.locked){
        state.view = "pricing";
        render();
        return;
      }
      const level = card.dataset.level;
      const questions = buildExam(level);
      if(questions.length === 0) return;
      state.examLevel = level;
      state.examQuestions = questions;
      state.examAnswers = new Array(questions.length).fill(null);
      state.examIndex = 0;
      state.examDeadline = Date.now() + questions.length * EXAM_SECONDS_PER_QUESTION * 1000;
      state.examResult = null;
      state.view = "examRunning";
      render();
    });
  });
}

function formatMMSS(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const mm = Math.floor(s/60).toString().padStart(2,"0");
  const ss = (s%60).toString().padStart(2,"0");
  return `${mm}:${ss}`;
}

function renderExamRunning(){
  const questions = state.examQuestions;
  const i = state.examIndex;
  const q = questions[i];
  const remaining = Math.max(0, Math.round((state.examDeadline - Date.now())/1000));
  const headerLabel = state.fullExamPhase
    ? `Examen blanc complet — ${FULL_EXAM_CONFIG[state.fullExamPhase].label} (format officiel)`
    : `Examen blanc — Niveau ${state.examLevel}`;
  return `
  ${topBar()}
  <div class="exam-topbar">
    <div>
      <div class="exam-progress-text">${headerLabel}</div>
      <div class="exam-progress-text">Question ${i+1} / ${questions.length}</div>
    </div>
    <div class="exam-timer" id="examTimer">${formatMMSS(remaining)}</div>
  </div>
  <div class="card" style="max-width:640px;">
    <div class="exam-module-tag">${q.moduleName}${q.level ? " — Niveau " + q.level : ""} — ${q.lessonTitle}</div>
    <p class="qtext">${q.q}</p>
    <div id="examOptions">
      ${q.options.map((o,oi)=>`<button class="option-row" data-o="${oi}">${o}</button>`).join("")}
    </div>
  </div>
  <div class="lesson-actions">
    <button class="btn btn-ghost" id="examPrev" ${i===0 ? "disabled" : ""}>← Précédent</button>
    <button class="btn btn-gold" id="examNext">${i === questions.length-1 ? "Terminer" : "Suivant →"}</button>
  </div>
  `;
}

function attachExamRunning(){
  const questions = state.examQuestions;

  function refreshOptionsUI(){
    const i = state.examIndex;
    const chosen = state.examAnswers[i];
    document.querySelectorAll("#examOptions .option-row").forEach(btn=>{
      const oi = parseInt(btn.dataset.o);
      btn.classList.toggle("current-selected", chosen === oi);
      btn.style.borderColor = chosen === oi ? "var(--gold)" : "";
      btn.style.background = chosen === oi ? "var(--gold-soft)" : "";
    });
  }
  refreshOptionsUI();

  document.querySelectorAll("#examOptions .option-row").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.examAnswers[state.examIndex] = parseInt(btn.dataset.o);
      refreshOptionsUI();
    });
  });

  document.getElementById("examPrev").addEventListener("click", ()=>{
    if(state.examIndex > 0){ state.examIndex--; render(); }
  });
  document.getElementById("examNext").addEventListener("click", ()=>{
    if(state.examIndex < questions.length - 1){
      state.examIndex++;
      render();
    } else {
      finishExam();
    }
  });

  stopExamTimer();
  state.examTimerHandle = setInterval(()=>{
    const remaining = Math.round((state.examDeadline - Date.now())/1000);
    const timerEl = document.getElementById("examTimer");
    if(timerEl){
      timerEl.textContent = formatMMSS(remaining);
      timerEl.classList.toggle("low", remaining <= 60);
    }
    if(remaining <= 0){
      finishExam();
    }
  }, 1000);
}

function finishExam(){
  stopExamTimer();
  const questions = state.examQuestions;
  const answers = state.examAnswers;

  if(state.fullExamPhase){
    let correct = 0;
    questions.forEach((q,i)=>{ if(answers[i] === q.answer) correct++; });
    const total = questions.length;
    const score = total ? Math.round((correct/total)*100) : 0;
    const byLevel = {};
    LEVELS.forEach(lv=> byLevel[lv] = {correct:0, total:0});
    questions.forEach((q,i)=>{
      byLevel[q.level].total++;
      if(answers[i] === q.answer) byLevel[q.level].correct++;
    });
    const phaseResult = { correct, total, score, byLevel };

    if(state.fullExamPhase === "co"){
      state.fullExamCoResult = phaseResult;
      // Passage automatique à la phase Compréhension écrite
      state.fullExamPhase = "ce";
      const ceQuestions = buildFullExam("ce");
      state.examQuestions = ceQuestions;
      state.examAnswers = new Array(ceQuestions.length).fill(null);
      state.examIndex = 0;
      state.examDeadline = Date.now() + FULL_EXAM_CONFIG.ce.minutes * 60 * 1000;
      state.view = "examRunning";
      render();
      return;
    } else {
      state.fullExamCeResult = phaseResult;
      state.fullExamPhase = null;
      state.view = "examFullResult";
      render();
      return;
    }
  }

  const byModule = {};
  EXAM_QUIZ_MODULE_IDS.forEach(id=> byModule[id] = {correct:0, total:0});
  questions.forEach((q,i)=>{
    byModule[q.moduleId].total++;
    if(answers[i] === q.answer) byModule[q.moduleId].correct++;
  });
  const totalCorrect = Object.values(byModule).reduce((a,b)=>a+b.correct,0);
  const totalQuestions = questions.length;
  const globalScore = totalQuestions ? Math.round((totalCorrect/totalQuestions)*100) : 0;
  state.examResult = {
    byModule,
    globalScore,
    totalCorrect,
    totalQuestions
  };
  state.view = "examResult";
  render();
}

function currentModule(){ return DATA.modules.find(m=>m.id === state.moduleId); }
function currentLesson(){
  const mod = currentModule();
  const fixed = mod.lessons.find(l=>l.id === state.lessonId);
  if(fixed) return fixed;
  const aiList = state.aiGeneratedLessons[mod.id] || [];
  return aiList.find(l=>l.id === state.lessonId);
}

function renderModuleLessons(){
  const mod = currentModule();
  const aiLessons = state.aiGeneratedLessons[mod.id] || [];
  const allLessons = [...mod.lessons, ...aiLessons];
  const levelsPresent = LEVELS.filter(lv => allLessons.some(l => l.level === lv));
  const filterBtns = levelsPresent.map(lv=>{
    const active = state.levelFilter === lv ? "active" : "";
    return `<button class="${active}" data-level="${lv}">${lv}</button>`;
  }).join("");
  const filterBar = levelsPresent.length ? `
    <div class="level-filter">
      <button class="${state.levelFilter === null ? "active" : ""}" data-level="">Tous les niveaux</button>
      ${filterBtns}
    </div>` : "";

  const visibleLessons = state.levelFilter
    ? allLessons.filter(l => l.level === state.levelFilter)
    : allLessons;

  const rows = visibleLessons.map(l=>{
    const rec = state.progress[mod.id];
    let status = "À faire";
    if(mod.type === "quiz" && rec && rec.scores && typeof rec.scores[l.id] === "number"){
      status = `Score : ${rec.scores[l.id]}%`;
    } else if(mod.type === "expression" && rec && rec.done && rec.done[l.id]){
      status = "Complété";
    }
    const locked = isLevelLocked(l.level);
    if(locked) status = "🔒 Formule payante";
    return `<div class="lesson-row ${locked ? "lock-row" : ""}" data-lesson="${l.id}" ${locked ? 'data-locked="1"' : ""}>
      <span class="lesson-left">${l.level ? `<span class="level-badge">${l.level}${l.subLevel ? " · " + l.subLevel : ""}</span>` : ""}<span>${locked ? '<span class="lock-icon">🔒</span>' : ""}${l.aiGenerated ? "✨ " : ""}${l.title}</span></span>
      <span class="status">${status}</span>
    </div>`;
  }).join("");
  const methodBlock = MODULE_METHODS[mod.id] ? `
  <div class="method-card">
    <div class="m-tag">Méthode</div>
    <h3>${MODULE_METHODS[mod.id].title}</h3>
    <p>${MODULE_METHODS[mod.id].text}</p>
  </div>` : "";

  const aiGenBlock = AI_LESSON_SCHEMAS[mod.id] ? `
  <div class="method-card" style="border-color:var(--gold);">
    <div class="m-tag">Exercice IA</div>
    <h3>Générer un nouvel exercice</h3>
    <p style="margin-bottom:12px;">Crée un exercice original et inédit au niveau de ton choix, en plus des leçons existantes. Non sauvegardé après la session.</p>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <select id="aiGenLevel" style="padding:8px 10px; border-radius:6px; background:var(--ink); color:var(--text-ink); border:1px solid var(--ink-softer); font-family:var(--font-mono); font-size:12px;">
        ${LEVELS.map(lv=>`<option value="${lv}" ${state.levelFilter===lv ? "selected":""}>${lv}</option>`).join("")}
      </select>
      <button class="btn btn-gold" id="aiGenBtn" ${state.aiGenerating ? "disabled" : ""}>${state.aiGenerating ? "Génération en cours..." : "✨ Générer un exercice"}</button>
    </div>
    <p id="aiGenMsg" style="font-size:13px; margin-top:8px; color:var(--text-ink-dim);"></p>
  </div>` : "";

  return `
  ${topBar()}
  <div class="breadcrumb"><button id="backDash">← Tes axes de préparation</button> / ${mod.name}</div>
  <h1>${mod.name}</h1>
  <p class="lead">${mod.note}</p>
  ${methodBlock}
  ${mod.id === "expression_ecrite" ? `
  <div class="exam-hero" style="margin-bottom:24px;">
    <p class="eyebrow" style="margin-bottom:8px;">Conditions réelles</p>
    <h2>Simulateur d'expression écrite</h2>
    <p class="lead" style="margin-bottom:0;">Entraîne-toi sur les 3 tâches officielles de l'épreuve (60 minutes au total), avec compteur de mots, caractères spéciaux, et une correction automatique détaillée à la fin.</p>
    <p class="note" style="border-top:none; padding-top:0; margin-top:10px;">${isPremiumActive() ? "Corrections IA illimitées avec ta formule active." : `Corrections IA gratuites restantes : ${simEEAttemptsLeft()}`}</p>
    <button class="btn btn-ghost" id="goSimEE" style="margin-top:6px; color:var(--text-ink); border-color:var(--gold-soft);">Lancer le simulateur</button>
  </div>` : ""}
  ${aiGenBlock}
  ${filterBar}
  <div class="lesson-list">${rows}</div>
  `;
}
function attachModuleLessons(){
  document.getElementById("backDash").addEventListener("click", ()=>{ state.view = "dashboard"; state.levelFilter = null; render(); });
  const goSim = document.getElementById("goSimEE");
  if(goSim){
    goSim.addEventListener("click", ()=>{
      state.simEETaskIndex = 0;
      state.simEETexts = ["", "", ""];
      state.simEEDeadline = Date.now() + EE_SIM_TOTAL_MINUTES * 60 * 1000;
      state.simEEResult = null;
      state.simEEError = null;
      state.simEECorrecting = false;
      state.view = "simulateurEE";
      render();
    });
  }
  document.querySelectorAll(".level-filter button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.levelFilter = btn.dataset.level || null;
      render();
    });
  });
  const aiGenBtn = document.getElementById("aiGenBtn");
  if(aiGenBtn){
    aiGenBtn.addEventListener("click", async ()=>{
      const mod = currentModule();
      const level = document.getElementById("aiGenLevel").value;
      if(isLevelLocked(level)){
        state.view = "pricing";
        render();
        return;
      }
      state.aiGenerating = true;
      aiGenBtn.disabled = true;
      aiGenBtn.textContent = "Génération en cours...";
      document.getElementById("aiGenMsg").textContent = "";
      const lesson = await generateAILesson(mod.id, level);
      state.aiGenerating = false;
      if(!lesson){
        document.getElementById("aiGenMsg").textContent = "La génération a échoué. Réessaie dans quelques instants.";
        document.getElementById("aiGenMsg").style.color = "var(--error-soft)";
        aiGenBtn.disabled = false;
        aiGenBtn.textContent = "✨ Générer un exercice";
        return;
      }
      if(!state.aiGeneratedLessons[mod.id]) state.aiGeneratedLessons[mod.id] = [];
      state.aiGeneratedLessons[mod.id].unshift(lesson);
      state.levelFilter = level;
      render();
    });
  }
  document.querySelectorAll(".lesson-row").forEach(row=>{
    row.addEventListener("click", ()=>{
      if(row.dataset.locked){
        state.view = "pricing";
        render();
        return;
      }
      state.lessonId = row.dataset.lesson;
      const mod = currentModule();
      state.view = mod.type === "quiz" ? "lessonQuiz" : "lessonExpression";
      render();
    });
  });
}

  <div id="questionsWrap" style="${isAudio ? "display:none;" : ""}"></div>
  <div class="lesson-actions">
    <button class="btn btn-ghost" id="finishQuiz" style="display:none;">Valider et voir mon score</button>
  </div>
  <div id="scoreResult"></div>
  `;
}

function attachLessonQuiz(){
  document.getElementById("backModule").addEventListener("click", ()=>{
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    state.view = "moduleLessons";
    render();
  });
  const lesson = currentLesson();
  const isAudio = !!lesson.transcript;
  const answers = new Array(lesson.questions.length).fill(null);

  function showQuestions(){
    const wrap = document.getElementById("questionsWrap");
    const passageCard = document.getElementById("passageCard");
    if(passageCard && isAudio) passageCard.style.display = "none";
    wrap.style.display = "block";
    wrap.innerHTML = lesson.questions.map((q, qi)=>{
      const opts = q.options.map((o,oi)=>`<button class="option-row" data-q="${qi}" data-o="${oi}">${o}</button>`).join("");
      return `<div class="card" style="margin-bottom:14px; max-width:640px;">
        <p class="qtext">${qi+1}. ${q.q}</p>
        ${opts}
        <div class="feedback" id="fb-${qi}"></div>
      </div>`;
    }).join("");
    wrap.querySelectorAll(".option-row").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qi = parseInt(btn.dataset.q);
        if(answers[qi] !== null) return;
        const oi = parseInt(btn.dataset.o);
        answers[qi] = oi;
        const group = wrap.querySelectorAll(`.option-row[data-q="${qi}"]`);
        group.forEach(b=>{
          b.setAttribute("disabled","true");
          if(parseInt(b.dataset.o) === lesson.questions[qi].answer) b.classList.add("correct");
          else if(parseInt(b.dataset.o) === oi) b.classList.add("wrong");
        });
        const fb = document.getElementById(`fb-${qi}`);
        const correct = oi === lesson.questions[qi].answer;
        fb.textContent = correct ? "Bonne réponse." : "Ce n'est pas la bonne réponse.";
        fb.className = "feedback " + (correct ? "ok" : "ko");
        if(answers.every(a=>a !== null)){
          document.getElementById("finishQuiz").style.display = "inline-block";
        }
      });
    });
  }

  const playBtn = document.getElementById("playAudio");
  if(playBtn){
    playBtn.addEventListener("click", ()=>{
      if(!window.speechSynthesis) return;
      playBtn.disabled = true;
      playBtn.textContent = "🔊 Lecture en cours...";
      const badge = document.getElementById("listenBadge");
      if(badge) badge.textContent = "🔊 Lecture en cours — écoute bien, une seule diffusion";
      const status = document.getElementById("listenStatus");
      if(status) status.textContent = "";
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(lesson.transcript);
      utterance.lang = "fr-FR";
      utterance.rate = 0.95;
      utterance.onend = ()=>{
        playBtn.textContent = "✅ Message déjà écouté";
        if(badge) badge.textContent = "✅ Message écouté — il ne peut pas être réécouté, comme à l'examen";
        if(status) status.textContent = "Tu peux maintenant passer aux questions.";
        const hideBtn = document.getElementById("hidePassage");
        if(hideBtn) hideBtn.style.display = "inline-block";
      };
      utterance.onerror = ()=>{
        playBtn.textContent = "⚠️ Erreur de lecture";
        if(status) status.textContent = "La lecture audio a échoué. Tu peux quand même continuer vers les questions.";
        const hideBtn = document.getElementById("hidePassage");
        if(hideBtn) hideBtn.style.display = "inline-block";
      };
      window.speechSynthesis.speak(utterance);
    });
  }

  const hideBtn = document.getElementById("hidePassage");
  if(hideBtn){ hideBtn.addEventListener("click", showQuestions); }
  else if(!isAudio){ showQuestions(); }

  document.getElementById("finishQuiz").addEventListener("click", async ()=>{
    const correctCount = answers.filter((a,i)=>a === lesson.questions[i].answer).length;
    const score = Math.round((correctCount/lesson.questions.length)*100);
    const mod = currentModule();
    if(!state.progress[mod.id]) state.progress[mod.id] = {scores:{}};
    if(!state.progress[mod.id].scores) state.progress[mod.id].scores = {};
    state.progress[mod.id].scores[lesson.id] = score;
    await saveProgress(state.student, state.progress);
    document.getElementById("finishQuiz").style.display = "none";
    document.getElementById("scoreResult").innerHTML = `
      <div class="card" style="max-width:640px; margin-top:6px;">
        <h2>Résultat : ${score}%</h2>
        <p>${correctCount} bonne(s) réponse(s) sur ${lesson.questions.length}.</p>
        <button class="btn btn-gold" id="backToModuleAfter">Retour aux leçons</button>
      </div>`;
    document.getElementById("backToModuleAfter").addEventListener("click", ()=>{ state.view = "moduleLessons"; render(); });
  });
}

function renderLessonExpression(){
  const mod = currentModule();
  const lesson = currentLesson();
  const items = lesson.checklist.map((c,i)=>`
    <li><input type="checkbox" id="chk-${i}"><label for="chk-${i}">${c}</label></li>`).join("");
  return `
  ${topBar()}
  <div class="breadcrumb"><button id="backModule">← ${mod.name}</button> / ${lesson.title}</div>
  <h1>${lesson.title}</h1>
  ${lesson.cours ? `
  <div class="cours-card">
    <div class="c-tag">Cours</div>
    <p>${lesson.cours}</p>
  </div>` : ""}
  <div class="card" style="max-width:640px;">
    <p style="line-height:1.6;">${lesson.prompt}</p>
    <textarea id="draftArea" placeholder="Écris ton texte ou tes notes ici..."></textarea>
    <p class="dim" style="font-size:12px; margin-top:6px;">Ton brouillon reste dans cette session seulement — copie-le ailleurs si tu veux le garder.</p>
    <h2 style="font-size:16px; margin-top:18px;">Grille d'auto-évaluation</h2>
    <ul class="checklist">${items}</ul>
    <button class="btn btn-gold" id="markDone" style="margin-top:6px;">Marquer cette leçon comme complétée</button>
  </div>
  `;
}
function attachLessonExpression(){
  document.getElementById("backModule").addEventListener("click", ()=>{ state.view = "moduleLessons"; render(); });
  document.getElementById("markDone").addEventListener("click", async ()=>{
    const mod = currentModule();
    const lesson = currentLesson();
    if(!state.progress[mod.id]) state.progress[mod.id] = {done:{}};
    if(!state.progress[mod.id].done) state.progress[mod.id].done = {};
    state.progress[mod.id].done[lesson.id] = true;
    await saveProgress(state.student, state.progress);
    state.view = "moduleLessons";
    render();
  });
}

/* ---------- Simulateur Expression Écrite ---------- */

function stopSimEETimer(){
  if(state.simEETimerHandle){
    clearInterval(state.simEETimerHandle);
    state.simEETimerHandle = null;
  }
}

function wordCount(text){
  const trimmed = text.trim();
  if(!trimmed) return 0;
  return trimmed.split(/\s+/).length;
}

function renderSimulateurEE(){
  const i = state.simEETaskIndex;
  const task = EE_SIM_TASKS[i];
  const remaining = Math.max(0, Math.round((state.simEEDeadline - Date.now())/1000));
  const tabs = EE_SIM_TASKS.map((t,ti)=>{
    let cls = "sim-tab";
    if(ti === i) cls += " active";
    if(state.simEETexts[ti].trim().length > 0) cls += " filled";
    return `<button class="${cls}" data-task="${ti}">${t.title.split(" — ")[0]}</button>`;
  }).join("");
  const charBtns = EE_SPECIAL_CHARS.map(c=>`<button type="button" data-char="${c}">${c}</button>`).join("");
  const wc = wordCount(state.simEETexts[i]);
  let wcClass = "ok";
  if(wc < task.minWords) wcClass = "low";
  else if(wc > task.maxWords) wcClass = "high";

  return `
  ${topBar()}
  <div class="exam-topbar">
    <div>
      <div class="exam-progress-text">Simulateur d'expression écrite</div>
      <div class="exam-progress-text">${task.title}</div>
    </div>
    <div class="exam-timer" id="simTimer">${formatMMSS(remaining)}</div>
  </div>
  <div class="sim-tabs">${tabs}</div>
  <div class="card" style="max-width:680px;">
    <p style="line-height:1.6; margin-top:0;">${task.prompt}</p>
    <p class="dim" style="font-size:12px; margin:0 0 10px;">Longueur attendue : ${task.minWords} à ${task.maxWords} mots — ${task.minutes} minutes conseillées.</p>
    <div class="sim-charbar">${charBtns}</div>
    <textarea id="simTextarea" placeholder="Écris ton texte ici...">${state.simEETexts[i]}</textarea>
    <div class="sim-wordcount ${wcClass}" id="simWordCount">${wc} mot(s)</div>
  </div>
  <div class="lesson-actions">
    <button class="btn btn-ghost" id="simPrev" ${i===0 ? "disabled" : ""}>← Tâche précédente</button>
    <button class="btn btn-gold" id="simNext">${i === EE_SIM_TASKS.length-1 ? "Terminer et corriger" : "Tâche suivante →"}</button>
  </div>
  <div id="simCorrectionZone"></div>
  `;
}

function attachSimulateurEE(){
  const textarea = document.getElementById("simTextarea");
  const wcEl = document.getElementById("simWordCount");
  const task = EE_SIM_TASKS[state.simEETaskIndex];

  textarea.addEventListener("input", ()=>{
    state.simEETexts[state.simEETaskIndex] = textarea.value;
    const wc = wordCount(textarea.value);
    wcEl.textContent = `${wc} mot(s)`;
    wcEl.className = "sim-wordcount " + (wc < task.minWords ? "low" : wc > task.maxWords ? "high" : "ok");
    document.querySelectorAll(".sim-tab").forEach((tab,ti)=>{
      tab.classList.toggle("filled", state.simEETexts[ti].trim().length > 0);
    });
  });

  document.querySelectorAll(".sim-charbar button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const start = textarea.selectionStart, end = textarea.selectionEnd;
      const val = textarea.value;
      const ch = btn.dataset.char;
      textarea.value = val.slice(0,start) + ch + val.slice(end);
      textarea.selectionStart = textarea.selectionEnd = start + ch.length;
      textarea.focus();
      textarea.dispatchEvent(new Event("input"));
    });
  });

  document.querySelectorAll(".sim-tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      state.simEETaskIndex = parseInt(tab.dataset.task);
      render();
    });
  });

  document.getElementById("simPrev").addEventListener("click", ()=>{
    if(state.simEETaskIndex > 0){ state.simEETaskIndex--; render(); }
  });
  document.getElementById("simNext").addEventListener("click", ()=>{
    if(state.simEETaskIndex < EE_SIM_TASKS.length - 1){
      state.simEETaskIndex++;
      render();
    } else {
      finishSimEE();
    }
  });

  stopSimEETimer();
  if(!state.simEEResult && !state.simEEError && !state.simEECorrecting){
    state.simEETimerHandle = setInterval(()=>{
      const remaining = Math.round((state.simEEDeadline - Date.now())/1000);
      const timerEl = document.getElementById("simTimer");
      if(timerEl){
        timerEl.textContent = formatMMSS(remaining);
        timerEl.classList.toggle("low", remaining <= 120);
      }
      if(remaining <= 0){
        finishSimEE();
      }
    }, 1000);
  }

  if(state.simEECorrecting){
    document.getElementById("simPrev").disabled = true;
    document.getElementById("simNext").disabled = true;
    document.getElementById("simCorrectionZone").innerHTML = `<p class="sim-loading">Analyse de tes 3 textes en cours, merci de patienter...</p>`;
  } else if(state.simEEResult || state.simEEError){
    document.getElementById("simPrev").disabled = true;
    document.getElementById("simNext").disabled = true;
    renderSimCorrectionZone();
  }
}

async function finishSimEE(){
  stopSimEETimer();

  if(simEEAttemptsLeft() <= 0){
    document.getElementById("simPrev") && (document.getElementById("simPrev").disabled = true);
    document.getElementById("simNext") && (document.getElementById("simNext").disabled = true);
    const zone = document.getElementById("simCorrectionZone");
    if(zone){
      zone.innerHTML = `<div class="card" style="max-width:640px; margin-top:20px;">
        <h2 style="font-size:20px;">Correction IA épuisée</h2>
        <p>Tu as utilisé ta correction gratuite. Passe à une formule payante pour continuer à recevoir des corrections détaillées.</p>
        <button class="btn btn-gold" id="goToPricingFromSim" style="margin-top:10px;">Voir les formules d'accès</button>
      </div>`;
      const btn = document.getElementById("goToPricingFromSim");
      if(btn) btn.addEventListener("click", ()=>{ state.view = "pricing"; render(); });
    }
    return;
  }

  state.simEECorrecting = true;
  state.simEEResult = null;
  state.simEEError = null;
  const zone = document.getElementById("simCorrectionZone");
  if(zone){
    zone.innerHTML = `<p class="sim-loading">Analyse de tes 3 textes en cours, merci de patienter...</p>`;
  }
  document.getElementById("simPrev") && (document.getElementById("simPrev").disabled = true);
  document.getElementById("simNext") && (document.getElementById("simNext").disabled = true);

  const tasksSummary = EE_SIM_TASKS.map((t,i)=>
    `Tâche ${t.n} (${t.minWords}-${t.maxWords} mots attendus) — Sujet : ${t.prompt}\nTexte du candidat :\n${state.simEETexts[i] || "(vide)"}`
  ).join("\n\n---\n\n");

  const systemPrompt = "Tu es un correcteur expert de l'épreuve d'Expression Écrite du TCF Canada. Réponds UNIQUEMENT avec un objet JSON valide, sans texte avant ni après, sans balises markdown. Format exact attendu : {\"score_estime_sur_20\": nombre, \"niveau_nclc_estime\": \"texte court ex: NCLC 7\", \"taches\": [{\"n\":1,\"points_forts\":[\"...\",\"...\"],\"axes_amelioration\":[\"...\",\"...\"]}, {\"n\":2,...}, {\"n\":3,...}], \"conseil_general\": \"une phrase de conseil\"}. Sois concis : maximum 2 points forts et 2 axes d'amélioration par tâche, chaque point en une courte phrase.";

  try{
    const response = await fetch("/api/anthropic", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [
          { role: "user", content: tasksSummary }
        ]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b=>b.type === "text").map(b=>b.text).join("\n");
    const cleaned = textBlocks.replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(cleaned);
    state.simEEResult = parsed;
    if(!isPremiumActive()){
      const acc = getAccess();
      acc.simEEAttemptsUsed = (acc.simEEAttemptsUsed || 0) + 1;
      await saveProgress(state.student, state.progress);
    }
  }catch(err){
    console.error("Erreur de correction IA", err);
    state.simEEError = "La correction automatique n'a pas pu être générée pour le moment. Tes textes restent visibles ci-dessus, réessaie un peu plus tard.";
  }
  state.simEECorrecting = false;
  renderSimCorrectionZone();
}

function renderSimCorrectionZone(){
  const zone = document.getElementById("simCorrectionZone");
  if(!zone) return;
  if(state.simEEError){
    zone.innerHTML = `<p class="note" style="border-top:none; padding-top:0; color:var(--error-soft);">${state.simEEError}</p>`;
    return;
  }
  const r = state.simEEResult;
  if(!r){ zone.innerHTML = ""; return; }
  const taskCards = (r.taches || []).map(t=>{
    const goodItems = (t.points_forts || []).map(p=>`<li>${p}</li>`).join("");
    const improveItems = (t.axes_amelioration || []).map(p=>`<li>${p}</li>`).join("");
    return `<div class="sim-feedback-card">
      <h3>Tâche ${t.n}</h3>
      <div class="dim" style="font-size:11px; text-transform:uppercase; letter-spacing:1px;">Points forts</div>
      <ul class="sim-feedback-list good">${goodItems}</ul>
      <div class="dim" style="font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-top:8px;">Axes d'amélioration</div>
      <ul class="sim-feedback-list improve">${improveItems}</ul>
    </div>`;
  }).join("");

  zone.innerHTML = `
    <div class="card" style="max-width:680px; margin-top:20px;">
      <p class="dim" style="margin:0 0 4px;">Score estimé</p>
      <h2 style="font-size:32px; margin:0;">${r.score_estime_sur_20}/20 <span style="font-size:16px; color:var(--text-paper-dim);">— ${r.niveau_nclc_estime || ""}</span></h2>
      <p style="margin:10px 0 0;">${r.conseil_general || ""}</p>
    </div>
    ${taskCards}
    <p class="note">Correction générée automatiquement à titre indicatif, à croiser avec l'avis d'un formateur avant l'examen réel.</p>
    <div class="lesson-actions">
      <button class="btn btn-gold" id="backModuleFromSim">Retour à Expression écrite</button>
    </div>
  `;
  const backBtn = document.getElementById("backModuleFromSim");
  if(backBtn){
    backBtn.addEventListener("click", ()=>{
      state.moduleId = "expression_ecrite";
      state.view = "moduleLessons";
      render();
    });
  }
}

render();
</script>
