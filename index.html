function attachExamRunning(){
  const questions = state.examQuestions;
  const i = state.examIndex;
  const q = questions[i];
  const needsAudioGate = q.moduleId === "co" && q.transcript && !state.examRevealedLessons.includes(q.lessonTitle);

  function revealQuestion(){
    if(!state.examRevealedLessons.includes(q.lessonTitle)){
      state.examRevealedLessons.push(q.lessonTitle);
    }
    render();
  }

  const playBtn = document.getElementById("examPlayAudio");
  if(playBtn){
    playBtn.addEventListener("click", ()=>{
      if(!window.speechSynthesis) return;
      playBtn.disabled = true;
      playBtn.textContent = "🔊 Lecture en cours...";
      const badge = document.getElementById("examListenBadge");
      if(badge) badge.textContent = "🔊 Lecture en cours — écoute bien, une seule diffusion";
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(q.transcript);
      utterance.lang = "fr-FR";
      utterance.rate = 0.95;
      utterance.onend = ()=>{ revealQuestion(); };
      utterance.onerror = ()=>{ revealQuestion(); };
      window.speechSynthesis.speak(utterance);
    });
  }
  const skipBtn = document.getElementById("examSkipListen");
  if(skipBtn){ skipBtn.addEventListener("click", revealQuestion); }

  if(needsAudioGate) return; // pas de questions/navigation tant que l'audio n'est pas écouté

  function refreshOptionsUI(){
    const idx = state.examIndex;
    const chosen = state.examAnswers[idx];
    document.querySelectorAll("#examOptions .option-row").forEach(btn=>{
      const oi = parseInt(btn.dataset.o);
      btn.classList.toggle("current-selected", chosen === oi);
      btn.style.borderColor = chosen === oi ? "var(--gold)" : "";
      btn.style.background = chosen === oi ? "var(--gold-soft)" : "";
    });
  }
  refreshOptionsUI();

  document.querySelectorAll("#examOptions .option-row").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.examAnswers[state.examIndex] = parseInt(btn.dataset.o);
      refreshOptionsUI();
    });
  });

  document.getElementById("examPrev").addEventListener("click", ()=>{
    if(state.examIndex > 0){ state.examIndex--; render(); }
  });
  document.getElementById("examNext").addEventListener("click", ()=>{
    if(state.examIndex < questions.length - 1){
      state.examIndex++;
      render();
    } else {
      finishExam();
    }
  });

  stopExamTimer();
  state.examTimerHandle = setInterval(()=>{
    const remaining = Math.round((state.examDeadline - Date.now())/1000);
    const timerEl = document.getElementById("examTimer");
    if(timerEl){
      timerEl.textContent = formatMMSS(remaining);
      timerEl.classList.toggle("low", remaining <= 60);
    }
    if(remaining <= 0){
      finishExam();
    }
  }, 1000);
}

function finishExam(){
  stopExamTimer();
  const questions = state.examQuestions;
  const answers = state.examAnswers;
  recordErrorsFromExam(questions, answers); // asynchrone, n'empêche pas la suite

  if(state.fullExamPhase){
    let correct = 0;
    questions.forEach((q,i)=>{ if(answers[i] === q.answer) correct++; });
    const total = questions.length;
    const score = total ? Math.round((correct/total)*100) : 0;
    const byLevel = {};
    LEVELS.forEach(lv=> byLevel[lv] = {correct:0, total:0});
    questions.forEach((q,i)=>{
      byLevel[q.level].total++;
      if(answers[i] === q.answer) byLevel[q.level].correct++;
    });
    const phaseResult = { correct, total, score, byLevel };

    if(state.fullExamPhase === "co"){
      state.fullExamCoResult = phaseResult;
      // Passage automatique à la phase Compréhension écrite
      state.fullExamPhase = "ce";
      const ceQuestions = buildFullExam("ce");
      state.examQuestions = ceQuestions;
      state.examAnswers = new Array(ceQuestions.length).fill(null);
      state.examIndex = 0;
      state.examRevealedLessons = [];
      state.examDeadline = Date.now() + FULL_EXAM_CONFIG.ce.minutes * 60 * 1000;
      state.view = "examRunning";
      render();
      return;
    } else {
      state.fullExamCeResult = phaseResult;
      state.fullExamPhase = null;
      const co = state.fullExamCoResult, ce = phaseResult;
      const pointsForts = [], pointsAmeliorer = [];
      if(co.score >= 70) pointsForts.push("Compréhension orale"); else if(co.score < 50) pointsAmeliorer.push("Compréhension orale");
      if(ce.score >= 70) pointsForts.push("Compréhension écrite"); else if(ce.score < 50) pointsAmeliorer.push("Compréhension écrite");
      state.fullExamPointsForts = pointsForts;
      state.fullExamPointsAmeliorer = pointsAmeliorer;
      state.fullExamRecommandation = pointsAmeliorer.length
        ? `Concentre-toi en priorité sur : ${pointsAmeliorer.join(", ")}.`
        : "Bon équilibre entre les deux compétences — continue à t'entraîner régulièrement pour progresser encore.";
      const globalScore = Math.round((co.score + ce.score) / 2);
      updateDayStreak(state.progress);
      saveExamHistoryEntry({ type: "complet", level: "A1-C2", score: globalScore, total: co.total + ce.total });
      state.view = "examFullResult";
      render();
      return;
    }
  }

  const byModule = {};
  EXAM_QUIZ_MODULE_IDS.forEach(id=> byModule[id] = {correct:0, total:0});
  questions.forEach((q,i)=>{
    byModule[q.moduleId].total++;
    if(answers[i] === q.answer) byModule[q.moduleId].correct++;
  });
  const totalCorrect = Object.values(byModule).reduce((a,b)=>a+b.correct,0);
  const totalQuestions = questions.length;
  const globalScore = totalQuestions ? Math.round((totalCorrect/totalQuestions)*100) : 0;

  const modLabels = {co:"Compréhension orale", ce:"Compréhension écrite", structures:"Structures de la langue"};
  const pointsForts = [], pointsAmeliorer = [];
  Object.entries(byModule).forEach(([id,m])=>{
    if(m.total === 0) return;
    const pct = Math.round((m.correct/m.total)*100);
    if(pct >= 70) pointsForts.push(modLabels[id]);
    else if(pct < 50) pointsAmeliorer.push(modLabels[id]);
  });
  let recommandation;
  if(pointsAmeliorer.length) recommandation = `Concentre-toi en priorité sur : ${pointsAmeliorer.join(", ")}.`;
  else if(globalScore >= 70) recommandation = "Bon niveau général — continue à varier les exercices pour consolider tes acquis.";
  else recommandation = "Continue à t'entraîner régulièrement sur ce niveau avant de passer au suivant.";

  state.examResult = { byModule, globalScore, totalCorrect, totalQuestions, pointsForts, pointsAmeliorer, recommandation };
  updateDayStreak(state.progress);
  saveExamHistoryEntry({
    type: state.examMode || "niveau",
    level: state.examLevel,
    competence: state.examCompetence || null,
    score: globalScore,
    total: totalQuestions
  });
  if(state.currentDevoirId){
    if(!state.progress.devoirsCompletes) state.progress.devoirsCompletes = {};
    state.progress.devoirsCompletes[state.currentDevoirId] = { score: globalScore, date: Date.now() };
    saveProgress(state.student, state.progress);
    state.currentDevoirId = null;
  }
  state.view = "examResult";
  render();
}

function attachLessonQuiz(){
  document.getElementById("backModule").addEventListener("click", ()=>{
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    state.view = "moduleLessons";
    render();
  });
  const lesson = currentLesson();
  const isAudio = !!lesson.transcript;
  const answers = new Array(lesson.questions.length).fill(null);

  function showQuestions(){
    const wrap = document.getElementById("questionsWrap");
    const passageCard = document.getElementById("passageCard");
    if(passageCard && isAudio) passageCard.style.display = "none";
    wrap.style.display = "block";
    wrap.innerHTML = lesson.questions.map((q, qi)=>{
      const opts = q.options.map((o,oi)=>`<button class="option-row" data-q="${qi}" data-o="${oi}">${o}</button>`).join("");
      return `<div class="card" style="margin-bottom:14px; max-width:640px;">
        <p class="qtext">${qi+1}. ${q.q}</p>
        ${opts}
        <div class="feedback" id="fb-${qi}"></div>
      </div>`;
    }).join("");
    wrap.querySelectorAll(".option-row").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qi = parseInt(btn.dataset.q);
        if(answers[qi] !== null) return;
        const oi = parseInt(btn.dataset.o);
        answers[qi] = oi;
        const group = wrap.querySelectorAll(`.option-row[data-q="${qi}"]`);
        group.forEach(b=>{
          b.setAttribute("disabled","true");
          if(parseInt(b.dataset.o) === lesson.questions[qi].answer) b.classList.add("correct");
          else if(parseInt(b.dataset.o) === oi) b.classList.add("wrong");
        });
        const fb = document.getElementById(`fb-${qi}`);
        const correct = oi === lesson.questions[qi].answer;
        fb.textContent = correct ? "Bonne réponse." : "Ce n'est pas la bonne réponse.";
        fb.className = "feedback " + (correct ? "ok" : "ko");
        if(!correct){
          const mod = currentModule();
          recordError({
            lessonTitle: lesson.title, question: lesson.questions[qi].q,
            reponseDonnee: lesson.questions[qi].options[oi], bonneReponse: lesson.questions[qi].options[lesson.questions[qi].answer],
            niveau: lesson.level || null, competence: lessonCompetence(mod.id, lesson.title)
          });
        }
        if(answers.every(a=>a !== null)){
          document.getElementById("finishQuiz").style.display = "inline-block";
        }
      });
    });
  }

  const playBtn = document.getElementById("playAudio");
  if(playBtn){
    playBtn.addEventListener("click", ()=>{
      if(!window.speechSynthesis) return;
      playBtn.disabled = true;
      playBtn.textContent = "🔊 Lecture en cours...";
      const badge = document.getElementById("listenBadge");
      if(badge) badge.textContent = "🔊 Lecture en cours — écoute bien, une seule diffusion";
      const status = document.getElementById("listenStatus");
      if(status) status.textContent = "";
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(lesson.transcript);
      utterance.lang = "fr-FR";
      utterance.rate = 0.95;
      utterance.onend = ()=>{
        playBtn.textContent = "✅ Message déjà écouté";
        if(badge) badge.textContent = "✅ Message écouté — il ne peut pas être réécouté, comme à l'examen";
        if(status) status.textContent = "Tu peux maintenant passer aux questions.";
        const hideBtn = document.getElementById("hidePassage");
        if(hideBtn) hideBtn.style.display = "inline-block";
      };
      utterance.onerror = ()=>{
        playBtn.textContent = "⚠️ Erreur de lecture";
        if(status) status.textContent = "La lecture audio a échoué. Tu peux quand même continuer vers les questions.";
        const hideBtn = document.getElementById("hidePassage");
        if(hideBtn) hideBtn.style.display = "inline-block";
      };
      window.speechSynthesis.speak(utterance);
    });
  }

  const hideBtn = document.getElementById("hidePassage");
  if(hideBtn){ hideBtn.addEventListener("click", showQuestions); }
  else if(!isAudio){ showQuestions(); }

  document.getElementById("finishQuiz").addEventListener("click", async ()=>{
    const correctCount = answers.filter((a,i)=>a === lesson.questions[i].answer).length;
    const score = Math.round((correctCount/lesson.questions.length)*100);
    const mod = currentModule();
    if(!state.progress[mod.id]) state.progress[mod.id] = {scores:{}};
    if(!state.progress[mod.id].scores) state.progress[mod.id].scores = {};
    state.progress[mod.id].scores[lesson.id] = score;

    // Suivi du temps d'étude et des séries (streaks), sans jamais réinitialiser l'existant
    const elapsed = state.lessonStartTime ? Math.round((Date.now() - state.lessonStartTime)/1000) : 0;
    state.progress.studyTimeSeconds = (state.progress.studyTimeSeconds || 0) + elapsed;
    state.progress.totalSessions = (state.progress.totalSessions || 0) + 1;
    updateDayStreak(state.progress);
    if(score >= REUSSITE_SEUIL){
      state.progress.currentStreak = (state.progress.currentStreak || 0) + 1;
      state.progress.bestStreak = Math.max(state.progress.bestStreak || 0, state.progress.currentStreak);
    } else {
      state.progress.currentStreak = 0;
    }

    await saveProgress(state.student, state.progress);
    document.getElementById("finishQuiz").style.display = "none";
    document.getElementById("scoreResult").innerHTML = `
      <div class="card" style="max-width:640px; margin-top:6px;">
        <h2>Résultat : ${score}%</h2>
        <p>${correctCount} bonne(s) réponse(s) sur ${lesson.questions.length}.</p>
        <button class="btn btn-gold" id="backToModuleAfter">Retour aux leçons</button>
      </div>`;
    document.getElementById("backToModuleAfter").addEventListener("click", ()=>{ state.view = "moduleLessons"; render(); });
  });
}

function wordCount(text){
  const trimmed = text.trim();
  if(!trimmed) return 0;
  return trimmed.split(/\s+/).length;
}

function renderSimulateurEE(){
  const i = state.simEETaskIndex;
  const task = EE_SIM_TASKS[i];
  const remaining = Math.max(0, Math.round((state.simEEDeadline - Date.now())/1000));
  const tabs = EE_SIM_TASKS.map((t,ti)=>{
    let cls = "sim-tab";
    if(ti === i) cls += " active";
    if(state.simEETexts[ti].trim().length > 0) cls += " filled";
    return `<button class="${cls}" data-task="${ti}">${t.title.split(" — ")[0]}</button>`;
  }).join("");
  const charBtns = EE_SPECIAL_CHARS.map(c=>`<button type="button" data-char="${c}">${c}</button>`).join("");
  const wc = wordCount(state.simEETexts[i]);
  let wcClass = "ok";
  if(wc < task.minWords) wcClass = "low";
  else if(wc > task.maxWords) wcClass = "high";

  return `
  ${topBar()}
  <div class="exam-topbar">
    <div>
      <div class="exam-progress-text">Simulateur d'expression écrite</div>
      <div class="exam-progress-text">${task.title}</div>
    </div>
    <div class="exam-timer" id="simTimer">${formatMMSS(remaining)}</div>
  </div>
  <div class="sim-tabs">${tabs}</div>
  <div class="card" style="max-width:680px;">
    <p style="line-height:1.6; margin-top:0;">${task.prompt}</p>
    <p class="dim" style="font-size:12px; margin:0 0 10px;">Longueur attendue : ${task.minWords} à ${task.maxWords} mots — ${task.minutes} minutes conseillées.</p>
    <div class="sim-charbar">${charBtns}</div>
    <textarea id="simTextarea" placeholder="Écris ton texte ici...">${state.simEETexts[i]}</textarea>
    <div class="sim-wordcount ${wcClass}" id="simWordCount">${wc} mot(s)</div>
  </div>
  <div class="lesson-actions">
    <button class="btn btn-ghost" id="simPrev" ${i===0 ? "disabled" : ""}>← Tâche précédente</button>
    <button class="btn btn-gold" id="simNext">${i === EE_SIM_TASKS.length-1 ? "Terminer et corriger" : "Tâche suivante →"}</button>
  </div>
  <div id="simCorrectionZone"></div>
  `;
}

function attachSimulateurEE(){
  const textarea = document.getElementById("simTextarea");
  const wcEl = document.getElementById("simWordCount");
  const task = EE_SIM_TASKS[state.simEETaskIndex];

  textarea.addEventListener("input", ()=>{
    state.simEETexts[state.simEETaskIndex] = textarea.value;
    const wc = wordCount(textarea.value);
    wcEl.textContent = `${wc} mot(s)`;
    wcEl.className = "sim-wordcount " + (wc < task.minWords ? "low" : wc > task.maxWords ? "high" : "ok");
    document.querySelectorAll(".sim-tab").forEach((tab,ti)=>{
      tab.classList.toggle("filled", state.simEETexts[ti].trim().length > 0);
    });
  });

  document.querySelectorAll(".sim-charbar button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const start = textarea.selectionStart, end = textarea.selectionEnd;
      const val = textarea.value;
      const ch = btn.dataset.char;
      textarea.value = val.slice(0,start) + ch + val.slice(end);
      textarea.selectionStart = textarea.selectionEnd = start + ch.length;
      textarea.focus();
      textarea.dispatchEvent(new Event("input"));
    });
  });

  document.querySelectorAll(".sim-tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      state.simEETaskIndex = parseInt(tab.dataset.task);
      render();
    });
  });

  document.getElementById("simPrev").addEventListener("click", ()=>{
    if(state.simEETaskIndex > 0){ state.simEETaskIndex--; render(); }
  });
  document.getElementById("simNext").addEventListener("click", ()=>{
    if(state.simEETaskIndex < EE_SIM_TASKS.length - 1){
      state.simEETaskIndex++;
      render();
    } else {
      finishSimEE();
    }
  });

  stopSimEETimer();
  if(!state.simEEResult && !state.simEEError && !state.simEECorrecting){
    state.simEETimerHandle = setInterval(()=>{
      const remaining = Math.round((state.simEEDeadline - Date.now())/1000);
      const timerEl = document.getElementById("simTimer");
      if(timerEl){
        timerEl.textContent = formatMMSS(remaining);
        timerEl.classList.toggle("low", remaining <= 120);
      }
      if(remaining <= 0){
        finishSimEE();
      }
    }, 1000);
  }

  if(state.simEECorrecting){
    document.getElementById("simPrev").disabled = true;
    document.getElementById("simNext").disabled = true;
    document.getElementById("simCorrectionZone").innerHTML = `<p class="sim-loading">Analyse de tes 3 textes en cours, merci de patienter...</p>`;
  } else if(state.simEEResult || state.simEEError){
    document.getElementById("simPrev").disabled = true;
    document.getElementById("simNext").disabled = true;
    renderSimCorrectionZone();
  }
}

async function finishSimEE(){
  stopSimEETimer();

  if(simEEAttemptsLeft() <= 0){
    document.getElementById("simPrev") && (document.getElementById("simPrev").disabled = true);
    document.getElementById("simNext") && (document.getElementById("simNext").disabled = true);
    const zone = document.getElementById("simCorrectionZone");
    if(zone){
      zone.innerHTML = `<div class="card" style="max-width:640px; margin-top:20px;">
        <h2 style="font-size:20px;">Correction IA épuisée</h2>
        <p>Tu as utilisé ta correction gratuite. Passe à une formule payante pour continuer à recevoir des corrections détaillées.</p>
        <button class="btn btn-gold" id="goToPricingFromSim" style="margin-top:10px;">Voir les formules d'accès</button>
      </div>`;
      const btn = document.getElementById("goToPricingFromSim");
      if(btn) btn.addEventListener("click", ()=>{ state.view = "pricing"; render(); });
    }
    return;
  }

  state.simEECorrecting = true;
  state.simEEResult = null;
  state.simEEError = null;
  const zone = document.getElementById("simCorrectionZone");
  if(zone){
    zone.innerHTML = `<p class="sim-loading">Analyse de tes 3 textes en cours, merci de patienter...</p>`;
  }
  document.getElementById("simPrev") && (document.getElementById("simPrev").disabled = true);
  document.getElementById("simNext") && (document.getElementById("simNext").disabled = true);

  const tasksSummary = EE_SIM_TASKS.map((t,i)=>
    `Tâche ${t.n} (${t.minWords}-${t.maxWords} mots attendus) — Sujet : ${t.prompt}\nTexte du candidat :\n${state.simEETexts[i] || "(vide)"}`
  ).join("\n\n---\n\n");

  const systemPrompt = "Tu es un correcteur expert de l'épreuve d'Expression Écrite du TCF Canada. Réponds UNIQUEMENT avec un objet JSON valide, sans texte avant ni après, sans balises markdown. Format exact attendu : {\"score_estime_sur_20\": nombre, \"niveau_nclc_estime\": \"texte court ex: NCLC 7\", \"taches\": [{\"n\":1,\"points_forts\":[\"...\",\"...\"],\"axes_amelioration\":[\"...\",\"...\"]}, {\"n\":2,...}, {\"n\":3,...}], \"conseil_general\": \"une phrase de conseil\"}. Sois concis : maximum 2 points forts et 2 axes d'amélioration par tâche, chaque point en une courte phrase.";

  try{
    const response = await fetch("/api/anthropic", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [
          { role: "user", content: tasksSummary }
        ]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b=>b.type === "text").map(b=>b.text).join("\n");
    const cleaned = textBlocks.replace(/```json|```/g,"").trim();
    const parsed = JSON.parse(cleaned);
    state.simEEResult = parsed;
    if(!isPremiumActive()){
      const acc = getAccess();
      acc.simEEAttemptsUsed = (acc.simEEAttemptsUsed || 0) + 1;
      await saveProgress(state.student, state.progress);
    }
  }catch(err){
    console.error("Erreur de correction IA", err);
    state.simEEError = "La correction automatique n'a pas pu être générée pour le moment. Tes textes restent visibles ci-dessus, réessaie un peu plus tard.";
  }
  state.simEECorrecting = false;
  renderSimCorrectionZone();
}

function renderSimCorrectionZone(){
  const zone = document.getElementById("simCorrectionZone");
  if(!zone) return;
  if(state.simEEError){
    zone.innerHTML = `<p class="note" style="border-top:none; padding-top:0; color:var(--error-soft);">${state.simEEError}</p>`;
    return;
  }
  const r = state.simEEResult;
  if(!r){ zone.innerHTML = ""; return; }
  const taskCards = (r.taches || []).map(t=>{
    const goodItems = (t.points_forts || []).map(p=>`<li>${p}</li>`).join("");
    const improveItems = (t.axes_amelioration || []).map(p=>`<li>${p}</li>`).join("");
    return `<div class="sim-feedback-card">
      <h3>Tâche ${t.n}</h3>
      <div class="dim" style="font-size:11px; text-transform:uppercase; letter-spacing:1px;">Points forts</div>
      <ul class="sim-feedback-list good">${goodItems}</ul>
      <div class="dim" style="font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-top:8px;">Axes d'amélioration</div>
      <ul class="sim-feedback-list improve">${improveItems}</ul>
    </div>`;
  }).join("");

  zone.innerHTML = `
    <div class="card" style="max-width:680px; margin-top:20px;">
      <p class="dim" style="margin:0 0 4px;">Score estimé</p>
      <h2 style="font-size:32px; margin:0;">${r.score_estime_sur_20}/20 <span style="font-size:16px; color:var(--text-paper-dim);">— ${r.niveau_nclc_estime || ""}</span></h2>
      <p style="margin:10px 0 0;">${r.conseil_general || ""}</p>
    </div>
    ${taskCards}
    <p class="note">Correction générée automatiquement à titre indicatif, à croiser avec l'avis d'un formateur avant l'examen réel.</p>
    <div class="lesson-actions">
      <button class="btn btn-gold" id="backModuleFromSim">Retour à Expression écrite</button>
    </div>
  `;
  const backBtn = document.getElementById("backModuleFromSim");
  if(backBtn){
    backBtn.addEventListener("click", ()=>{
      state.moduleId = "expression_ecrite";
      state.view = "moduleLessons";
      render();
    });
  }
}

// Restaure la session formateur si un jeton valide et non expiré existe déjà
// (émis précédemment par Supabase Auth) — jamais une simple variable recréée à la main.
const restoredSession = loadStoredFormateurSession();
if(restoredSession){
  state.adminAuthed = true;
  state.formateurSession = restoredSession;
}

render();
</script>
</body>
